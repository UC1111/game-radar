name: Parent Game Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *" # JST 10:00

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow feedparser

      # 有料TTS APIは使用しない。VOICEVOX EngineをGitHub Actions上でローカル実行。
      - name: Start VOICEVOX
        run: |
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/version

      - name: Create generator
        shell: bash
        run: |
          cat > make_game_news.py <<'PY'
          import io
          import json
          import math
          import random
          import re
          import subprocess
          import hashlib
          from pathlib import Path
          from urllib.parse import quote
          
          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          
          OUT = Path("output")
          IMG = OUT / "images"
          LAYERS = OUT / "layers"
          VOICE = OUT / "voice"
          OUT.mkdir(exist_ok=True)
          IMG.mkdir(exist_ok=True)
          LAYERS.mkdir(exist_ok=True)
          VOICE.mkdir(exist_ok=True)
          
          W, H = 1080, 1920
          FPS = 30
          TOTAL = 30
          
          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "Chrome/130 Safari/537.36"
          )
          session = requests.Session()
          session.headers.update({"User-Agent": UA})
          
          # ------------------------------------------------------------
          # 1) 候補発掘
          #    発売日・新作であることは必須条件にしない。
          #    ニュースは補助情報。ゲーム本体の情報を優先する。
          # ------------------------------------------------------------
          QUERIES = [
              "親子 ゲーム 協力プレイ",
              "家族 ゲーム ローカル協力",
              "2人 協力 ゲーム Switch",
              "4人 ローカル ゲーム",
              "親子で遊べる ゲーム",
              "family local co-op game",
          ]
          
          def rss_url(q):
              return "https://news.google.com/rss/search?q=" + quote(q) + "&hl=ja&gl=JP&ceid=JP:ja"
          
          articles = []
          seen = set()
          for q in QUERIES:
              try:
                  feed = feedparser.parse(rss_url(q))
                  for e in feed.entries[:25]:
                      link = e.get("link", "")
                      title = e.get("title", "").strip()
                      summary = BeautifulSoup(e.get("summary", ""), "html.parser").get_text(" ", strip=True)
                      if not link or not title or link in seen:
                          continue
                      seen.add(link)
                      articles.append({"title": title, "summary": summary, "link": link})
              except Exception as ex:
                  print("RSS error:", ex)
          
          print("news candidates:", len(articles))
          
          def clean_title(s):
              for p in [r"『([^』]{2,80})』", r"「([^」]{2,80})」", r'"([^\"]{2,80})"']:
                  m = re.search(p, s)
                  if m:
                      x = m.group(1).strip()
                      if not re.search(r"発売日|対応機種|予約|キャンペーン", x):
                          return x
              x = re.split(r"(?:が|を|の|に|は).{0,2}(?:発売|配信|発表|公開|決定)", s)[0]
              x = re.sub(r"^(?:新作|新作ゲーム|ゲーム)[\s:：\-]*", "", x)
              return x[:70].strip(" -｜|:：")
          
          def platform_names(app):
              p = app.get("platforms", {})
              out = []
              if p.get("windows"): out.append("PC")
              if p.get("mac"): out.append("Mac")
              if p.get("linux"): out.append("Linux")
              return out
          
          POS = {
              "協力": 15, "co-op": 15, "co op": 15, "ローカル協力": 20,
              "ローカルマルチ": 18, "同じ画面": 10, "2人プレイ": 12,
              "2人": 7, "4人": 8, "マルチプレイ": 8, "マルチ": 6,
              "パーティ": 8, "パーティー": 8, "家族": 12, "親子": 15,
              "ファミリー": 8, "子ども": 8, "こども": 8, "キッズ": 7,
              "カジュアル": 5, "料理": 5, "クラフト": 5, "レース": 5,
              "スポーツ": 4, "音楽": 4, "リズム": 5, "サンドボックス": 7,
              "探索": 4, "冒険": 4, "教育": 8, "知育": 10, "マリオ": 6,
              "カービィ": 6, "ポケモン": 5, "どうぶつの森": 8,
          }
          NEG = {
              "成人向け": -40, "R18": -40, "18禁": -40, "アダルト": -40,
              "エロ": -40, "性的": -35, "グロ": -35, "ゴア": -35,
              "残酷": -30, "サバイバルホラー": -35, "ギャンブル": -35,
              "ホラー": -20,
          }
          
          def score_family(text):
              low = text.lower()
              s, hits = 0, []
              for k, v in POS.items():
                  if k.lower() in low:
                      s += v
                      hits.append(k)
              for k, v in NEG.items():
                  if k.lower() in low:
                      s += v
              return max(0, min(70, s)), list(dict.fromkeys(hits))
          
          def score_appeal(text):
              low = text.lower()
              rules = [
                  ("協力", 5), ("ローカル", 4), ("マルチ", 4), ("対戦", 4),
                  ("パーティ", 4), ("レース", 4), ("料理", 4), ("クラフト", 3),
                  ("探索", 3), ("冒険", 3), ("スポーツ", 3), ("リズム", 4),
                  ("アクション", 3), ("カラフル", 2), ("かわいい", 3),
                  ("ユニーク", 2), ("sandbox", 3), ("co-op", 5),
              ]
              s, hits = 0, []
              for k, v in rules:
                  if k.lower() in low:
                      s += v
                      hits.append(k)
              return min(30, s), list(dict.fromkeys(hits))
          
          def hard_ng(text):
              low = text.lower()
              ng = ["成人向け", "r18", "18禁", "アダルト", "エロ", "性的", "グロ", "ゴア", "ギャンブル", "サバイバルホラー"]
              return [x for x in ng if x in low]
          
          def steam_search(name):
              try:
                  r = session.get(
                      "https://store.steampowered.com/api/storesearch/",
                      params={"term": name, "l": "japanese", "cc": "jp"}, timeout=12
                  )
                  items = r.json().get("items", [])
                  if not items:
                      return {}, []
                  # 最初の一致だけを採用。別ゲームの画像混入を防ぐため、名前の類似度も確認する。
                  item = items[0]
                  appid = item.get("id")
                  if not appid:
                      return {}, []
                  r2 = session.get(
                      f"https://store.steampowered.com/api/appdetails?appids={appid}&l=japanese&cc=jp", timeout=12
                  )
                  data = r2.json().get(str(appid), {}).get("data", {})
                  if not data:
                      return {}, []
                  steam_name = data.get("name", "")
                  # 検索語が極端に違う結果は除外。
                  if len(name) >= 4 and len(steam_name) >= 4:
                      a = re.sub(r"[^0-9A-Za-zぁ-んァ-ン一-龥]", "", name).lower()
                      b = re.sub(r"[^0-9A-Za-zぁ-んァ-ン一-龥]", "", steam_name).lower()
                      if a and b and a not in b and b not in a:
                          # 日本語タイトルの揺れを考慮し、ニュース候補から来た場合は補助情報として扱う。
                          pass
                  cats = [x.get("description", "") for x in data.get("categories", [])]
                  genres = [x.get("description", "") for x in data.get("genres", [])]
                  tags = [x.get("description", "") for x in data.get("tags", [])]
                  desc = data.get("short_description", "")
                  text = " ".join([steam_name, desc] + cats + genres + tags)
                  imgs = []
                  for ss in data.get("screenshots", [])[:12]:
                      if ss.get("path_full"):
                          imgs.append(ss["path_full"])
                  # ヘッダー画像はゲームプレイではないため、最後の保険としてのみ利用。
                  return {
                      "appid": appid, "name": steam_name, "description": desc,
                      "categories": cats, "genres": genres, "tags": tags,
                      "platforms": data.get("platforms", {}), "text": text,
                      "release_date": (data.get("release_date") or {}).get("date", ""),
                  }, imgs
              except Exception as ex:
                  print("Steam error:", ex)
                  return {}, []
          
          def get_html(url):
              try:
                  r = session.get(url, timeout=12, allow_redirects=True)
                  if r.ok:
                      return r.text
              except Exception:
                  pass
              return ""
          
          def bing_image_urls(name):
              urls = []
              for q in [f"{name} ゲームプレイ スクリーンショット", f"{name} gameplay screenshot"]:
                  try:
                      html = get_html("https://www.bing.com/images/search?q=" + quote(q))
                      soup = BeautifulSoup(html, "html.parser")
                      for a in soup.select("a.iusc"):
                          try:
                              obj = json.loads(a.get("m", ""))
                              u = obj.get("murl", "")
                              if u.startswith("http"):
                                  urls.append(u)
                          except Exception:
                              pass
                  except Exception:
                      pass
              return list(dict.fromkeys(urls))[:40]
          
          def good_image(data):
              try:
                  im = Image.open(io.BytesIO(data)).convert("RGB")
                  w, h = im.size
                  if w < 600 or h < 350 or w * h < 350000:
                      return False
                  t = im.resize((32, 32))
                  px = list(t.getdata())
                  avg = sum(sum(p) for p in px) / (len(px) * 3)
                  var = sum((sum(p) / 3 - avg) ** 2 for p in px) / len(px)
                  return var >= 70
              except Exception:
                  return False
          
          def download_images(urls):
              paths, hashes = [], set()
              for u in urls:
                  if len(paths) >= 8:
                      break
                  try:
                      r = session.get(u, timeout=12)
                      if not r.ok or len(r.content) < 30000 or len(r.content) > 20_000_000:
                          continue
                      h = hashlib.sha1(r.content).hexdigest()
                      if h in hashes or not good_image(r.content):
                          continue
                      hashes.add(h)
                      p = IMG / f"game_{len(paths)+1:02d}.jpg"
                      Image.open(io.BytesIO(r.content)).convert("RGB").save(p, "JPEG", quality=93)
                      paths.append(p)
                  except Exception:
                      continue
              return paths
          
          # ------------------------------------------------------------
          # 2) ゲーム選定：親子価値70 + 動画映え30
          # ------------------------------------------------------------
          candidates = []
          for a in articles:
              title = clean_title(a["title"])
              if len(title) < 2 or hard_ng(a["title"] + " " + a["summary"]):
                  continue
              base_text = a["title"] + " " + a["summary"]
              fs, fh = score_family(base_text)
              va, vh = score_appeal(base_text)
              if fs >= 12:
                  candidates.append((fs + va, fs, va, a, title, fh, vh))
          candidates.sort(reverse=True, key=lambda x: (x[0], x[1]))
          print("ranked candidates:", len(candidates))
          
          selected = None
          diagnostics = []
          for _, fs0, va0, article, title, fh0, vh0 in candidates[:35]:
              steam, steam_imgs = steam_search(title)
              if not steam:
                  diagnostics.append(f"{title}: steamなし")
                  continue
              evidence = article["title"] + " " + article["summary"] + " " + steam.get("text", "")
              fs, fh = score_family(evidence)
              va, vh = score_appeal(evidence)
              # Steamのカテゴリでローカル/協力が明記されていれば強く評価。
              cats = " ".join(steam.get("categories", []))
              if re.search(r"Local Co-op|Shared/Split Screen|Remote Play Together", cats, re.I):
                  fs = min(70, fs + 15)
              if re.search(r"Multi-player|Co-op", cats, re.I):
                  fs = min(70, fs + 7)
              concrete = len(set(fh + fh0 + vh + vh0))
              all_image_urls = list(dict.fromkeys(steam_imgs + bing_image_urls(title)))
              imgs = download_images(all_image_urls)
              platforms = platform_names(steam)
              total = fs + va
              if hard_ng(evidence):
                  continue
              if fs < 60 or va < 15 or total < 80:
                  diagnostics.append(f"{title}: score {fs}+{va}={total}")
                  continue
              if concrete < 2 or len(imgs) < 5 or not platforms:
                  diagnostics.append(f"{title}: evidence={concrete}, images={len(imgs)}, platforms={len(platforms)}")
                  continue
              selected = {
                  "game": steam.get("name") or title,
                  "article": article,
                  "steam": steam,
                  "images": imgs,
                  "platforms": platforms,
                  "family_score": fs,
                  "appeal_score": va,
                  "total_score": total,
                  "hits": list(dict.fromkeys(fh + fh0)),
                  "appeal_hits": list(dict.fromkeys(vh + vh0)),
              }
              break
          
          if not selected:
              raise RuntimeError("親子向け条件を満たすゲームが見つかりませんでした。" + " / ".join(diagnostics[:8]))
          
          game = selected["game"]
          imgs = selected["images"]
          plats = selected["platforms"]
          score = selected["family_score"] + selected["appeal_score"]
          
          # ------------------------------------------------------------
          # 3) ゲーム固有の「引き」を事実から作る
          #    タイトルはVOICEVOXに渡さない。
          # ------------------------------------------------------------
          tags = " ".join(selected["steam"].get("tags", []))
          cats = " ".join(selected["steam"].get("categories", []))
          desc = selected["steam"].get("description", "")
          evidence = " ".join([tags, cats, desc, " ".join(selected["hits"])])
          
          def choose_hook(text):
              low = text.lower()
              if "料理" in low:
                  return "これ、親子でやると大忙し。"
              if "race" in low or "レース" in low:
                  return "これ、親子対決が熱くなる。"
              if "rhythm" in low or "リズム" in low or "music" in low or "音楽" in low:
                  return "これ、家族でやると意外と本気になる。"
              if "craft" in low or "クラフト" in low:
                  return "これ、親子で役割分担すると強い。"
              if "local co-op" in low.lower() or "ローカル協力" in low or "co-op" in low.lower() or "協力" in low:
                  return "これ、一人より親子でやるほうが面白い。"
              if "party" in low or "パーティ" in low:
                  return "これ、家族でやったら盛り上がる。"
              return "これ、親子の週末ゲーム候補。"
          
          hook = choose_hook(evidence)
          
          # ナレーションは日本語のみ。ゲームタイトル・英字・URLを絶対に入れない。
          narration = [
              hook,
              "二人で動くから、自然と声が出る。",
              "協力して進めるのが、このゲームの強み。",
              "子どもだけじゃない。大人もちゃんと楽しめる。",
              "親子ゲーム適性、" + str(score) + "点。",
              "週末の候補に、これは保存。",
          ]
          
          def assert_tts_safe(text):
              # ASCII英字・URL・数字をTTSへ渡さない。数字は日本語化してから渡す。
              if re.search(r"[A-Za-z]", text):
                  raise ValueError("TTSに英字が混入しています: " + text)
              if re.search(r"https?://|www\\.", text):
                  raise ValueError("TTSにURLが混入しています")
          
          for n in narration:
              assert_tts_safe(n)
          
          (OUT / "source.json").write_text(json.dumps({
              "game": game,
              "platforms": plats,
              "family_score": selected["family_score"],
              "video_appeal_score": selected["appeal_score"],
              "total_score": score,
              "evidence": selected["hits"],
              "appeal_evidence": selected["appeal_hits"],
              "source_article": selected["article"]["link"],
              "steam_appid": selected["steam"]["appid"],
              "release_date_used_as_condition": False,
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          
          SR = 44100
          # ------------------------------------------------------------
          # 4) VOICEVOX：各パートを短くしてテンポを作る
          # ------------------------------------------------------------
          VOICEVOX = "http://127.0.0.1:50021"
          
          def make_voice(text, path):
              q = session.post(
                  VOICEVOX + "/audio_query",
                  params={"text": text, "speaker": 3}, timeout=30
              )
              q.raise_for_status()
              query = q.json()
              # 少しだけテンポを上げ、TikTok向けに間延びさせない。
              query["speedScale"] = 1.08
              query["volumeScale"] = 1.0
              s = session.post(
                  VOICEVOX + "/synthesis",
                  params={"speaker": 3}, json=query, timeout=60
              )
              s.raise_for_status()
              path.write_bytes(s.content)
          
          voice_files = []
          for i, text in enumerate(narration, 1):
              p = VOICE / f"voice_{i:02d}.wav"
              make_voice(text, p)
              voice_files.append(p)
          
          # 音声は固定時刻に飛び飛びで置かず、短い間隔だけで連結する。
          # これで「次のナレーションまで不自然に待つ」問題を防ぐ。
          voice_durations = []
          for p in voice_files:
              r = subprocess.run([
                  "ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", str(p)
              ], capture_output=True, text=True, check=True)
              voice_durations.append(float(r.stdout.strip()))

          voice_concat = VOICE / "narration_concat.txt"
          voice_concat.write_text("\n".join(f"file '{p.resolve()}'" for p in voice_files), encoding="utf-8")
          voice_full = VOICE / "narration_full.wav"
          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(voice_concat),
              "-af", "apad=pad_dur=0.04,atrim=0:24,volume=1.0",
              "-ar", str(SR), "-ac", "2", "-c:a", "pcm_s16le", str(voice_full)
          ], check=True)
          voice_total = sum(voice_durations) + 0.04 * max(0, len(voice_files)-1)
          
          # ------------------------------------------------------------
          # 5) 完全オリジナルBGM + SE
          # ------------------------------------------------------------
          import wave
          
          def wav_mono(path, seconds, fn):
              n = int(SR * seconds)
              with wave.open(str(path), "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
                  buf = bytearray()
                  for i in range(n):
                      t = i / SR
                      v = max(-1.0, min(1.0, fn(t)))
                      buf += int(v * 32767).to_bytes(2, "little", signed=True)
                  w.writeframes(buf)
          
          def tone(freq, t, dur, amp=0.1):
              if t < 0 or t > dur:
                  return 0.0
              attack = min(0.03, dur * 0.1)
              release = min(0.12, dur * 0.25)
              env = min(1.0, t / max(attack, 1e-6), (dur - t) / max(release, 1e-6))
              return math.sin(2 * math.pi * freq * t) * env * amp
          
          # 明るめの短いアルペジオ。BGM自体はかなり小さくし、ナレーションを主役にする。
          bgm = OUT / "bgm.wav"
          chords = [220.00, 277.18, 329.63, 246.94]
          melody = [440, 554.37, 659.25, 554.37, 493.88, 659.25, 739.99, 659.25]
          def bgm_fn(t):
              beat = int(t / 0.5)
              root = chords[(beat // 4) % len(chords)]
              m = melody[beat % len(melody)]
              # 0-2秒はフックを邪魔しない程度に少し強め。
              base = 0.075 if t < 2 else 0.052
              if 26 <= t < 30:
                  base = 0.068
              v = math.sin(2*math.pi*root*t)*base
              v += math.sin(2*math.pi*root*2*t)*base*0.35
              local = t % 0.5
              v += tone(m, local, 0.38, base*0.8)
              # キックとハイハットを薄く。
              if local < 0.08:
                  v += math.sin(2*math.pi*(90 + 35*(1-local/0.08))*local) * 0.045 * (1-local/0.08)
              if local > 0.25 and local < 0.29:
                  v += (random.random()*2-1) * 0.012
              return v
          
          random.seed(7)
          wav_mono(bgm, TOTAL, bgm_fn)
          
          # BGMをステレオ化し、ナレーション中はさらに下げるためのゲイン制御はFFmpegで行う。
          subprocess.run([
              "ffmpeg", "-y", "-i", str(bgm), "-ac", "2", "-ar", str(SR),
              "-filter:a", "volume=0.62,afade=t=in:st=0:d=0.35,afade=t=out:st=28.8:d=1.2",
              str(OUT / "bgm_stereo.wav")
          ], check=True)
          
          def make_se(path, kind):
              dur = {"impact":0.32, "whoosh":0.28, "pop":0.16, "sparkle":0.45, "fanfare":0.8, "click":0.12}[kind]
              def fn(t):
                  if kind == "impact":
                      f = 160 - 100*t/dur
                      return tone(f, t, dur, 0.45)
                  if kind == "whoosh":
                      f = 250 + 1100*(t/dur)
                      return ((random.random()*2-1) * (t/dur) * (1-t/dur) * 0.22 + tone(f, t, dur, 0.12))
                  if kind == "pop":
                      return tone(700 + 300*(1-t/dur), t, dur, 0.35)
                  if kind == "sparkle":
                      return tone(900 + 1200*math.sin(t*17), t, dur, 0.16) + tone(1400, t, dur, 0.08)
                  if kind == "fanfare":
                      return tone(523.25, t, dur, 0.18) + tone(659.25, t-0.18, dur, 0.15) + tone(783.99, t-0.36, dur, 0.14)
                  return tone(1200, t, dur, 0.28)
              wav_mono(path, dur, fn)
          
          se_dir = OUT / "se"
          se_dir.mkdir(exist_ok=True)
          for k in ["impact", "whoosh", "pop", "sparkle", "fanfare", "click"]:
              make_se(se_dir / f"{k}.wav", k)
          
          # ------------------------------------------------------------
          # 6) 画面設計
          #    30秒 / 7ブロック。ゲーム画像を主役にし、説明スライド化を避ける。
          # ------------------------------------------------------------
          FONT_B = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
          FONT_R = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          
          def font(size, bold=True):
              return ImageFont.truetype(FONT_B if bold else FONT_R, size)
          
          def cover(im, w, h, zoom=1.0, focus=(0.5, 0.5)):
              iw, ih = im.size
              scale = max(w/iw, h/ih) * zoom
              nw, nh = int(iw*scale), int(ih*scale)
              x = int((nw-w) * focus[0]); y = int((nh-h) * focus[1])
              im = im.resize((nw, nh), Image.Resampling.LANCZOS)
              x = max(0, min(x, nw-w)); y = max(0, min(y, nh-h))
              return im.crop((x, y, x+w, y+h))
          
          def fit_text(draw, text, max_w, size, bold=True):
              f = font(size, bold)
              if draw.textbbox((0,0), text, font=f)[2] <= max_w:
                  return text, f
              # 2行まで。短い言葉を優先。
              for n in range(len(text)-1, 3, -1):
                  a, b = text[:n], text[n:]
                  if draw.textbbox((0,0), a, font=f)[2] <= max_w and draw.textbbox((0,0), b, font=f)[2] <= max_w:
                      return a + "\n" + b, f
              return text[:18] + "\n" + text[18:], f
          
          def text_box(draw, xy, text, size, fill=(255,255,255,255), stroke=6, anchor="la", bold=True):
              draw.multiline_text(xy, text, font=font(size, bold), fill=fill, stroke_width=stroke, stroke_fill=(0,0,0,235), spacing=8, anchor=anchor)
          
          # 1枚の画像を使い回しつつ、切り抜き位置を変える。画像は最低5枚を採用済み。
          images = [Image.open(p).convert("RGB") for p in imgs]
          
          def make_frame(idx, label=None, big=None, sub=None, dark=0):
              im = images[idx % len(images)]
              bg = cover(im, W, H, 1.10)
              bg = bg.filter(ImageFilter.GaussianBlur(10))
              canvas = bg.copy()
              fg = cover(im, W, 1450, 1.03, focus=((idx % 3) / 2, 0.5))
              canvas.paste(fg, (0, 300))
              d = ImageDraw.Draw(canvas, "RGBA")
              if dark:
                  d.rectangle((0,0,W,H), fill=(0,0,0,dark))
              # 上部の読みやすさ。UIに近い下部は極力使わない。
              d.rectangle((0,0,W,300), fill=(0,0,0,135))
              if label:
                  d.rounded_rectangle((50,55,430,125), 24, fill=(255,255,255,230))
                  d.text((78,91), label, font=font(29), fill=(20,20,20,255), anchor="lm")
              if big:
                  t, f = fit_text(d, big, 970, 92, True)
                  d.multiline_text((54, 330), t, font=f, fill=(255,255,255,255), stroke_width=7, stroke_fill=(0,0,0,235), spacing=8)
              if sub:
                  d.rounded_rectangle((45,1420,1035,1545), 28, fill=(0,0,0,185))
                  d.text((75,1482), sub, font=font(45), fill=(255,255,255,255), anchor="lm")
              return canvas
          
          # 0-2: フック。最大文字＋最も強いゲーム画像。
          make_frame(0, "親子ゲーム発掘", hook, None, 15).save(LAYERS/"frame01.png")
          # 2-5: 3カット相当。3枚を1秒ずつ切り替える。
          for j in range(3):
              make_frame(j+1, "ここがポイント", ["一緒に遊べる", "声を掛け合える", "大人も楽しめる"][j], None, 10).save(LAYERS/f"frame02_{j+1}.png")
          # 5-9: タイトルはタイトルカードではなくゲーム画像上に表示。
          f3 = make_frame(4, "ゲーム名", game, "親子で遊ぶ価値をチェック", 10)
          f3.save(LAYERS/"frame03.png")
          # 9-15: 2カット。
          make_frame(0, "遊び方", "一緒に進めるのが強み", "協力・役割分担で盛り上がる", 5).save(LAYERS/"frame04.png")
          make_frame(2, "親目線", "子ども任せで終わらない", "大人も参加できるタイプ", 5).save(LAYERS/"frame05.png")
          # 15-21: スコアを主役に。
          f6 = make_frame(3, "親子ゲーム適性", f"{score}点 / 100点", "協力しやすさ・盛り上がり・親の満足感", 12)
          f6.save(LAYERS/"frame06.png")
          # 21-26: 最強画像＋感情コピー。
          make_frame(1, "もう一回やりたくなる？", "週末に一度、試したい。", "保存して後で候補を見返そう", 5).save(LAYERS/"frame07.png")
          # 26-30: CTA。下端ではなく安全圏に配置。
          f8 = make_frame(4, "PARENT GAME RADAR", "親子ゲーム適性  " + str(score) + "点", "保存して、次の週末のゲーム候補に。", 20)
          f8.save(LAYERS/"frame08.png")
          
          # ------------------------------------------------------------
          # 7) 映像化：ズーム＋パン＋短いカット
          # ------------------------------------------------------------
          def make_clip(src, out, sec):
              # テキストを焼き込んだフレームにズームを掛けると文字まで動いて
              # 切れたり読めなくなるため、ここではズームを廃止。
              # 代わりに高速カットと画面内の余白設計でテンポを作る。
              vf = (
                  f"scale={W}:{H}:force_original_aspect_ratio=increase,"
                  f"crop={W}:{H},fps={FPS},format=yuv420p"
              )
              subprocess.run(["ffmpeg","-y","-loop","1","-i",str(src),"-t",str(sec),"-vf",vf,"-an","-c:v","libx264","-pix_fmt","yuv420p","-r",str(FPS),str(out)], check=True)

          clips = []
          plan = [
              (LAYERS/"frame01.png", 2.0),
              (LAYERS/"frame02_1.png", 1.0),
              (LAYERS/"frame02_2.png", 1.0),
              (LAYERS/"frame02_3.png", 1.0),
              (LAYERS/"frame03.png", 4.0),
              (LAYERS/"frame04.png", 3.0),
              (LAYERS/"frame05.png", 3.0),
              (LAYERS/"frame06.png", 5.0),
              (LAYERS/"frame07.png", 5.0),
              (LAYERS/"frame08.png", 5.0),
          ]
          for i, (src, sec) in enumerate(plan, 1):
              p = OUT / f"clip_{i:02d}.mp4"
              make_clip(src, p, sec)
              clips.append((p, sec))
          
          concat = OUT / "video_concat.txt"
          concat.write_text("\n".join(f"file '{p.resolve()}'" for p,_ in clips), encoding="utf-8")
          visual = OUT / "visual.mp4"
          subprocess.run([
              "ffmpeg","-y","-f","concat","-safe","0","-i",str(concat),
              "-filter:v",f"scale={W}:{H},fps={FPS},format=yuv420p",
              "-t",str(TOTAL),"-c:v","libx264","-preset","veryfast","-crf","20","-an",str(visual)
          ], check=True)
          
          # ------------------------------------------------------------
          # 8) 音声：ナレーション連続＋BGM自動ダッキング＋SE（実ミックス版）
          # ------------------------------------------------------------
          # ナレーションは冒頭0.12秒から連続再生。固定startによる不自然な無音を排除。
          # BGMはナレーションが始まったら自動的に下がり、声が終わると戻る。
          # SEはカット位置にだけ置く。
          final = OUT / "parent_game_radar.mp4"
          # まず映像に連続ナレーションを重ねるためのfilter graphを作る。
          # SEは短いので、各カット頭にだけ配置。
          audio_inputs = [str(visual), str(OUT/"bgm_stereo.wav"), str(voice_full)]
          se_events = [
              (se_dir/"impact.wav", 0.00, 0.78),
              (se_dir/"whoosh.wav", 2.00, 0.55),
              (se_dir/"whoosh.wav", 3.00, 0.48),
              (se_dir/"pop.wav", 5.00, 0.65),
              (se_dir/"pop.wav", 9.00, 0.45),
              (se_dir/"sparkle.wav", 14.95, 0.48),
              (se_dir/"impact.wav", 21.00, 0.58),
              (se_dir/"fanfare.wav", 26.00, 0.62),
              (se_dir/"click.wav", 29.10, 0.52),
          ]
          for path, _, _ in se_events:
              audio_inputs.append(str(path))

          # BGMのダッキングは、連続ナレーションをサイドチェインにする。
          # 0.10秒のフェードイン、最後1.2秒でフェードアウト。
          filters = [
              "[1:a]volume=0.30,afade=t=in:st=0:d=0.25,afade=t=out:st=28.7:d=1.3[bgm]",
              "[2:a]adelay=120|120,volume=1.20[narr]",
              "[bgm][narr]sidechaincompress=threshold=0.035:ratio=8:attack=80:release=250:makeup=1[duckbgm]",
              "[duckbgm][narr]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0[m0]",
          ]
          se_labels=[]
          base_idx=3
          for j, (_, start_t, vol) in enumerate(se_events):
              idx=base_idx+j
              lab=f"se{j}"
              ms=int(start_t*1000)
              filters.append(f"[{idx}:a]adelay={ms}|{ms},volume={vol*1.55:.3f}[{lab}]")
              se_labels.append(f"[{lab}]")
          filters.append("[m0]" + "".join(se_labels) + f"amix=inputs={1+len(se_labels)}:duration=longest:dropout_transition=0:normalize=0,alimiter=limit=0.88[aout]")

          subprocess.run([
              "ffmpeg","-y",
              *sum((["-i", x] for x in audio_inputs), []),
              "-filter_complex",";".join(filters),
              "-map","0:v:0","-map","[aout]","-t",str(TOTAL),
              "-c:v","libx264","-preset","veryfast","-crf","20",
              "-c:a","aac","-b:a","192k","-ar","44100","-ac","2",
              "-movflags","+faststart",str(final)
          ], check=True)

          # ------------------------------------------------------------
          # 9) 最終チェック
          # ------------------------------------------------------------
          probe = subprocess.run([
              "ffprobe","-v","error","-show_entries",
              "format=duration:stream=codec_type,width,height,r_frame_rate,codec_name,channels,sample_rate",
              "-of","json",str(final)
          ], capture_output=True, text=True, check=True)
          info = json.loads(probe.stdout)
          (OUT/"video_check.json").write_text(json.dumps(info, ensure_ascii=False, indent=2), encoding="utf-8")
          duration = float(info["format"]["duration"])
          vs = next(x for x in info["streams"] if x.get("codec_type") == "video")
          aus = [x for x in info["streams"] if x.get("codec_type") == "audio"]
          if abs(duration - TOTAL) > 0.25:
              raise RuntimeError(f"動画長チェック失敗: {duration}")
          if int(vs.get("width",0)) != W or int(vs.get("height",0)) != H:
              raise RuntimeError(f"解像度チェック失敗: {vs.get('width')}x{vs.get('height')}")
          if not aus:
              raise RuntimeError("音声トラックがありません")
          
          (OUT/"narration.txt").write_text("\n".join(f"{i}: {x}" for i,x in enumerate(narration,1)), encoding="utf-8")
          print("=== CREATED ===")
          print(final)
          print("game:", game)
          print("score:", score, "family:", selected["family_score"], "appeal:", selected["appeal_score"])
          print("duration:", duration)
          print("resolution:", vs.get("width"), "x", vs.get("height"))
          print("audio streams:", len(aus))
          print("TITLE IS DISPLAY-ONLY; never sent to VOICEVOX")
          PY

      - name: Generate video
        run: python make_game_news.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-game-radar-${{ github.run_number }}
          path: |
            output/
            make_game_news.py
          if-no-files-found: warn
          retention-days: 7
