name: Auto Game News TikTok

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow feedparser

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import os
          import re
          import io
          import json
          import time
          import html
          import hashlib
          import textwrap
          import traceback
          import subprocess
          from datetime import datetime
          from urllib.parse import quote, urljoin, urlparse, parse_qs

          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          OUT = "output"
          IMG_DIR = os.path.join(OUT, "images")
          DEBUG_DIR = os.path.join(OUT, "debug")

          os.makedirs(OUT, exist_ok=True)
          os.makedirs(IMG_DIR, exist_ok=True)
          os.makedirs(DEBUG_DIR, exist_ok=True)

          LOG = []

          def log(x=""):
              print(x)
              LOG.append(str(x))

          def save_diagnostic():
              with open(os.path.join(OUT, "diagnostic.txt"), "w", encoding="utf-8") as f:
                  f.write("\n".join(LOG))

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/139 Safari/537.36"
              )
          })

          print("=" * 42)
          print("GAME NEWS RADAR START")
          print("=" * 42)

          # ---------------------------------------------------------
          # 基本設定
          # ---------------------------------------------------------

          NEWS_QUERIES = [
              "新作ゲーム 発売日",
              "新作ゲーム 発売決定",
              "ゲーム 正式リリース",
              "ゲーム アーリーアクセス",
              "ゲーム PS5 Switch PC",
              "ゲーム Switch2",
              "ゲーム Steam",
              "新作ゲーム 2026",
              "新作ゲーム 2027",
          ]

          MAX_CANDIDATES = 25
          MIN_IMAGES = 3

          HEADERS = {
              "Accept-Language": "ja-JP,ja;q=0.9,en;q=0.8"
          }

          # ---------------------------------------------------------
          # フォント
          # ---------------------------------------------------------

          FONT_PATHS = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
          ]

          def get_font(size, bold=True):
              for p in FONT_PATHS:
                  if os.path.exists(p):
                      try:
                          return ImageFont.truetype(p, size)
                      except:
                          pass
              return ImageFont.load_default()

          # ---------------------------------------------------------
          # HTTP
          # ---------------------------------------------------------

          def get_url(url, timeout=15):
              try:
                  r = session.get(url, timeout=timeout, headers=HEADERS)
                  if r.status_code == 200:
                      return r
              except Exception as e:
                  log(f"HTTP ERROR: {url} / {e}")
              return None

          # ---------------------------------------------------------
          # Google News
          # ---------------------------------------------------------

          def google_news(query):
              url = (
                  "https://news.google.com/rss/search?"
                  + "q=" + quote(query)
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  r = get_url(url)
                  if not r:
                      return []

                  feed = feedparser.parse(r.content)
                  result = []

                  for item in feed.entries:
                      result.append({
                          "title": item.get("title", ""),
                          "link": item.get("link", ""),
                          "summary": BeautifulSoup(
                              item.get("summary", ""), "html.parser"
                          ).get_text(" ", strip=True),
                          "published": item.get("published", ""),
                      })

                  return result

              except Exception as e:
                  log(f"NEWS ERROR: {query} / {e}")
                  return []

          # ---------------------------------------------------------
          # タイトルからゲーム名を推定
          # ---------------------------------------------------------

          def clean_game_name(name):
              name = re.sub(r"\s+", " ", name).strip()

              # 明らかな記事タイトル後半を削る
              patterns = [
                  r"が\d{1,2}月\d{1,2}日.*$",
                  r"は\d{1,2}月\d{1,2}日.*$",
                  r"、\s*[\w一-龠ぁ-んァ-ン]+ら.*$",
                  r"。.*$",
              ]

              for p in patterns:
                  name = re.sub(p, "", name)

              name = name.strip("『』「」【】 ")

              return name[:100]

          def extract_game(title):

              # 『ゲーム名』
              m = re.search(r"『([^』]{2,80})』", title)
              if m:
                  return clean_game_name(m.group(1))

              # 「ゲーム名」
              m = re.search(r"「([^」]{2,80})」", title)
              if m:
                  return clean_game_name(m.group(1))

              # 英字タイトルっぽいもの
              m = re.search(
                  r"\b([A-Z][A-Za-z0-9]+(?:\s+[A-Z][A-Za-z0-9]+){0,5})\b",
                  title
              )
              if m:
                  return clean_game_name(m.group(1))

              # 先頭部分
              s = re.split(r"[。|｜]", title)[0]
              s = re.sub(
                  r"^(ゲーム|新作ゲーム|【[^】]+】|ゲーム『[^』]+』)",
                  "",
                  s
              )
              return clean_game_name(s)

          # ---------------------------------------------------------
          # 発売日
          # ---------------------------------------------------------

          MONTH_MAP = {
              "1": "01", "2": "02", "3": "03", "4": "04",
              "5": "05", "6": "06", "7": "07", "8": "08",
              "9": "09", "10": "10", "11": "11", "12": "12"
          }

          def normalize_date(y, m, d):
              try:
                  return f"{int(y):04d}/{int(m):02d}/{int(d):02d}"
              except:
                  return None

          def extract_release(text, published=""):

              text = text.replace("（", "(").replace("）", ")")

              # YYYY/MM/DD
              m = re.search(
                  r"(20\d{2})[/-](\d{1,2})[/-](\d{1,2})",
                  text
              )
              if m:
                  return normalize_date(*m.groups())

              # YYYY年M月D日
              m = re.search(
                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日?",
                  text
              )
              if m:
                  return normalize_date(*m.groups())

              # YYYY年M月
              m = re.search(
                  r"(20\d{2})年\s*(\d{1,2})月",
                  text
              )
              if m:
                  return normalize_date(m.group(1), m.group(2), 1)

              # M月D日
              m = re.search(
                  r"(?<!\d)(\d{1,2})月\s*(\d{1,2})日",
                  text
              )
              if m:
                  year = datetime.now().year
                  month = int(m.group(1))
                  day = int(m.group(2))

                  # 9月の記事で翌年発売などもあるため、
                  # 明らかに過去の日付なら翌年候補も考慮
                  if month < datetime.now().month - 2:
                      year += 1

                  return normalize_date(year, month, day)

              # M/D
              m = re.search(
                  r"(?<!\d)(\d{1,2})/(\d{1,2})(?!\d)",
                  text
              )
              if m:
                  year = datetime.now().year
                  return normalize_date(year, m.group(1), m.group(2))

              # 本日
              if re.search(r"(本日|今日).*(発売|配信|開始|リリース)", text):
                  return datetime.now().strftime("%Y/%m/%d")

              # published fallback
              if published:
                  try:
                      dt = feedparser._parse_date(published)
                      if dt:
                          return f"{dt.tm_year:04d}/{dt.tm_mon:02d}/{dt.tm_mday:02d}"
                  except:
                      pass

              return None

          # ---------------------------------------------------------
          # プラットフォーム
          # ---------------------------------------------------------

          PLATFORM_PATTERNS = [
              (r"PS5", "PS5"),
              (r"PlayStation\s*5", "PS5"),
              (r"PS4", "PS4"),
              (r"PlayStation\s*4", "PS4"),
              (r"Switch\s*2", "Switch 2"),
              (r"Nintendo\s*Switch\s*2", "Switch 2"),
              (r"Switch", "Switch"),
              (r"Nintendo\s*Switch", "Switch"),
              (r"Xbox\s*Series\s*X\|S", "Xbox Series X|S"),
              (r"Xbox", "Xbox"),
              (r"PC", "PC"),
              (r"Steam", "PC"),
              (r"Windows", "PC"),
              (r"iOS", "iOS"),
              (r"Android", "Android"),
          ]

          def extract_platforms(text):
              found = []

              for pattern, name in PLATFORM_PATTERNS:
                  if re.search(pattern, text, re.I):
                      if name not in found:
                          found.append(name)

              return found

          # ---------------------------------------------------------
          # 記事ページから本文・画像を取得
          # ---------------------------------------------------------

          def parse_article(url):

              r = get_url(url)

              if not r:
                  return {
                      "text": "",
                      "images": [],
                      "title": ""
                  }

              try:
                  soup = BeautifulSoup(r.text, "html.parser")

                  # 不要要素
                  for tag in soup(["script", "style", "noscript", "svg"]):
                      tag.decompose()

                  text = soup.get_text(" ", strip=True)

                  title = ""
                  if soup.title:
                      title = soup.title.get_text(" ", strip=True)

                  images = []

                  # OG画像
                  for meta in soup.find_all("meta"):
                      prop = (
                          meta.get("property")
                          or meta.get("name")
                          or ""
                      ).lower()

                      if prop in [
                          "og:image",
                          "twitter:image",
                          "twitter:image:src"
                      ]:
                          content = meta.get("content")
                          if content:
                              images.append(urljoin(url, content))

                  # img
                  for img in soup.find_all("img"):
                      for attr in ["src", "data-src", "data-original"]:
                          src = img.get(attr)
                          if src:
                              images.append(urljoin(url, src))

                      srcset = img.get("srcset")
                      if srcset:
                          for part in srcset.split(","):
                              src = part.strip().split(" ")[0]
                              if src:
                                  images.append(urljoin(url, src))

                  # 重複排除
                  unique = []
                  seen = set()

                  for x in images:
                      if not x:
                          continue
                      x = x.strip()
                      if x not in seen:
                          seen.add(x)
                          unique.append(x)

                  return {
                      "text": text,
                      "images": unique[:40],
                      "title": title
                  }

              except Exception as e:
                  log(f"ARTICLE PARSE ERROR: {url} / {e}")
                  return {
                      "text": "",
                      "images": [],
                      "title": ""
                  }

          # ---------------------------------------------------------
          # Steam画像
          # ---------------------------------------------------------

          def steam_images(game):

              log(f"STEAM SEARCH: {game}")

              result = []

              try:
                  url = (
                      "https://store.steampowered.com/api/storesearch/"
                      "?term=" + quote(game)
                      + "&l=japanese&cc=jp"
                  )

                  r = get_url(url)

                  if not r:
                      return []

                  data = r.json()
                  items = data.get("items", [])

                  if not items:
                      return []

                  # 上位候補だけ確認
                  for item in items[:3]:

                      appid = item.get("id")
                      if not appid:
                          continue

                      detail_url = (
                          "https://store.steampowered.com/api/appdetails"
                          f"?appids={appid}&l=japanese&cc=jp"
                      )

                      rr = get_url(detail_url)

                      if not rr:
                          continue

                      detail = rr.json().get(str(appid), {})
                      if not detail.get("success"):
                          continue

                      d = detail.get("data", {})

                      name = d.get("name", "")
                      log(f"STEAM CANDIDATE: {name}")

                      # 完全一致またはかなり近い場合
                      if game.lower() not in name.lower() and name.lower() not in game.lower():
                          continue

                      if d.get("header_image"):
                          result.append(d["header_image"])

                      for shot in d.get("screenshots", []):
                          path = shot.get("path_full")
                          if path:
                              result.append(path)

                      if result:
                          break

              except Exception as e:
                  log(f"STEAM ERROR: {e}")

              return result

          # ---------------------------------------------------------
          # Bing画像検索
          # ---------------------------------------------------------

          def bing_images(game):

              log(f"BING IMAGE SEARCH: {game}")

              result = []

              try:
                  q = quote(game + " game screenshot")
                  url = "https://www.bing.com/images/search?q=" + q

                  r = get_url(url)

                  if not r:
                      return []

                  # murl":"https://..."
                  matches = re.findall(
                      r'"murl":"(https?://[^"]+)"',
                      r.text
                  )

                  for x in matches:
                      x = x.replace("\\/", "/")
                      if x not in result:
                          result.append(x)

                      if len(result) >= 20:
                          break

              except Exception as e:
                  log(f"BING ERROR: {e}")

              return result

          # ---------------------------------------------------------
          # Google News関連記事から画像
          # ---------------------------------------------------------

          def related_article_images(game):

              log(f"RELATED NEWS SEARCH: {game}")

              result = []

              items = google_news(f'"{game}"')

              for item in items[:8]:

                  link = item.get("link", "")
                  if not link:
                      continue

                  log(f"RELATED: {item.get('title','')[:100]}")

                  article = parse_article(link)

                  for img in article["images"]:
                      if img not in result:
                          result.append(img)

                      if len(result) >= 20:
                          return result

              return result

          # ---------------------------------------------------------
          # 画像ダウンロード・検査
          # ---------------------------------------------------------

          def download_image(url, index):

              try:

                  r = session.get(
                      url,
                      timeout=15,
                      headers={
                          "User-Agent": (
                              "Mozilla/5.0 "
                              "AppleWebKit/537.36 "
                              "Chrome/139 Safari/537.36"
                          )
                      }
                  )

                  if r.status_code != 200:
                      return None, f"HTTP {r.status_code}"

                  content_type = r.headers.get("Content-Type", "")

                  if "image" not in content_type.lower():
                      return None, "not image content-type"

                  data = r.content

                  if len(data) < 10000:
                      return None, "too small"

                  im = Image.open(io.BytesIO(data))
                  im.load()

                  w, h = im.size

                  # 極端に小さい画像は除外
                  if w < 500 or h < 300:
                      return None, f"small {w}x{h}"

                  # 極端なバナー・アイコンを除外
                  ratio = w / h

                  if ratio > 4.5 or ratio < 0.45:
                      return None, f"bad ratio {ratio:.2f}"

                  # ほぼ単色の画像を簡易除外
                  thumb = im.convert("RGB").resize((32, 32))
                  pixels = list(thumb.getdata())

                  avg = []
                  for c in range(3):
                      avg.append(
                          sum(p[c] for p in pixels) / len(pixels)
                      )

                  variance = 0
                  for p in pixels:
                      variance += sum(
                          (p[c] - avg[c]) ** 2 for c in range(3)
                      )

                  variance /= len(pixels)

                  if variance < 150:
                      return None, "almost blank"

                  filename = f"candidate_{index:02d}.jpg"
                  path = os.path.join(DEBUG_DIR, filename)

                  im = ImageOps.exif_transpose(im)
                  im.convert("RGB").save(
                      path,
                      "JPEG",
                      quality=92
                  )

                  return path, f"OK {w}x{h}"

              except Exception as e:
                  return None, str(e)[:120]

          def collect_images(game, article_images):

              log("")
              log("========== IMAGE TEST ==========")
              log(f"GAME IMAGE TARGET: {game}")

              urls = []

              def add_urls(source, arr):

                  log(f"IMAGE SOURCE: {source} / {len(arr)} URLs")

                  for u in arr:
                      if u and u not in urls:
                          urls.append(u)

              # 1 元記事
              add_urls("ARTICLE", article_images)

              # 2 Steam
              add_urls("STEAM", steam_images(game))

              # 3 関連記事
              add_urls("RELATED", related_article_images(game))

              # 4 Bing
              add_urls("BING", bing_images(game))

              selected = []
              seen_hash = set()

              for i, url in enumerate(urls[:80], 1):

                  path, status = download_image(url, i)

                  if path:

                      try:
                          with open(path, "rb") as f:
                              h = hashlib.md5(f.read()).hexdigest()

                          if h in seen_hash:
                              os.remove(path)
                              log(f"IMAGE {i}: DUPLICATE")
                              continue

                          seen_hash.add(h)
                      except:
                          pass

                      selected.append(path)

                      log(f"IMAGE {i}: OK")
                      log(f"  {url}")

                      if len(selected) >= MIN_IMAGES:
                          break

                  else:
                      log(f"IMAGE {i}: NG - {status}")

              log(f"SELECTED IMAGES: {len(selected)}")

              return selected

          # ---------------------------------------------------------
          # 動画生成
          # ---------------------------------------------------------

          def fit_vertical(im, size=(1080, 1920)):

              w, h = size

              src = im.copy()
              src = ImageOps.fit(
                  src,
                  (w, h),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5)
              )

              return src

          def draw_text_box(draw, text, y, font, max_width=980):

              words = list(text)

              lines = []
              current = ""

              for ch in words:
                  test = current + ch

                  box = draw.textbbox(
                      (0, 0),
                      test,
                      font=font,
                      stroke_width=2
                  )

                  if box[2] > max_width and current:
                      lines.append(current)
                      current = ch
                  else:
                      current = test

              if current:
                  lines.append(current)

              line_height = font.size + 15

              for line in lines[:3]:

                  box = draw.textbbox(
                      (0, 0),
                      line,
                      font=font,
                      stroke_width=3
                  )

                  tw = box[2] - box[0]
                  x = (1080 - tw) // 2

                  draw.text(
                      (x + 3, y + 3),
                      line,
                      font=font,
                      fill="black",
                      stroke_width=5,
                      stroke_fill="black"
                  )

                  draw.text(
                      (x, y),
                      line,
                      font=font,
                      fill="white",
                      stroke_width=3,
                      stroke_fill="black"
                  )

                  y += line_height

              return y

          def make_scene(image_path, title, release, platforms, scene, idx):

              im = Image.open(image_path).convert("RGB")

              im = fit_vertical(im)

              # 軽いズーム
              zoom = 1.0 + (idx * 0.018)

              nw = int(im.width * zoom)
              nh = int(im.height * zoom)

              im = im.resize(
                  (nw, nh),
                  Image.Resampling.LANCZOS
              )

              left = (nw - 1080) // 2
              top = (nh - 1920) // 2

              im = im.crop(
                  (left, top, left + 1080, top + 1920)
              )

              draw = ImageDraw.Draw(im)

              font_big = get_font(82)
              font_mid = get_font(58)
              font_small = get_font(46)

              # 上部タイトル
              draw.rectangle(
                  (0, 0, 1080, 245),
                  fill=(0, 0, 0)
              )

              draw_text_box(
                  draw,
                  title,
                  35,
                  font_big
              )

              # シーンごとの文字
              if scene == 0:

                  draw.rectangle(
                      (0, 1450, 1080, 1920),
                      fill=(0, 0, 0)
                  )

                  draw_text_box(
                      draw,
                      "新作ゲーム",
                      1510,
                      font_mid
                  )

                  if release:
                      draw_text_box(
                          draw,
                          "発売・配信 " + release,
                          1590,
                          font_mid
                      )

              elif scene == 1:

                  draw.rectangle(
                      (0, 1450, 1080, 1920),
                      fill=(0, 0, 0)
                  )

                  draw_text_box(
                      draw,
                      "注目ポイント",
                      1500,
                      font_mid
                  )

                  draw_text_box(
                      draw,
                      "新情報が公開",
                      1580,
                      font_small
                  )

              else:

                  draw.rectangle(
                      (0, 1450, 1080, 1920),
                      fill=(0, 0, 0)
                  )

                  if platforms:
                      p = " / ".join(platforms)
                  else:
                      p = "対応機種は記事を確認"

                  draw_text_box(
                      draw,
                      p,
                      1510,
                      font_mid
                  )

                  if release:
                      draw_text_box(
                          draw,
                          release + " 発売・配信",
                          1590,
                          font_small
                      )

              return im

          def make_video(game, release, platforms, images):

              log("")
              log("========== VIDEO GENERATION ==========")

              if len(images) < MIN_IMAGES:
                  log(
                      f"VIDEO SKIP: images={len(images)} "
                      f"< {MIN_IMAGES}"
                  )
                  return None

              scenes = []

              for i in range(3):

                  img = images[i % len(images)]

                  frame = make_scene(
                      img,
                      game,
                      release,
                      platforms,
                      i,
                      i
                  )

                  path = os.path.join(
                      OUT,
                      f"scene_{i}.png"
                  )

                  frame.save(path, "PNG")
                  scenes.append(path)

              concat = os.path.join(
                  OUT,
                  "concat.txt"
              )

              with open(concat, "w", encoding="utf-8") as f:

                  # 5秒 × 3 = 15秒
                  for scene in scenes:
                      f.write(
                          f"file '{os.path.abspath(scene)}'\n"
                      )
                      f.write("duration 5\n")

                  f.write(
                      f"file '{os.path.abspath(scenes[-1])}'\n"
                  )

              output = os.path.join(
                  OUT,
                  "game_news_tiktok.mp4"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", concat,
                  "-vf",
                  (
                      "scale=1080:1920:force_original_aspect_ratio=decrease,"
                      "pad=1080:1920:(ow-iw)/2:(oh-ih)/2,"
                      "format=yuv420p"
                  ),
                  "-r", "30",
                  "-t", "15",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "20",
                  "-movflags", "+faststart",
                  output
              ]

              log("FFMPEG START")

              try:

                  p = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True
                  )

                  if p.returncode != 0:
                      log("FFMPEG ERROR")
                      log(p.stderr[-4000:])
                      return None

                  if not os.path.exists(output):
                      log("VIDEO FILE NOT FOUND")
                      return None

                  size = os.path.getsize(output)

                  log(
                      f"VIDEO GENERATED: {output} "
                      f"({size / 1024 / 1024:.2f} MB)"
                  )

                  return output

              except Exception as e:
                  log(f"VIDEO ERROR: {e}")
                  return None

          # ---------------------------------------------------------
          # 候補選定
          # ---------------------------------------------------------

          all_news = []
          seen_titles = set()

          for q in NEWS_QUERIES:

              log(f"NEWS: {q}")

              items = google_news(q)

              for item in items:

                  title = item.get("title", "").strip()

                  if not title:
                      continue

                  if title in seen_titles:
                      continue

                  seen_titles.add(title)
                  all_news.append(item)

          log("")
          log(f"ニュース候補: {len(all_news)}")

          # ---------------------------------------------------------
          # 明らかな除外
          # ---------------------------------------------------------

          EXCLUDE_WORDS = [
              "攻略",
              "レビュー",
              "中古",
              "セール",
              "予約受付終了",
              "イベントレポート",
              "大会",
              "配信終了",
              "グッズ",
              "アケコン",
              "周辺機器",
              "フィギュア",
          ]

          def looks_like_game_news(title):

              for w in EXCLUDE_WORDS:
                  if w in title:
                      return False

              keywords = [
                  "発売",
                  "配信",
                  "リリース",
                  "アーリーアクセス",
                  "制作決定",
                  "発表",
                  "新作",
                  "ゲーム",
              ]

              return any(k in title for k in keywords)

          # ---------------------------------------------------------
          # 候補処理
          # ---------------------------------------------------------

          generated = False

          for idx, item in enumerate(all_news[:MAX_CANDIDATES], 1):

              title = item.get("title", "")
              link = item.get("link", "")
              summary = item.get("summary", "")
              published = item.get("published", "")

              log("")
              log("-" * 42)
              log(f"候補: {idx}")
              log(title)

              if not looks_like_game_news(title):
                  log("SKIP: not game news")
                  continue

              game = extract_game(title)

              log(f"GAME: {game}")

              article = parse_article(link)

              combined = (
                  title
                  + " "
                  + summary
                  + " "
                  + article["text"][:20000]
              )

              release = extract_release(
                  combined,
                  published
              )

              platforms = extract_platforms(combined)

              log(f"RELEASE: {release}")
              log(f"PLATFORM: {platforms}")

              # 発売日が取れない場合でも、
              # ゲームタイトル＋発表系なら追加検索で補完する
              if not release:

                  log("RELEASE RETRY")

                  related = google_news(
                      f'"{game}" 発売 配信'
                  )

                  for r in related[:8]:

                      rt = (
                          r.get("title", "")
                          + " "
                          + r.get("summary", "")
                      )

                      d = extract_release(rt)

                      if d:
                          release = d
                          log(
                              f"RELEASE FOUND FROM RELATED: {d}"
                          )
                          break

              # プラットフォームも関連検索で補完
              if not platforms:

                  log("PLATFORM RETRY")

                  related = google_news(
                      f'"{game}" PS5 Switch PC Steam Xbox'
                  )

                  for r in related[:8]:

                      rt = (
                          r.get("title", "")
                          + " "
                          + r.get("summary", "")
                      )

                      ps = extract_platforms(rt)

                      for p in ps:
                          if p not in platforms:
                              platforms.append(p)

              log(f"FINAL RELEASE: {release}")
              log(f"FINAL PLATFORM: {platforms}")

              # 画像テスト
              images = collect_images(
                  game,
                  article["images"]
              )

              if len(images) < MIN_IMAGES:

                  log("")
                  log(
                      f"SKIP: usable images "
                      f"{len(images)} < {MIN_IMAGES}"
                  )
                  continue

              # 最低限、発売日か「発売系ニュース」であること
              if not release:

                  release = "発売日未定"

                  log(
                      "WARNING: release date unavailable"
                  )

              video = make_video(
                  game,
                  release,
                  platforms,
                  images
              )

              if video:

                  source = os.path.join(
                      OUT,
                      "source.txt"
                  )

                  with open(
                      source,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          "GAME NEWS RADAR\n\n"
                          f"GAME: {game}\n"
                          f"RELEASE: {release}\n"
                          f"PLATFORM: {platforms}\n"
                          f"NEWS: {title}\n"
                          f"URL: {link}\n"
                      )

                  log("")
                  log("=" * 42)
                  log("SUCCESS")
                  log(f"GAME: {game}")
                  log(f"VIDEO: {video}")
                  log("=" * 42)

                  generated = True
                  break

          if not generated:

              log("")
              log("=" * 42)
              log("動画生成なし")
              log(
                  "条件を満たすニュース、または画像が "
                  "見つかりませんでした。"
              )
              log("=" * 42)

          save_diagnostic()

          PY

      - name: Run generator
        run: |
          python make_game_news.py

      - name: Show output
        if: always()
        run: |
          echo "================ OUTPUT ================"
          find output -maxdepth 2 -type f -printf '%p %k KB\n' 2>/dev/null || true
          echo "========================================"

      - name: Upload diagnostic and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-news-result-${{ github.run_number }}
          path: |
            output/
            make_game_news.py
          if-no-files-found: warn
          retention-days: 7
