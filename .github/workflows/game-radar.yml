name: GAME NEWS RADAR

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "10 7 * * *"
      timezone: "Asia/Tokyo"

jobs:
  make-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install requests feedparser beautifulsoup4 pillow

      - name: Game News Radar
        run: |

          cat > make_game_news.py <<'PY'

          import os
          import re
          import html
          import json
          import time
          import hashlib
          import subprocess
          from datetime import date
          from urllib.parse import quote, urljoin

          import requests
          import feedparser

          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont


          # ==========================================================
          # BASIC SETTINGS
          # ==========================================================

          TODAY = date.today()

          OUT = "output"
          IMAGE_DIR = os.path.join(OUT, "images")

          os.makedirs(IMAGE_DIR, exist_ok=True)

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "Chrome/128.0 Safari/537.36"
          }

          session = requests.Session()
          session.headers.update(HEADERS)


          # ==========================================================
          # NEWS SEARCH
          # ==========================================================

          NEWS_QUERIES = [
              "新作ゲーム 発売日",
              "新作ゲーム 発売決定",
              "ゲーム 正式リリース",
              "ゲーム アーリーアクセス",
              "ゲーム PS5 Switch PC",
              "ゲーム Switch2",
              "ゲーム Steam",
              "新作ゲーム 2026",
              "新作ゲーム 2027",
          ]


          def google_news(query):

              url = (
                  "https://news.google.com/rss/search?"
                  "q=" + quote(query) +
                  "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:

                  r = session.get(
                      url,
                      timeout=20
                  )

                  r.raise_for_status()

                  return feedparser.parse(
                      r.text
                  ).entries

              except Exception as e:

                  print("RSS ERROR:", e)

                  return []


          # ==========================================================
          # ARTICLE
          # ==========================================================

          def fetch_article(url):

              try:

                  r = session.get(
                      url,
                      timeout=20,
                      allow_redirects=True
                  )

                  if r.status_code != 200:
                      return "", "", ""

                  soup = BeautifulSoup(
                      r.text,
                      "html.parser"
                  )

                  title = ""

                  tag = soup.find(
                      "meta",
                      attrs={
                          "property": "og:title"
                      }
                  )

                  if tag:
                      title = tag.get(
                          "content",
                          ""
                      )

                  if not title and soup.title:
                      title = soup.title.get_text(
                          " ",
                          strip=True
                      )


                  description = ""

                  for attrs in [
                      {
                          "name": "description"
                      },
                      {
                          "property": "og:description"
                      }
                  ]:

                      tag = soup.find(
                          "meta",
                          attrs=attrs
                      )

                      if tag:

                          description = tag.get(
                              "content",
                              ""
                          )

                          if description:
                              break


                  image = ""

                  for attrs in [
                      {
                          "property": "og:image"
                      },
                      {
                          "name": "twitter:image"
                      }
                  ]:

                      tag = soup.find(
                          "meta",
                          attrs=attrs
                      )

                      if tag:

                          image = tag.get(
                              "content",
                              ""
                          )

                          if image:
                              break


                  for tag in soup([
                      "script",
                      "style",
                      "noscript",
                      "svg"
                  ]):

                      tag.decompose()


                  body = soup.get_text(
                      " ",
                      strip=True
                  )

                  return (
                      title,
                      description + " " + body,
                      image
                  )

              except Exception as e:

                  print(
                      "ARTICLE ERROR:",
                      e
                  )

                  return "", "", ""


          # ==========================================================
          # GAME TITLE
          # ==========================================================

          def extract_game_title(title):

              # 『ゲームタイトル』
              m = re.search(
                  r"『([^』]{2,80})』",
                  title
              )

              if m:

                  value = m.group(1).strip()

                  if value:
                      return value


              # 「ゲームタイトル」
              m = re.search(
                  r"「([^」]{2,80})」",
                  title
              )

              if m:

                  value = m.group(1).strip()

                  if value:
                      return value


              # 【ゲーム】などを除去

              cleaned = re.sub(
                  r"【[^】]+】",
                  "",
                  title
              )

              cleaned = re.sub(
                  r"\s*\|.*$",
                  "",
                  cleaned
              )

              cleaned = re.sub(
                  r"\s*-\s*[^-]+$",
                  "",
                  cleaned
              )

              return cleaned.strip()[:80]


          # ==========================================================
          # RELEASE DATE
          # ==========================================================

          def valid_date(
              y,
              m,
              d
          ):

              try:

                  import datetime

                  x = datetime.date(
                      int(y),
                      int(m),
                      int(d)
                  )

                  return x.strftime(
                      "%Y/%m/%d"
                  )

              except:

                  return None


          def extract_release_date(text):

              # YYYY年MM月DD日

              patterns = [
                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日",
                  r"(20\d{2})[./-](\d{1,2})[./-](\d{1,2})"
              ]

              for p in patterns:

                  m = re.search(
                      p,
                      text
                  )

                  if m:

                      result = valid_date(
                          m.group(1),
                          m.group(2),
                          m.group(3)
                      )

                      if result:
                          return result


              # 本日（9/14）

              m = re.search(
                  r"(?:本日|本日より|本日から)"
                  r".{0,15}?"
                  r"[（(]"
                  r"(\d{1,2})"
                  r"[/-]"
                  r"(\d{1,2})"
                  r"[）)]",
                  text
              )

              if m:

                  result = valid_date(
                      TODAY.year,
                      m.group(1),
                      m.group(2)
                  )

                  if result:
                      return result


              # M月D日

              for m in re.finditer(
                  r"(?<!\d)"
                  r"(\d{1,2})月"
                  r"(\d{1,2})日",
                  text
              ):

                  around = text[
                      max(
                          0,
                          m.start() - 50
                      ):
                      min(
                          len(text),
                          m.end() + 80
                      )
                  ]

                  keywords = [
                      "発売",
                      "発売日",
                      "リリース",
                      "配信",
                      "正式",
                      "開始",
                      "アーリーアクセス"
                  ]

                  if any(
                      x in around
                      for x in keywords
                  ):

                      result = valid_date(
                          TODAY.year,
                          m.group(1),
                          m.group(2)
                      )

                      if result:
                          return result


              # M/D

              for m in re.finditer(
                  r"(?<!\d)"
                  r"(\d{1,2})/"
                  r"(\d{1,2})"
                  r"(?!\d)",
                  text
              ):

                  around = text[
                      max(
                          0,
                          m.start() - 50
                      ):
                      min(
                          len(text),
                          m.end() + 80
                      )
                  ]

                  keywords = [
                      "発売",
                      "発売日",
                      "リリース",
                      "配信",
                      "正式",
                      "開始",
                      "アーリーアクセス"
                  ]

                  if any(
                      x in around
                      for x in keywords
                  ):

                      result = valid_date(
                          TODAY.year,
                          m.group(1),
                          m.group(2)
                      )

                      if result:
                          return result


              return None


          # ==========================================================
          # PLATFORM
          # ==========================================================

          def extract_platforms(text):

              result = []

              patterns = [

                  (
                      "PS5",
                      [
                          r"\bPS5\b",
                          r"PlayStation\s*5",
                          r"プレイステーション5",
                          r"プレイステーション５"
                      ]
                  ),

                  (
                      "PS4",
                      [
                          r"\bPS4\b",
                          r"PlayStation\s*4",
                          r"プレイステーション4",
                          r"プレイステーション４"
                      ]
                  ),

                  (
                      "Switch 2",
                      [
                          r"Switch\s*2",
                          r"Nintendo\s*Switch\s*2",
                          r"ニンテンドースイッチ2",
                          r"ニンテンドースイッチ２"
                      ]
                  ),

                  (
                      "Switch",
                      [
                          r"Nintendo\s*Switch",
                          r"\bSwitch\b",
                          r"ニンテンドースイッチ"
                      ]
                  ),

                  (
                      "Xbox",
                      [
                          r"Xbox\s*Series",
                          r"Xbox\s*One",
                          r"\bXbox\b"
                      ]
                  ),

                  (
                      "PC",
                      [
                          r"\bPC\b",
                          r"Windows",
                          r"PC版"
                      ]
                  ),

                  (
                      "Steam",
                      [
                          r"\bSteam\b"
                      ]
                  ),

                  (
                      "iOS",
                      [
                          r"\biOS\b",
                          r"App\s*Store",
                          r"iPhone"
                      ]
                  ),

                  (
                      "Android",
                      [
                          r"\bAndroid\b",
                          r"Google\s*Play"
                      ]
                  )
              ]

              for name, regexes in patterns:

                  for p in regexes:

                      if re.search(
                          p,
                          text,
                          re.I
                      ):

                          if name not in result:
                              result.append(name)

                          break


              if (
                  "Steam" in result
                  and
                  "PC" not in result
              ):

                  result.insert(
                      0,
                      "PC"
                  )


              return result


          # ==========================================================
          # IMAGE SEARCH
          # ==========================================================

          def bing_image_search(
              game_title,
              limit=12
          ):

              query = (
                  game_title +
                  " game official screenshot"
              )

              url = (
                  "https://www.bing.com/images/search?"
                  "q=" + quote(query) +
                  "&form=HDRSC2"
              )

              print(
                  "画像検索:",
                  query
              )

              try:

                  r = session.get(
                      url,
                      timeout=20
                  )

                  r.raise_for_status()

                  text = r.text

                  urls = []

                  # Bing画像検索HTML内のmurl
                  matches = re.findall(
                      r'"murl":"(.*?)"',
                      text
                  )

                  for x in matches:

                      x = (
                          x.replace(
                              "\\/",
                              "/"
                          )
                          .replace(
                              "\\u002f",
                              "/"
                          )
                      )

                      if x not in urls:
                          urls.append(x)

                      if len(urls) >= limit:
                          break


                  return urls

              except Exception as e:

                  print(
                      "BING IMAGE ERROR:",
                      e
                  )

                  return []


          # ==========================================================
          # IMAGE QUALITY
          # ==========================================================

          def image_is_good(
              path
          ):

              try:

                  im = Image.open(
                      path
                  )

                  width, height = im.size

                  print(
                      "画像サイズ:",
                      width,
                      "x",
                      height
                  )

                  # 小さすぎる画像
                  if width < 600:
                      return False

                  if height < 400:
                      return False

                  # 極端な縦長・横長
                  ratio = width / height

                  if ratio > 4.5:
                      return False

                  if ratio < 0.25:
                      return False

                  # ほぼ単色画像
                  thumb = im.convert(
                      "RGB"
                  ).resize(
                      (20, 20)
                  )

                  pixels = list(
                      thumb.getdata()
                  )

                  avg = []

                  for i in range(3):

                      avg.append(
                          sum(
                              p[i]
                              for p in pixels
                          ) / len(pixels)
                      )

                  variation = sum(
                      (
                          (p[0] - avg[0]) ** 2 +
                          (p[1] - avg[1]) ** 2 +
                          (p[2] - avg[2]) ** 2
                      )
                      for p in pixels
                  ) / len(pixels)

                  if variation < 150:
                      return False

                  return True

              except:

                  return False


          # ==========================================================
          # DOWNLOAD IMAGE
          # ==========================================================

          def download_image(
              url,
              index
          ):

              try:

                  r = session.get(
                      url,
                      timeout=20,
                      stream=True
                  )

                  if r.status_code != 200:
                      return None

                  content_type = r.headers.get(
                      "content-type",
                      ""
                  ).lower()

                  if (
                      "image" not in
                      content_type
                  ):

                      return None


                  data = r.content

                  if len(data) < 30000:
                      return None

                  if len(data) > 15 * 1024 * 1024:
                      return None


                  filename = os.path.join(
                      IMAGE_DIR,
                      f"image_{index}.jpg"
                  )

                  with open(
                      filename,
                      "wb"
                  ) as f:

                      f.write(data)


                  if not image_is_good(
                      filename
                  ):

                      os.remove(
                          filename
                      )

                      return None


                  # JPEG化
                  im = Image.open(
                      filename
                  ).convert(
                      "RGB"
                  )

                  im.save(
                      filename,
                      "JPEG",
                      quality=92
                  )

                  return filename


              except Exception as e:

                  print(
                      "DOWNLOAD IMAGE ERROR:",
                      e
                  )

                  return None


          # ==========================================================
          # COLLECT GAME IMAGES
          # ==========================================================

          def collect_game_images(
              game_title
          ):

              print("")
              print(
                  "================================"
              )
              print(
                  "GAME IMAGE TEST"
              )
              print(
                  "================================"
              )

              urls = bing_image_search(
                  game_title,
                  20
              )

              print(
                  "画像候補:",
                  len(urls)
              )

              paths = []

              hashes = set()

              index = 0

              for url in urls:

                  if len(paths) >= 5:
                      break

                  try:

                      r = session.get(
                          url,
                          timeout=15
                      )

                      if r.status_code != 200:
                          continue

                      data = r.content

                      if len(data) < 30000:
                          continue

                      digest = hashlib.md5(
                          data
                      ).hexdigest()

                      if digest in hashes:
                          continue

                      hashes.add(
                          digest
                      )

                      tmp = os.path.join(
                          IMAGE_DIR,
                          "tmp_" +
                          str(index) +
                          ".jpg"
                      )

                      with open(
                          tmp,
                          "wb"
                      ) as f:

                          f.write(data)


                      if not image_is_good(
                          tmp
                      ):

                          os.remove(
                              tmp
                          )

                          continue


                      im = Image.open(
                          tmp
                      ).convert(
                          "RGB"
                      )

                      final = os.path.join(
                          IMAGE_DIR,
                          f"game_{len(paths)+1}.jpg"
                      )

                      im.save(
                          final,
                          "JPEG",
                          quality=92
                      )

                      os.remove(
                          tmp
                      )

                      paths.append(
                          final
                      )

                      print(
                          "採用画像:",
                          final
                      )

                  except:

                      continue


                  index += 1


              print("")
              print(
                  "有効画像:",
                  len(paths)
              )

              # ------------------------------------------
              # 画像テスト
              # ------------------------------------------

              if len(paths) < 3:

                  print("")
                  print(
                      "❌ IMAGE TEST FAILED"
                  )

                  print(
                      "まともなゲーム画像が"
                      "3枚未満です。"
                  )

                  return []

              print("")
              print(
                  "✅ IMAGE TEST PASSED"
              )

              return paths


          # ==========================================================
          # VIDEO DESIGN
          # ==========================================================

          FONT_PATH = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
          )

          FONT_PATH_REG = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Regular.ttc"
          )


          def get_font(
              size,
              bold=True
          ):

              path = (
                  FONT_PATH
                  if bold
                  else FONT_PATH_REG
              )

              return ImageFont.truetype(
                  path,
                  size
              )


          FONT_HUGE = get_font(
              88
          )

          FONT_BIG = get_font(
              68
          )

          FONT_MED = get_font(
              48
          )

          FONT_SMALL = get_font(
              38,
              False
          )


          def fit_image(
              image,
              width,
              height
          ):

              image = image.convert(
                  "RGB"
              )

              iw, ih = image.size

              scale = max(
                  width / iw,
                  height / ih
              )

              nw = int(
                  iw * scale
              )

              nh = int(
                  ih * scale
              )

              image = image.resize(
                  (nw, nh),
                  Image.LANCZOS
              )

              left = (
                  nw - width
              ) // 2

              top = (
                  nh - height
              ) // 2

              return image.crop(
                  (
                      left,
                      top,
                      left + width,
                      top + height
                  )
              )


          def add_dark_gradient(
              canvas
          ):

              overlay = Image.new(
                  "RGBA",
                  canvas.size,
                  (0, 0, 0, 0)
              )

              draw = ImageDraw.Draw(
                  overlay
              )

              width, height = canvas.size

              for y in range(
                  int(height * 0.45),
                  height
              ):

                  alpha = int(
                      180 *
                      (
                          y -
                          height * 0.45
                      ) /
                      (
                          height * 0.55
                      )
                  )

                  draw.line(
                      (0, y, width, y),
                      fill=(
                          0,
                          0,
                          0,
                          min(
                              210,
                              alpha
                          )
                      )
                  )

              canvas.alpha_composite(
                  overlay
              )


          def draw_center_text(
              draw,
              text,
              y,
              font,
              width=1080
          ):

              bbox = draw.textbbox(
                  (0, 0),
                  text,
                  font=font,
                  stroke_width=3
              )

              tw = (
                  bbox[2] -
                  bbox[0]
              )

              x = (
                  width -
                  tw
              ) // 2

              draw.text(
                  (
                      x,
                      y
                  ),
                  text,
                  font=font,
                  fill="white",
                  stroke_width=4,
                  stroke_fill="black"
              )


          def make_scene(
              image_path,
              title,
              subtitle,
              small_text,
              zoom=1.0
          ):

              W = 1080
              H = 1920

              base = Image.new(
                  "RGBA",
                  (W, H),
                  (0, 0, 0, 255)
              )

              img = Image.open(
                  image_path
              ).convert(
                  "RGB"
              )

              # slight zoom
              if zoom != 1.0:

                  iw, ih = img.size

                  img = img.resize(
                      (
                          int(iw * zoom),
                          int(ih * zoom)
                      ),
                      Image.LANCZOS
                  )

              img = fit_image(
                  img,
                  W,
                  H
              )

              base.paste(
                  img,
                  (0, 0)
              )

              add_dark_gradient(
                  base
              )

              draw = ImageDraw.Draw(
                  base
              )

              # top label

              draw.rounded_rectangle(
                  (
                      45,
                      55,
                      370,
                      125
                  ),
                  radius=20,
                  fill=(
                      0,
                      0,
                      0,
                      185
                  )
              )

              draw.text(
                  (
                      70,
                      70
                  ),
                  "GAME NEWS",
                  font=FONT_MED,
                  fill="white"
              )


              # title

              draw_center_text(
                  draw,
                  title,
                  1220,
                  FONT_HUGE
              )


              # subtitle

              draw_center_text(
                  draw,
                  subtitle,
                  1340,
                  FONT_BIG
              )


              # footer

              draw_center_text(
                  draw,
                  small_text,
                  1780,
                  FONT_SMALL
              )

              return base.convert(
                  "RGB"
              )


          # ==========================================================
          # CREATE VIDEO
          # ==========================================================

          def create_video(
              game,
              release,
              platforms,
              images
          ):

              print("")
              print(
                  "================================"
              )
              print(
                  "VIDEO CREATION"
              )
              print(
                  "================================"
              )

              scenes = []

              platform_text = " / ".join(
                  platforms[:5]
              )

              scene_data = [

                  (
                      images[0],
                      game,
                      "新作ゲームニュース",
                      "注目タイトル"
                  ),

                  (
                      images[1],
                      "発売日決定",
                      release,
                      "発売情報"
                  ),

                  (
                      images[2],
                      "注目の新作",
                      "ゲーム最新情報",
                      "GAME RADAR"
                  ),

                  (
                      images[3]
                      if len(images) > 3
                      else images[0],
                      "対応機種",
                      platform_text,
                      "PLAY NOW"
                  ),

                  (
                      images[4]
                      if len(images) > 4
                      else images[1],
                      "発売日",
                      release,
                      "フォローで最新ゲーム情報"
                  )
              ]


              for i, data in enumerate(
                  scene_data
              ):

                  path = os.path.join(
                      OUT,
                      f"scene_{i}.png"
                  )

                  scene = make_scene(
                      data[0],
                      data[1],
                      data[2],
                      data[3],
                      zoom=1.04 + i * 0.015
                  )

                  scene.save(
                      path,
                      "JPEG",
                      quality=94
                  )

                  scenes.append(
                      path
                  )


              concat = os.path.join(
                  OUT,
                  "concat.txt"
              )

              with open(
                  concat,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for path in scenes:

                      f.write(
                          "file '" +
                          os.path.abspath(
                              path
                          ) +
                          "'\n"
                      )

                      f.write(
                          "duration 3\n"
                      )

                  f.write(
                      "file '" +
                      os.path.abspath(
                          scenes[-1]
                      ) +
                      "'\n"
                  )


              output = os.path.join(
                  OUT,
                  "game_news_tiktok.mp4"
              )


              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  concat,

                  "-vf",
                  (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio=decrease,"
                      "pad=1080:1920:"
                      "(ow-iw)/2:"
                      "(oh-ih)/2"
                  ),

                  "-r",
                  "30",

                  "-c:v",
                  "libx264",

                  "-preset",
                  "medium",

                  "-crf",
                  "20",

                  "-pix_fmt",
                  "yuv420p",

                  "-movflags",
                  "+faststart",

                  output
              ]


              subprocess.run(
                  cmd,
                  check=True
              )

              return output


          # ==========================================================
          # MAIN
          # ==========================================================

          print("")
          print(
              "=========================================="
          )
          print(
              "GAME NEWS RADAR START"
          )
          print(
              "=========================================="
          )


          candidates = []
          seen = set()


          # ----------------------------------------------------------
          # Collect news
          # ----------------------------------------------------------

          for query in NEWS_QUERIES:

              print(
                  "NEWS:",
                  query
              )

              entries = google_news(
                  query
              )

              for entry in entries:

                  link = entry.get(
                      "link",
                      ""
                  )

                  if not link:
                      continue

                  if link in seen:
                      continue

                  seen.add(
                      link
                  )

                  candidates.append(
                      {
                          "title":
                              html.unescape(
                                  entry.get(
                                      "title",
                                      ""
                                  )
                              ),

                          "summary":
                              html.unescape(
                                  entry.get(
                                      "summary",
                                      ""
                                  )
                              ),

                          "link":
                              link
                      }
                  )


          print("")
          print(
              "ニュース候補:",
              len(candidates)
          )


          selected = None


          # ----------------------------------------------------------
          # Evaluate
          # ----------------------------------------------------------

          for number, candidate in enumerate(
              candidates[:40],
              1
          ):

              print("")
              print(
                  "------------------------------------------"
              )

              print(
                  "候補:",
                  number
              )

              print(
                  candidate["title"]
              )


              article_title, body, article_image = (
                  fetch_article(
                      candidate["link"]
                  )
              )


              text = (
                  candidate["title"] +
                  " " +
                  candidate["summary"] +
                  " " +
                  article_title +
                  " " +
                  body
              )


              game = extract_game_title(
                  candidate["title"]
              )

              release = extract_release_date(
                  text
              )

              platforms = extract_platforms(
                  text
              )


              print(
                  "GAME:",
                  game
              )

              print(
                  "RELEASE:",
                  release
              )

              print(
                  "PLATFORM:",
                  platforms
              )


              if not release:
                  print(
                      "SKIP: release date"
                  )
                  continue


              if not platforms:
                  print(
                      "SKIP: platform"
                  )
                  continue


              # ------------------------------------------------------
              # IMAGE TEST
              # ------------------------------------------------------

              images = collect_game_images(
                  game
              )


              if len(images) < 3:

                  print(
                      "SKIP: image test failed"
                  )

                  continue


              # ------------------------------------------------------
              # SUCCESS
              # ------------------------------------------------------

              selected = {
                  "game":
                      game,

                  "release":
                      release,

                  "platforms":
                      platforms,

                  "images":
                      images,

                  "source":
                      candidate["link"],

                  "title":
                      candidate["title"]
              }

              break


          # ----------------------------------------------------------
          # Nothing
          # ----------------------------------------------------------

          if not selected:

              print("")
              print(
                  "=========================================="
              )

              print(
                  "動画生成なし"
              )

              print(
                  "条件を満たすニュース、"
                  "または画像が見つかりませんでした。"
              )

              print(
                  "=========================================="
              )

              raise SystemExit(0)


          # ----------------------------------------------------------
          # VIDEO
          # ----------------------------------------------------------

          print("")
          print(
              "=========================================="
          )

          print(
              "採用ニュース"
          )

          print(
              "ゲーム:",
              selected["game"]
          )

          print(
              "発売日:",
              selected["release"]
          )

          print(
              "対応機種:",
              ", ".join(
                  selected["platforms"]
              )
          )

          print(
              "画像:",
              len(
                  selected["images"]
              )
          )

          print(
              "=========================================="
          )


          video = create_video(
              selected["game"],
              selected["release"],
              selected["platforms"],
              selected["images"]
          )


          # ----------------------------------------------------------
          # SOURCE
          # ----------------------------------------------------------

          with open(
              os.path.join(
                  OUT,
                  "source.txt"
              ),
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "GAME NEWS RADAR\n\n"
              )

              f.write(
                  "Game: " +
                  selected["game"] +
                  "\n"
              )

              f.write(
                  "Release: " +
                  selected["release"] +
                  "\n"
              )

              f.write(
                  "Platforms: " +
                  ", ".join(
                      selected["platforms"]
                  ) +
                  "\n"
              )

              f.write(
                  "Article: " +
                  selected["title"] +
                  "\n"
              )

              f.write(
                  "Source: " +
                  selected["source"] +
                  "\n\n"
              )

              f.write(
                  "Images:\n"
              )

              for image in selected[
                  "images"
              ]:

                  f.write(
                      image +
                      "\n"
                  )


          print("")
          print(
              "=========================================="
          )

          print(
              "🎬 VIDEO CREATED"
          )

          print(
              video
          )

          print(
              "=========================================="
          )

          PY


          python make_game_news.py


