name: Parent Game Radar

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow feedparser

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          docker run -d \
            --name voicevox \
            -p 50021:50021 \
            voicevox/voicevox_engine:cpu-ubuntu20.04-latest

          echo "VOICEVOX起動待ち..."
          for i in {1..60}; do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX OK"
              break
            fi
            sleep 2
          done

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import os
          import re
          import io
          import json
          import time
          import math
          import hashlib
          import subprocess
          from pathlib import Path
          from urllib.parse import quote, urljoin

          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageFilter


          OUT = Path("output")
          IMG_DIR = OUT / "images"
          SCENE_DIR = OUT / "scenes"

          OUT.mkdir(exist_ok=True)
          IMG_DIR.mkdir(exist_ok=True)
          SCENE_DIR.mkdir(exist_ok=True)

          HEADERS = {
              "User-Agent":
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/139 Safari/537.36"
          }

          W = 1080
          H = 1920

          # TikTok UI回避ゾーン
          SAFE_LEFT = 110
          SAFE_RIGHT = 900
          SAFE_TOP = 180
          SAFE_BOTTOM = 1380

          # -----------------------------
          # HTTP
          # -----------------------------

          session = requests.Session()
          session.headers.update(HEADERS)

          def get(url, timeout=15):
              try:
                  r = session.get(url, timeout=timeout)
                  if r.status_code == 200:
                      return r
              except Exception:
                  pass
              return None


          # -----------------------------
          # Google News
          # -----------------------------

          NEWS_QUERIES = [
              "親子 ゲーム",
              "家族 ゲーム",
              "2人 協力 ゲーム",
              "親子で遊べる ゲーム",
              "家族で遊べる ゲーム",
              "2人プレイ ゲーム",
              "協力プレイ ゲーム",
              "ローカル協力 ゲーム",
              "ファミリー ゲーム",
              "子ども ゲーム",
          ]

          def google_news_candidates():
              results = []

              for q in NEWS_QUERIES:
                  url = (
                      "https://news.google.com/rss/search?"
                      f"q={quote(q)}&hl=ja&gl=JP&ceid=JP:ja"
                  )

                  r = get(url)

                  if not r:
                      continue

                  try:
                      feed = feedparser.parse(r.content)
                  except Exception:
                      continue

                  for item in feed.entries[:30]:
                      title = getattr(item, "title", "")
                      link = getattr(item, "link", "")

                      if title:
                          results.append({
                              "title": title,
                              "link": link,
                              "source": "Google News"
                          })

              return results


          # -----------------------------
          # Steam Search
          # 新作ではなく「親子向け候補」を発掘する
          # -----------------------------

          STEAM_SEARCH_TERMS = [
              "family friendly local co op",
              "local co op",
              "local multiplayer",
              "4 player local",
              "co op family",
              "family friendly",
              "party co op",
          ]

          def steam_search(term):
              url = "https://store.steampowered.com/search/?term=" + quote(term)
              r = get(url)

              if not r:
                  return []

              soup = BeautifulSoup(r.text, "html.parser")
              results = []

              for row in soup.select("a.search_result_row")[:40]:
                  appid = row.get("data-ds-appid", "")
                  href = row.get("href", "")
                  name_el = row.select_one(".title")

                  if not appid or not name_el:
                      continue

                  # data-ds-appidに複数IDが入る場合がある
                  appid = appid.split(",")[0].strip()

                  try:
                      int(appid)
                  except Exception:
                      continue

                  results.append({
                      "appid": appid,
                      "title": name_el.get_text(" ", strip=True),
                      "steam_url": href
                  })

              return results


          def steam_candidates():
              found = {}

              for term in STEAM_SEARCH_TERMS:
                  for item in steam_search(term):
                      key = item["appid"]

                      if key not in found:
                          found[key] = item

              return list(found.values())


          # -----------------------------
          # Steam App Details
          # -----------------------------

          def steam_details(appid):
              url = (
                  "https://store.steampowered.com/api/appdetails"
                  f"?appids={appid}&l=japanese"
              )

              r = get(url)

              if not r:
                  return None

              try:
                  obj = r.json()
                  data = obj.get(str(appid), {})

                  if not data.get("success"):
                      return None

                  return data.get("data")
              except Exception:
                  return None


          # -----------------------------
          # Steamページからタグ・追加情報
          # -----------------------------

          def steam_page_info(url):
              r = get(url)

              if not r:
                  return {
                      "tags": [],
                      "page_text": ""
                  }

              soup = BeautifulSoup(r.text, "html.parser")

              tags = []

              for x in soup.select(".app_tag"):
                  t = x.get_text(" ", strip=True)
                  if t:
                      tags.append(t)

              text = soup.get_text(" ", strip=True)

              return {
                  "tags": tags,
                  "page_text": text[:100000]
              }


          # -----------------------------
          # Google/Bing補助検索
          # Steamにないゲームの情報補強
          # -----------------------------

          def bing_search(query, limit=8):
              url = "https://www.bing.com/search?q=" + quote(query)
              r = get(url)

              if not r:
                  return []

              soup = BeautifulSoup(r.text, "html.parser")
              results = []

              for li in soup.select("li.b_algo")[:limit]:
                  a = li.select_one("h2 a")
                  p = li.select_one(".b_caption p")

                  if not a:
                      continue

                  results.append({
                      "title": a.get_text(" ", strip=True),
                      "url": a.get("href", ""),
                      "snippet": p.get_text(" ", strip=True) if p else ""
                  })

              return results


          def external_evidence(game):
              title = game["title"]

              queries = [
                  f'"{title}" 2人 協力プレイ',
                  f'"{title}" ローカル協力',
                  f'"{title}" 2人プレイ',
                  f'"{title}" 親子',
                  f'"{title}" family friendly',
              ]

              text = ""

              for q in queries:
                  for result in bing_search(q, 5):
                      text += " " + result.get("title", "")
                      text += " " + result.get("snippet", "")

              return text.lower()


          # -----------------------------
          # 文字正規化
          # -----------------------------

          def norm(text):
              if not text:
                  return ""

              text = re.sub(r"\s+", " ", text)
              text = text.replace("　", " ")
              return text.strip()


          # -----------------------------
          # 親子ゲーム判定
          # -----------------------------

          HARD_NEGATIVE = [
              "hentai",
              "nudity",
              "sexual content",
              "sexually explicit",
              "色情",
              "性的",
              "アダルト",
              "成人向け",
              "ギャンブル",
              "gambling",
              "casino",
              "porn",
              "エロ",
          ]

          HORROR_NEGATIVE = [
              "survival horror",
              "psychological horror",
              "horror",
              "ホラー",
              "恐怖",
              "残虐",
              "gore",
              "ゴア",
          ]

          def score_parent_game(data, page_info, external_text):
              categories = [
                  x.get("description", "")
                  for x in data.get("categories", [])
              ]

              genres = [
                  x.get("description", "")
                  for x in data.get("genres", [])
              ]

              description = " ".join([
                  data.get("short_description", ""),
                  data.get("detailed_description", ""),
                  data.get("about_the_game", ""),
                  page_info.get("page_text", ""),
                  external_text
              ])

              description = norm(description).lower()

              category_text = " ".join(categories).lower()
              genre_text = " ".join(genres).lower()
              tags = [x.lower() for x in page_info.get("tags", [])]

              all_text = (
                  description
                  + " "
                  + category_text
                  + " "
                  + genre_text
                  + " "
                  + " ".join(tags)
              )

              score = 0
              evidence = []
              strengths = []
              penalties = []

              # ---------------------------------
              # 強制除外
              # ---------------------------------

              for bad in HARD_NEGATIVE:
                  if bad in all_text:
                      return {
                          "accepted": False,
                          "score": 0,
                          "evidence": [],
                          "strengths": [],
                          "penalties": ["成人向け要素"]
                      }

              horror_hits = sum(1 for x in HORROR_NEGATIVE if x in all_text)

              # ホラー主体は除外
              if (
                  "horror" in genre_text
                  or "survival horror" in all_text
                  or "psychological horror" in all_text
              ):
                  return {
                      "accepted": False,
                      "score": 0,
                      "evidence": [],
                      "strengths": [],
                      "penalties": ["ホラー主体"]
                  }

              # ---------------------------------
              # 1. 一緒に遊べるか
              # 最重要
              # ---------------------------------

              if "local co-op" in category_text:
                  score += 20
                  evidence.append("ローカル協力プレイ")
                  strengths.append("協力プレイ")

              if "shared/split screen co-op" in category_text:
                  score += 20
                  evidence.append("同じ画面で協力プレイ")
                  strengths.append("同じ画面で協力")

              if "shared/split screen" in category_text:
                  score += 12
                  evidence.append("同じ画面で複数人プレイ")
                  strengths.append("同画面プレイ")

              if "4 player local" in " ".join(tags):
                  score += 15
                  evidence.append("最大4人のローカルプレイ")
                  strengths.append("複数人プレイ")

              if "local multiplayer" in " ".join(tags):
                  score += 15
                  evidence.append("ローカルマルチプレイ")
                  strengths.append("複数人プレイ")

              if "remote play together" in category_text:
                  score += 8
                  evidence.append("Remote Play Together")
                  strengths.append("オンラインでも一緒に遊べる")

              if "co-op" in category_text:
                  score += 8
                  evidence.append("協力プレイ")
                  strengths.append("協力プレイ")

              # ---------------------------------
              # 2. 人数
              # ---------------------------------

              player_patterns = [
                  r"up to\s*[2-9]\s*players",
                  r"[2-9]\s*players",
                  r"[2-9]人",
                  r"[2-9]人まで",
                  r"2-4 players",
                  r"2\s*-\s*[4-8]\s*players",
              ]

              player_found = False

              for pat in player_patterns:
                  if re.search(pat, all_text, re.I):
                      player_found = True
                      break

              if player_found:
                  score += 10
                  evidence.append("複数人プレイが確認できる")
                  strengths.append("複数人で遊べる")

              # ---------------------------------
              # 3. 親子向けの具体性
              # ---------------------------------

              family_terms = [
                  "family friendly",
                  "family-friendly",
                  "family",
                  "families",
                  "kids",
                  "children",
                  "child",
                  "parents",
                  "親子",
                  "家族",
                  "子ども",
                  "子供",
                  "ファミリー",
              ]

              family_hits = [
                  x for x in family_terms
                  if x in all_text
              ]

              if family_hits:
                  score += min(8, len(set(family_hits)) * 2)
                  evidence.append("家族向けの記述あり")
                  strengths.append("家族向け")

              # ---------------------------------
              # 4. 親子で遊びやすいゲーム性
              # ---------------------------------

              easy_terms = [
                  "casual",
                  "cute",
                  "wholesome",
                  "party game",
                  "puzzle",
                  "cooking",
                  "building",
                  "creative",
                  "relaxing",
                  "simple",
                  "easy to learn",
                  "easy controls",
                  "cartoon",
                  "colorful",
                  "カジュアル",
                  "パーティー",
                  "パズル",
                  "料理",
                  "建築",
                  "協力",
                  "簡単",
                  "シンプル",
                  "かわいい",
                  "家族",
              ]

              easy_hits = [
                  x for x in easy_terms
                  if x in all_text
              ]

              if easy_hits:
                  score += min(10, len(set(easy_hits)) * 2)
                  strengths.append("親子で入りやすいゲーム性")

              # ---------------------------------
              # 5. 短時間プレイ・気軽さ
              # ---------------------------------

              short_terms = [
                  "short",
                  "quick",
                  "pick up and play",
                  "party",
                  "arcade",
                  "casual",
                  "短時間",
                  "すぐ遊べる",
                  "気軽",
                  "パーティー",
              ]

              if any(x in all_text for x in short_terms):
                  score += 5
                  evidence.append("短時間でも遊びやすい要素")

              # ---------------------------------
              # 6. 親側の楽しさ
              # ---------------------------------

              adult_fun_terms = [
                  "strategy",
                  "challenge",
                  "sandbox",
                  "simulation",
                  "exploration",
                  "crafting",
                  "management",
                  "racing",
                  "adventure",
                  "戦略",
                  "探索",
                  "クラフト",
                  "シミュレーション",
                  "レース",
                  "冒険",
              ]

              adult_hits = [
                  x for x in adult_fun_terms
                  if x in all_text
              ]

              if adult_hits:
                  score += min(8, len(set(adult_hits)) * 2)
                  strengths.append("大人側にも遊びごたえ")

              # ---------------------------------
              # 7. 対戦のみは減点
              # ---------------------------------

              if (
                  "shared/split screen pvp" in category_text
                  and "co-op" not in category_text
                  and "local co-op" not in category_text
              ):
                  score -= 5
                  penalties.append("対戦中心")

              # ---------------------------------
              # 必須の具体的根拠
              # ---------------------------------

              concrete_play = any([
                  "local co-op" in category_text,
                  "shared/split screen co-op" in category_text,
                  "shared/split screen" in category_text,
                  "local multiplayer" in " ".join(tags),
                  "4 player local" in " ".join(tags),
                  "co-op" in category_text and player_found,
              ])

              family_evidence = (
                  bool(family_hits)
                  or bool(easy_hits)
                  or "wholesome" in all_text
                  or "cute" in all_text
                  or "party game" in all_text
              )

              # 親子価値の核心。
              # 「協力して遊べる」だけでなく、
              # 家族・初心者向けなどの補助根拠も必要。
              if not concrete_play:
                  return {
                      "accepted": False,
                      "score": score,
                      "evidence": evidence,
                      "strengths": strengths,
                      "penalties": ["親子で一緒に遊ぶ具体的根拠不足"]
                  }

              if not family_evidence:
                  return {
                      "accepted": False,
                      "score": score,
                      "evidence": evidence,
                      "strengths": strengths,
                      "penalties": ["親子向けの補助根拠不足"]
                  }

              # 最低2つの具体的根拠
              if len(set(evidence)) < 2:
                  return {
                      "accepted": False,
                      "score": score,
                      "evidence": evidence,
                      "strengths": strengths,
                      "penalties": ["根拠不足"]
                  }

              accepted = score >= 60

              return {
                  "accepted": accepted,
                  "score": score,
                  "evidence": list(dict.fromkeys(evidence)),
                  "strengths": list(dict.fromkeys(strengths)),
                  "penalties": list(dict.fromkeys(penalties))
              }


          # -----------------------------
          # 画像取得
          # -----------------------------

          def image_bytes(url):
              try:
                  r = session.get(
                      url,
                      timeout=20,
                      headers={
                          **HEADERS,
                          "Referer": "https://store.steampowered.com/"
                      }
                  )

                  if r.status_code != 200:
                      return None

                  if len(r.content) < 30000:
                      return None

                  return r.content
              except Exception:
                  return None


          def valid_image(data):
              try:
                  img = Image.open(io.BytesIO(data)).convert("RGB")

                  w, h = img.size

                  if w < 700 or h < 400:
                      return False

                  ratio = w / h

                  if ratio < 1.15 or ratio > 3.2:
                      return False

                  # ほぼ単色の画像を除外
                  thumb = img.resize((40, 40))
                  pixels = list(thumb.getdata())

                  avg = tuple(
                      sum(p[i] for p in pixels) / len(pixels)
                      for i in range(3)
                  )

                  variance = sum(
                      sum((p[i] - avg[i]) ** 2 for i in range(3))
                      for p in pixels
                  ) / len(pixels)

                  if variance < 500:
                      return False

                  return True

              except Exception:
                  return False


          def get_game_images(data):
              urls = []

              if data.get("screenshots"):
                  for s in data["screenshots"]:
                      u = s.get("path_full") or s.get("path_thumbnail")

                      if u:
                          urls.append(u)

              if data.get("header_image"):
                  urls.append(data["header_image"])

              return list(dict.fromkeys(urls))


          def save_images(game, urls):
              saved = []

              for i, url in enumerate(urls[:12]):
                  raw = image_bytes(url)

                  if not raw:
                      continue

                  if not valid_image(raw):
                      continue

                  path = IMG_DIR / f"{game['safe_name']}_{i}.jpg"

                  try:
                      img = Image.open(io.BytesIO(raw)).convert("RGB")
                      img.save(path, quality=94)

                      saved.append(str(path))

                  except Exception:
                      continue

                  if len(saved) >= 5:
                      break

              return saved


          # -----------------------------
          # ゲーム情報抽出
          # -----------------------------

          def safe_name(text):
              x = re.sub(r"[^\wぁ-んァ-ン一-龥ー]+", "_", text)
              return x[:50]


          def release_text(data):
              date = (
                  data.get("release_date", {})
                  .get("date", "")
              )

              if not date:
                  return ""

              return date


          def platform_text(data):
              p = data.get("platforms", {})

              vals = []

              if p.get("windows"):
                  vals.append("PC")

              if p.get("mac"):
                  vals.append("Mac")

              if p.get("linux"):
                  vals.append("Linux")

              return " / ".join(vals)


          def genre_text(data):
              vals = [
                  x.get("description", "")
                  for x in data.get("genres", [])
              ]

              return "・".join(vals[:3])


          def game_description(data):
              desc = data.get("short_description", "")

              if not desc:
                  desc = data.get("detailed_description", "")

              desc = BeautifulSoup(desc, "html.parser").get_text(" ", strip=True)

              return norm(desc)


          # -----------------------------
          # 動画用テキスト
          # -----------------------------

          def choose_game_hook(game):
              strengths = game["judgement"]["strengths"]

              if "協力プレイ" in strengths:
                  return "これ、親子で一緒に遊ぶとかなり楽しそう。"

              if "同じ画面で協力" in strengths:
                  return "これ、親子で同じ画面で遊べます。"

              if "複数人プレイ" in strengths:
                  return "週末に親子で遊ぶなら、これ。"

              return "子どもと一緒に遊ぶゲーム、これ候補です。"


          def choose_play_sentence(game):
              ev = game["judgement"]["evidence"]

              if "同じ画面で協力プレイ" in ev:
                  return "同じ画面で協力して遊べるのがポイント。"

              if "ローカル協力プレイ" in ev:
                  return "家で一緒に協力プレイできるのがポイント。"

              if "最大4人のローカルプレイ" in ev:
                  return "家族で複数人プレイできるのがポイント。"

              if "ローカルマルチプレイ" in ev:
                  return "家で一緒に遊べるのがポイント。"

              if "協力プレイ" in ev:
                  return "協力して遊べるのが大きな魅力。"

              return "一緒に遊べる仕組みが魅力です。"


          def choose_parent_sentence(game):
              strengths = game["judgement"]["strengths"]

              if "親子で入りやすいゲーム性" in strengths:
                  return "操作やルールも比較的入りやすく、親子で始めやすそう。"

              if "大人側にも遊びごたえ" in strengths:
                  return "子どもだけでなく、大人もしっかり楽しめるタイプ。"

              return "子どもと一緒に遊ぶ理由がしっかりあるゲームです。"


          def make_narrations(game):
              title = game["title"]
              hook = choose_game_hook(game)
              play = choose_play_sentence(game)
              parent = choose_parent_sentence(game)

              genre = game.get("genre", "")

              if genre:
                  genre_sentence = f"{title}は、{genre}系のゲーム。"
              else:
                  genre_sentence = f"{title}は、こんなゲームです。"

              # 30秒を4シーンで構成
              return [
                  hook,
                  f"{title}。{genre_sentence}",
                  f"{play}{parent}",
                  f"対応機種は{game['platforms']}。週末の親子ゲーム候補に保存しておこう。"
              ]


          # -----------------------------
          # VOICEVOX
          # -----------------------------

          VOICEVOX_URL = "http://127.0.0.1:50021"
          SPEAKER = 3

          def clean_tts(text):
              text = norm(text)

              # 同一文の重複
              parts = re.split(r"([。！？])", text)

              out = []
              last = ""

              for p in parts:
                  if not p:
                      continue

                  if p == last:
                      continue

                  out.append(p)
                  last = p

              text = "".join(out)

              # 「対応機種は対応機種は」のような重複
              text = re.sub(
                  r"(対応機種は|発売日は|親子で|ゲーム)",
                  lambda m: m.group(0),
                  text
              )

              text = re.sub(
                  r"(.{2,10})\1{1,2}",
                  lambda m: m.group(1),
                  text
              )

              return text.strip()


          def voicevox(text, outpath):
              text = clean_tts(text)

              try:
                  q = session.post(
                      VOICEVOX_URL + "/audio_query",
                      params={
                          "text": text,
                          "speaker": SPEAKER
                      },
                      timeout=30
                  )

                  if q.status_code != 200:
                      return False

                  query = q.json()

                  # 少しだけゆっくり
                  query["speedScale"] = 0.98
                  query["intonationScale"] = 1.05

                  s = session.post(
                      VOICEVOX_URL + "/synthesis",
                      params={
                          "speaker": SPEAKER
                      },
                      json=query,
                      timeout=60
                  )

                  if s.status_code != 200:
                      return False

                  Path(outpath).write_bytes(s.content)
                  return True

              except Exception:
                  return False


          # -----------------------------
          # 音声長を取得
          # -----------------------------

          def duration(path):
              cmd = [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(path)
              ]

              try:
                  out = subprocess.check_output(cmd).decode().strip()
                  return float(out)
              except Exception:
                  return 0


          # -----------------------------
          # 画像から縦動画用背景を作る
          # -----------------------------

          def make_scene_image(image_path, game, scene_no, overlay_text):
              img = Image.open(image_path).convert("RGB")

              # 背景
              bg = img.copy()
              bg.thumbnail((W, H))

              canvas = Image.new("RGB", (W, H), (12, 12, 16))

              # 背景をぼかして全面表示
              bg2 = img.copy()
              bg2.thumbnail((W, H))

              bw, bh = bg2.size
              x = (W - bw) // 2
              y = (H - bh) // 2

              canvas.paste(bg2, (x, y))
              canvas = canvas.filter(ImageFilter.GaussianBlur(18))

              # メイン画像
              main = img.copy()

              target_w = 920
              target_h = 1030

              ratio = max(
                  target_w / main.width,
                  target_h / main.height
              )

              nw = int(main.width * ratio)
              nh = int(main.height * ratio)

              main = main.resize((nw, nh), Image.LANCZOS)

              left = (nw - target_w) // 2
              top = (nh - target_h) // 2

              main = main.crop(
                  (left, top, left + target_w, top + target_h)
              )

              # 少し角丸
              canvas.paste(main, (80, 300))

              draw = ImageDraw.Draw(canvas)

              try:
                  font_big = ImageFont.truetype(
                      "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
                      68
                  )
                  font_title = ImageFont.truetype(
                      "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
                      48
                  )
                  font_sub = ImageFont.truetype(
                      "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
                      38
                  )
                  font_small = ImageFont.truetype(
                      "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
                      30
                  )
              except Exception:
                  font_big = font_title = font_sub = font_small = None

              # 上部タイトル
              draw.rounded_rectangle(
                  (70, 75, 1010, 245),
                  radius=35,
                  fill=(15, 15, 20)
              )

              draw.text(
                  (105, 100),
                  game["title"][:22],
                  font=font_title,
                  fill="white"
              )

              # シーンラベル
              labels = [
                  "親子で遊ぶならコレ",
                  "どんなゲーム？",
                  "親子向きポイント",
                  "対応機種"
              ]

              draw.rounded_rectangle(
                  (80, 260, 500, 330),
                  radius=25,
                  fill=(255, 214, 64)
              )

              draw.text(
                  (110, 275),
                  labels[scene_no],
                  font=font_small,
                  fill="black"
              )

              # 下部字幕
              # TikTokの説明文/UI領域を避けてかなり上に配置
              sub_box = (70, 1390, 1010, 1680)

              draw.rounded_rectangle(
                  sub_box,
                  radius=32,
                  fill=(10, 10, 14)
              )

              # 折り返し
              words = overlay_text
              lines = []

              line = ""

              for ch in words:
                  test = line + ch
                  box = draw.textbbox(
                      (0, 0),
                      test,
                      font=font_sub
                  )

                  if box[2] > 850:
                      if line:
                          lines.append(line)
                      line = ch
                  else:
                      line = test

              if line:
                  lines.append(line)

              lines = lines[:4]

              yy = 1435

              for ln in lines:
                  draw.text(
                      (110, yy),
                      ln,
                      font=font_sub,
                      fill="white"
                  )
                  yy += 55

              # シーン進行
              progress_w = int(880 * ((scene_no + 1) / 4))

              draw.rounded_rectangle(
                  (100, 1770, 980, 1790),
                  radius=10,
                  fill=(70, 70, 80)
              )

              draw.rounded_rectangle(
                  (100, 1770, 100 + progress_w, 1790),
                  radius=10,
                  fill=(255, 214, 64)
              )

              path = SCENE_DIR / f"scene_{scene_no+1}.png"
              canvas.save(path, quality=95)

              return path


          # -----------------------------
          # BGM
          # -----------------------------

          def make_bgm():
              path = OUT / "bgm.wav"

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f", "lavfi",
                  "-i",
                  "sine=frequency=110:duration=30,"
                  "volume=0.035",
                  "-f", "lavfi",
                  "-i",
                  "sine=frequency=165:duration=30,"
                  "volume=0.025",
                  "-f", "lavfi",
                  "-i",
                  "sine=frequency=220:duration=30,"
                  "volume=0.018",
                  "-filter_complex",
                  "[0][1][2]amix=inputs=3:duration=longest,"
                  "afade=t=in:st=0:d=1,"
                  "afade=t=out:st=27:d=3",
                  str(path)
              ]

              subprocess.run(
                  cmd,
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              return path


          # -----------------------------
          # シーン動画
          # -----------------------------

          def make_scene_video(image, outpath, duration_sec=7.5):
              # ゆっくりズーム
              vf = (
                  "scale=1080:1920:force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "zoompan="
                  "z='min(zoom+0.0008,1.035)':"
                  "x='iw/2-(iw/zoom/2)':"
                  "y='ih/2-(ih/zoom/2)':"
                  "d=1:s=1080x1920:fps=30"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-loop", "1",
                  "-i", str(image),
                  "-vf", vf,
                  "-t", str(duration_sec),
                  "-r", "30",
                  "-pix_fmt", "yuv420p",
                  "-an",
                  str(outpath)
              ]

              subprocess.run(
                  cmd,
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )


          # -----------------------------
          # 音声＋BGM＋動画
          # -----------------------------

          def build_video(game, scene_images, narrations):
              audio_files = []

              for i, text in enumerate(narrations):
                  p = OUT / f"voice_{i+1}.wav"

                  if not voicevox(text, p):
                      raise RuntimeError("VOICEVOX失敗")

                  audio_files.append(p)

              # 4シーン × 7.5秒 = 30秒
              scene_videos = []

              for i, img in enumerate(scene_images):
                  v = OUT / f"scene_video_{i+1}.mp4"

                  make_scene_video(
                      img,
                      v,
                      duration_sec=7.5
                  )

                  scene_videos.append(v)

              # concat
              concat_file = OUT / "concat.txt"

              with open(concat_file, "w", encoding="utf-8") as f:
                  for v in scene_videos:
                      f.write(f"file '{v.resolve()}'\n")

              base = OUT / "base.mp4"

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-f", "concat",
                      "-safe", "0",
                      "-i", str(concat_file),
                      "-c", "copy",
                      "-t", "30",
                      str(base)
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              # 音声
              voice_concat = OUT / "voice_concat.txt"

              with open(voice_concat, "w", encoding="utf-8") as f:
                  for a in audio_files:
                      f.write(f"file '{a.resolve()}'\n")

              voices = OUT / "voices.wav"

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-f", "concat",
                      "-safe", "0",
                      "-i", str(voice_concat),
                      "-c:a", "pcm_s16le",
                      str(voices)
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              bgm = make_bgm()

              final = OUT / "parent_game_radar.mp4"

              # ナレーションを主役、BGMをかなり小さく
              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i", str(base),
                      "-i", str(voices),
                      "-i", str(bgm),
                      "-filter_complex",
                      "[1:a]volume=1.0[voice];"
                      "[2:a]volume=0.10[bgm];"
                      "[voice][bgm]amix=inputs=2:"
                      "duration=longest:dropout_transition=2[a]",
                      "-map", "0:v",
                      "-map", "[a]",
                      "-t", "30",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "20",
                      "-c:a", "aac",
                      "-b:a", "192k",
                      "-pix_fmt", "yuv420p",
                      "-movflags", "+faststart",
                      str(final)
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )

              return final


          # -----------------------------
          # 候補統合
          # -----------------------------

          def make_news_title_candidates():
              out = []

              for x in google_news_candidates():
                  title = x["title"]

                  # 記事タイトルからゲーム名っぽいものを抽出
                  patterns = [
                      r"『([^』]+)』",
                      r"「([^」]+)」",
                      r"【([^】]+)】",
                  ]

                  found = None

                  for pat in patterns:
                      m = re.search(pat, title)

                      if m:
                          found = m.group(1)
                          break

                  if found:
                      out.append({
                          "title": found,
                          "news_title": title,
                          "news_url": x["link"]
                      })

              return out


          # -----------------------------
          # メイン
          # -----------------------------

          print("=== Parent Game Radar ===")
          print("新作縛りなし")
          print("発売日必須なし")
          print("親子プレイ価値を最優先")

          steam = steam_candidates()

          print(f"Steam候補: {len(steam)}")

          candidates = {}

          # Steam候補
          for x in steam:
              key = re.sub(
                  r"[^a-z0-9ぁ-んァ-ン一-龥ー]",
                  "",
                  x["title"].lower()
              )

              if key:
                  candidates[key] = {
                      "title": x["title"],
                      "appid": x["appid"],
                      "steam_url": x["steam_url"],
                      "news_url": ""
                  }

          # Google News候補
          for x in make_news_title_candidates():
              key = re.sub(
                  r"[^a-z0-9ぁ-んァ-ン一-龥ー]",
                  "",
                  x["title"].lower()
              )

              if key and key not in candidates:
                  candidates[key] = {
                      "title": x["title"],
                      "appid": None,
                      "steam_url": "",
                      "news_url": x["news_url"]
                  }

          print(f"統合候補: {len(candidates)}")

          accepted_games = []

          for idx, raw in enumerate(list(candidates.values())[:120], 1):
              title = raw["title"]

              print(
                  f"[{idx}] 判定中: {title}"
              )

              data = None
              page_info = {
                  "tags": [],
                  "page_text": ""
              }

              if raw.get("appid"):
                  data = steam_details(raw["appid"])

                  if data:
                      page_info = steam_page_info(
                          raw["steam_url"]
                      )

              # Steamにない場合は補助検索
              if not data:
                  ext = external_evidence({
                      "title": title
                  })

                  # 外部情報だけでの採用はかなり厳しくする
                  if (
                      "2人" not in ext
                      and "2 player" not in ext
                      and "co-op" not in ext
                      and "協力" not in ext
                  ):
                      continue

                  # Steam情報が取れないゲームは
                  # 今回は安全のため採用しない
                  continue

              external = external_evidence({
                  "title": title
              })

              game = {
                  "title": data.get("name") or title,
                  "appid": raw.get("appid"),
                  "steam_url": raw.get("steam_url", ""),
                  "news_url": raw.get("news_url", ""),
                  "release": release_text(data),
                  "platforms": platform_text(data),
                  "genre": genre_text(data),
                  "description": game_description(data),
                  "safe_name": safe_name(
                      data.get("name") or title
                  )
              }

              judgement = score_parent_game(
                  data,
                  page_info,
                  external
              )

              game["judgement"] = judgement

              print(
                  f"  score={judgement['score']} "
                  f"accepted={judgement['accepted']}"
              )

              print(
                  f"  evidence={judgement['evidence']}"
              )

              if not judgement["accepted"]:
                  continue

              # 対応機種は最低限1つ必要
              if not game["platforms"]:
                  print("  SKIP: 対応機種不明")
                  continue

              # 実画像を取得
              urls = get_game_images(data)

              images = save_images(
                  game,
                  urls
              )

              print(
                  f"  images={len(images)}"
              )

              # 3枚未満なら動画化しない
              if len(images) < 3:
                  print("  SKIP: ゲーム画像不足")
                  continue

              game["images"] = images

              accepted_games.append(game)

              # 最初の1本だけ作る
              if accepted_games:
                  break

          # -----------------------------
          # 動画生成
          # -----------------------------

          if not accepted_games:
              print(
                  "動画生成なし："
                  "親子で遊ぶ価値と具体的根拠を満たすゲームが見つかりませんでした。"
              )

              Path(
                  OUT / "diagnostic.txt"
              ).write_text(
                  "採用ゲームなし\n"
                  "発売日は採用条件ではありません。\n"
                  "親子プレイ価値・具体的根拠・画像3枚以上・対応機種を確認しています。\n",
                  encoding="utf-8"
              )

              raise SystemExit(0)

          game = accepted_games[0]

          print("")
          print("================================")
          print("採用ゲーム")
          print(game["title"])
          print("score:", game["judgement"]["score"])
          print("evidence:", game["judgement"]["evidence"])
          print("strengths:", game["judgement"]["strengths"])
          print("platforms:", game["platforms"])
          print("release:", game["release"])
          print("================================")

          narrations = make_narrations(game)

          # シーン画像
          selected_images = game["images"][:4]

          while len(selected_images) < 4:
              selected_images.append(selected_images[-1])

          scene_images = []

          for i in range(4):
              scene_images.append(
                  make_scene_image(
                      selected_images[i],
                      game,
                      i,
                      narrations[i]
                  )
              )

          final_video = build_video(
              game,
              scene_images,
              narrations
          )

          # -----------------------------
          # 情報ファイル
          # -----------------------------

          source = {
              "title": game["title"],
              "score": game["judgement"]["score"],
              "evidence": game["judgement"]["evidence"],
              "strengths": game["judgement"]["strengths"],
              "penalties": game["judgement"]["penalties"],
              "platforms": game["platforms"],
              "release": game["release"],
              "genre": game["genre"],
              "description": game["description"],
              "steam_url": game["steam_url"],
              "news_url": game["news_url"],
              "narrations": narrations,
              "video_seconds": 30
          }

          (OUT / "source.json").write_text(
              json.dumps(
                  source,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # 動画時間チェック
          final_duration = duration(final_video)

          (OUT / "video_check.txt").write_text(
              f"duration={final_duration:.3f}\n"
              f"target=30.000\n"
              f"title={game['title']}\n"
              f"score={game['judgement']['score']}\n"
              f"evidence={' / '.join(game['judgement']['evidence'])}\n",
              encoding="utf-8"
          )

          print("")
          print("動画完成")
          print(final_video)
          print(f"duration={final_duration:.3f}")

          PY

      - name: Build video
        run: |
          python make_game_news.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-game-radar-${{ github.run_number }}
          path: |
            output/
            make_game_news.py
          if-no-files-found: warn
          retention-days: 7
