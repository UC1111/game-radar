name: Auto Game News TikTok

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3 python3-pip
          python3 -m pip install requests beautifulsoup4 pillow

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import os
          import re
          import sys
          import html
          import subprocess
          import requests
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont
          from bs4 import BeautifulSoup

          W = 1080
          H = 1920
          FPS = 30
          OUT = "output"

          os.makedirs(OUT, exist_ok=True)

          FONT_BOLD = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
          FONT_REG = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)"
          })

          def get(url, timeout=15):
              try:
                  r = session.get(
                      url,
                      timeout=timeout,
                      allow_redirects=True
                  )
                  r.raise_for_status()
                  return r
              except Exception as e:
                  print("GET失敗:", url, str(e)[:100])
                  return None

          def font(size, bold=False):
              path = FONT_BOLD if bold else FONT_REG
              return ImageFont.truetype(path, size)

          def wrap_text(text, max_chars=16):
              text = re.sub(r"\s+", " ", text).strip()

              if len(text) <= max_chars:
                  return text

              result = []

              while len(text) > max_chars:
                  cut = max_chars

                  for i in range(max_chars, max(0, max_chars - 7), -1):
                      if text[i - 1] in " 、。,.！？!?":
                          cut = i
                          break

                  result.append(text[:cut])
                  text = text[cut:]

              if text:
                  result.append(text)

              return "\n".join(result)

          def google_news():

              queries = [
                  "ゲーム 発売日 新作",
                  "ゲーム 発売決定 新作",
                  "PS5 新作 発売日 ゲーム",
                  "Switch2 新作 発売日 ゲーム",
                  "Steam 新作 発売日 ゲーム",
                  "ゲーム 2026年 発売",
                  "ゲーム 新情報 発売日"
              ]

              results = []
              seen = set()

              for q in queries:

                  url = (
                      "https://news.google.com/rss/search?q="
                      + requests.utils.quote(q + " when:3d")
                      + "&hl=ja&gl=JP&ceid=JP:ja"
                  )

                  r = get(url)

                  if not r:
                      continue

                  try:
                      root = ET.fromstring(r.content)
                  except Exception as e:
                      print("RSS解析失敗:", e)
                      continue

                  for item in root.findall(".//item"):

                      title = item.findtext("title") or ""
                      link = item.findtext("link") or ""
                      desc = item.findtext("description") or ""

                      title = html.unescape(title)
                      desc = html.unescape(desc)

                      key = title.strip()

                      if not key or key in seen:
                          continue

                      seen.add(key)

                      results.append({
                          "title": title,
                          "link": link,
                          "desc": desc
                      })

              print("取得ニュース数:", len(results))

              return results[:30]

          def article_data(item):

              r = get(item["link"], timeout=20)

              if not r:
                  return None

              try:
                  soup = BeautifulSoup(r.text, "html.parser")
              except Exception:
                  return None

              title = item["title"]

              if soup.title:
                  page_title = soup.title.get_text(" ", strip=True)

                  if page_title:
                      title = page_title

              description = ""

              meta = soup.find(
                  "meta",
                  attrs={"name": "description"}
              )

              if meta:
                  description = meta.get("content", "")

              image_url = None

              for attrs in [
                  {"property": "og:image"},
                  {"property": "og:image:url"},
                  {"name": "twitter:image"},
                  {"name": "twitter:image:src"}
              ]:

                  tag = soup.find("meta", attrs=attrs)

                  if tag and tag.get("content"):
                      image_url = html.unescape(tag["content"])
                      break

              paragraphs = []

              for p in soup.find_all("p")[:100]:

                  text = p.get_text(" ", strip=True)

                  if text:
                      paragraphs.append(text)

              body = " ".join(paragraphs)

              return {
                  "title": title,
                  "description": description,
                  "body": body,
                  "image_url": image_url,
                  "url": item["link"]
              }

          def find_release_date(text):

              patterns = [

                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日",

                  r"(20\d{2})[/-](\d{1,2})[/-](\d{1,2})",

                  r"(20\d{2})年\s*(\d{1,2})月",

                  r"(20\d{2})\.(\d{1,2})\.(\d{1,2})"

              ]

              for pattern in patterns:

                  m = re.search(pattern, text)

                  if not m:
                      continue

                  groups = m.groups()

                  try:

                      if len(groups) == 3:

                          y, mo, d = map(int, groups)

                          return f"{y}/{mo:02d}/{d:02d}"

                      if len(groups) == 2:

                          y, mo = map(int, groups)

                          return f"{y}/{mo:02d}"

                  except Exception:
                      pass

              return None

          def find_platforms(text):

              checks = [
                  ("PS5", r"\bPS5\b|PlayStation\s*5|プレイステーション5"),
                  ("PS4", r"\bPS4\b|PlayStation\s*4|プレイステーション4"),
                  ("Switch 2", r"Switch\s*2|Nintendo\s*Switch\s*2"),
                  ("Switch", r"Nintendo\s*Switch(?!\s*2)|ニンテンドースイッチ"),
                  ("Xbox Series X|S", r"Xbox\s*Series"),
                  ("Xbox One", r"Xbox\s*One"),
                  ("PC", r"\bPC\b|Steam|Windows"),
                  ("PS VR2", r"PS\s*VR2|PlayStation\s*VR2")
              ]

              result = []

              for name, pattern in checks:

                  if re.search(pattern, text, re.I):

                      if name not in result:
                          result.append(name)

              return result

          def download_image(url):

              if not url:
                  return None

              r = get(url, timeout=20)

              if not r:
                  return None

              try:

                  image = Image.open(
                      BytesIO(r.content)
                  ).convert("RGB")

                  if image.width < 200 or image.height < 200:
                      return None

                  return image

              except Exception as e:

                  print("画像解析失敗:", str(e)[:100])

                  return None

          def clean_game_name(title):

              title = re.sub(
                  r"\s*[-｜|]\s*[^-｜|]+$",
                  "",
                  title
              )

              title = re.sub(
                  r"【[^】]+】",
                  "",
                  title
              )

              title = re.sub(
                  r"\[[^\]]+\]",
                  "",
                  title
              )

              title = re.sub(
                  r"\s+",
                  " ",
                  title
              ).strip()

              remove_words = [
                  "発売決定",
                  "発売日決定",
                  "発売",
                  "新情報",
                  "最新情報",
                  "最新ニュース",
                  "正式発表",
                  "発表"
              ]

              for word in remove_words:
                  title = title.replace(word, "")

              title = title.strip()

              if len(title) > 45:
                  title = title[:45]

              return title

          def choose_news():

              candidates = google_news()

              if not candidates:
                  print("候補ニュースがありません。")
                  return None

              bad_words = [
                  "攻略",
                  "最強",
                  "コード",
                  "中古",
                  "セール",
                  "プレゼント",
                  "配布",
                  "レビュー",
                  "評価",
                  "ガチャ",
                  "ランキング"
              ]

              checked = 0

              for item in candidates:

                  checked += 1

                  print("")
                  print("==========")
                  print("候補", checked)
                  print(item["title"])

                  title_lower = item["title"].lower()

                  if any(word.lower() in title_lower for word in bad_words):
                      print("除外: ニュース種別")
                      continue

                  article = article_data(item)

                  if not article:
                      print("除外: 記事取得失敗")
                      continue

                  combined = " ".join([
                      item["title"],
                      item["desc"],
                      article["title"],
                      article["description"],
                      article["body"]
                  ])

                  release = find_release_date(combined)

                  if not release:
                      print("除外: 発売日なし")
                      continue

                  platforms = find_platforms(combined)

                  if not platforms:
                      print("除外: 対応機種なし")
                      continue

                  image = download_image(
                      article["image_url"]
                  )

                  if image is None:
                      print("除外: 画像なし")
                      continue

                  game = clean_game_name(
                      item["title"]
                  )

                  if len(game) < 2:
                      print("除外: ゲーム名不明")
                      continue

                  print("")
                  print("★★★★★ 採用 ★★★★★")
                  print("ゲーム:", game)
                  print("発売日:", release)
                  print("機種:", platforms)
                  print("画像:", article["image_url"])

                  return {
                      "game": game,
                      "headline": item["title"],
                      "release": release,
                      "platforms": platforms[:4],
                      "image": image,
                      "url": article["url"]
                  }

              print("")
              print("30件確認しましたが条件を満たすニュースなし。")

              return None

          def make_background(image):

              iw, ih = image.size

              scale = max(
                  W / iw,
                  H / ih
              )

              nw = int(iw * scale)
              nh = int(ih * scale)

              image = image.resize(
                  (nw, nh),
                  Image.Resampling.LANCZOS
              )

              left = max(
                  0,
                  (nw - W) // 2
              )

              top = max(
                  0,
                  (nh - H) // 2
              )

              image = image.crop(
                  (
                      left,
                      top,
                      left + W,
                      top + H
                  )
              )

              return image

          def center_text(draw, text, y, f, fill):

              box = draw.multiline_textbbox(
                  (0, 0),
                  text,
                  font=f,
                  align="center",
                  spacing=12,
                  stroke_width=4
              )

              tw = box[2] - box[0]

              draw.multiline_text(
                  (
                      (W - tw) / 2,
                      y
                  ),
                  text,
                  font=f,
                  fill=fill,
                  align="center",
                  spacing=12,
                  stroke_width=4,
                  stroke_fill=(0,0,0)
              )

          def scene(index, data):

              image = make_background(
                  data["image"]
              )

              draw = ImageDraw.Draw(image)

              if index == 0:

                  draw.rectangle(
                      (35, 80, W-35, 280),
                      fill=(0,0,0,190)
                  )

                  center_text(
                      draw,
                      "GAME NEWS",
                      105,
                      font(78, True),
                      (255,220,40)
                  )

                  center_text(
                      draw,
                      "これ、ちょっと気になる。",
                      350,
                      font(70, True),
                      (255,255,255)
                  )

                  center_text(
                      draw,
                      wrap_text(
                          data["game"],
                          15
                      ),
                      570,
                      font(86, True),
                      (255,255,255)
                  )

              elif index == 1:

                  draw.rectangle(
                      (35, 80, W-35, 550),
                      fill=(0,0,0,195)
                  )

                  center_text(
                      draw,
                      "新作ゲームニュース",
                      115,
                      font(65, True),
                      (255,220,40)
                  )

                  center_text(
                      draw,
                      wrap_text(
                          data["headline"],
                          16
                      ),
                      260,
                      font(66, True),
                      (255,255,255)
                  )

              elif index == 2:

                  draw.rectangle(
                      (35, 80, W-35, 820),
                      fill=(0,0,0,195)
                  )

                  center_text(
                      draw,
                      "対応機種",
                      120,
                      font(68, True),
                      (255,220,40)
                  )

                  center_text(
                      draw,
                      wrap_text(
                          " / ".join(
                              data["platforms"]
                          ),
                          17
                      ),
                      270,
                      font(70, True),
                      (255,255,255)
                  )

                  center_text(
                      draw,
                      "発売日",
                      520,
                      font(62, True),
                      (255,220,40)
                  )

                  center_text(
                      draw,
                      data["release"],
                      640,
                      font(88, True),
                      (255,255,255)
                  )

              elif index == 3:

                  draw.rectangle(
                      (35, 80, W-35, 920),
                      fill=(0,0,0,195)
                  )

                  center_text(
                      draw,
                      "15秒でここだけ確認",
                      125,
                      font(66, True),
                      (255,220,40)
                  )

                  center_text(
                      draw,
                      "✓ 新作ゲーム",
                      350,
                      font(68, True),
                      (255,255,255)
                  )

                  center_text(
                      draw,
                      "✓ 発売日",
                      510,
                      font(68, True),
                      (255,255,255)
                  )

                  center_text(
                      draw,
                      "✓ 対応機種",
                      670,
                      font(68, True),
                      (255,255,255)
                  )

              else:

                  draw.rectangle(
                      (35, 100, W-35, 800),
                      fill=(0,0,0,195)
                  )

                  center_text(
                      draw,
                      "発売日",
                      155,
                      font(60, True),
                      (255,220,40)
                  )

                  center_text(
                      draw,
                      data["release"],
                      270,
                      font(92, True),
                      (255,255,255)
                  )

                  center_text(
                      draw,
                      wrap_text(
                          " / ".join(
                              data["platforms"]
                          ),
                          18
                      ),
                      470,
                      font(58, True),
                      (255,255,255)
                  )

                  center_text(
                      draw,
                      "気になるなら保存",
                      760,
                      font(72, True),
                      (255,255,255)
                  )

              path = (
                  f"{OUT}/scene_{index}.png"
              )

              image.save(path)

              return path

          def make_video(data):

              scenes = []

              for i in range(5):
                  scenes.append(
                      scene(i, data)
                  )

              concat = (
                  f"{OUT}/concat.txt"
              )

              with open(
                  concat,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for p in scenes:
                      f.write(
                          "file '"
                          + os.path.abspath(p)
                          + "'\n"
                      )
                      f.write(
                          "duration 3\n"
                      )

                  f.write(
                      "file '"
                      + os.path.abspath(
                          scenes[-1]
                      )
                      + "'\n"
                  )

              output = (
                  f"{OUT}/game_news_tiktok.mp4"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  concat,
                  "-vf",
                  "scale=1080:1920,"
                  "fps=30",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "21",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  output
              ]

              print("")
              print("動画生成開始...")

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              if result.returncode != 0:
                  print(result.stdout)
                  raise RuntimeError(
                      "FFmpeg動画生成失敗"
                  )

              if not os.path.exists(output):
                  raise RuntimeError(
                      "MP4が生成されませんでした"
                  )

              size = os.path.getsize(
                  output
              )

              print("")
              print("====================")
              print("動画生成成功")
              print("ファイル:", output)
              print(
                  "サイズ:",
                  round(size / 1024 / 1024, 2),
                  "MB"
              )
              print("====================")

              return output

          def main():

              print("==============================")
              print("GAME NEWS RADAR START")
              print("==============================")

              data = choose_news()

              if data is None:

                  print("")
                  print(
                      "条件を満たすニュースがありません。"
                  )
                  print(
                      "動画は生成しません。"
                  )

                  sys.exit(0)

              output = make_video(data)

              with open(
                  f"{OUT}/source.txt",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      "GAME NEWS RADAR\n"
                  )

                  f.write(
                      "====================\n"
                  )

                  f.write(
                      f"ゲーム: {data['game']}\n"
                  )

                  f.write(
                      f"発売日: {data['release']}\n"
                  )

                  f.write(
                      "対応機種: "
                      + ", ".join(
                          data["platforms"]
                      )
                      + "\n"
                  )

                  f.write(
                      f"ニュース: {data['headline']}\n"
                  )

                  f.write(
                      f"URL: {data['url']}\n"
                  )

              print("")
              print("完成しました。")
              print(output)

          if __name__ == "__main__":
              main()
          PY

          python3 make_game_news.py

      - name: Check output
        run: |
          echo "===== OUTPUT ====="
          ls -lah output || true
          echo "=================="

      - name: Upload completed video
        if: success() && hashFiles('output/game_news_tiktok.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: game-news-tiktok-${{ github.run_number }}
          path: |
            output/game_news_tiktok.mp4
            output/source.txt
          retention-days: 7
          if-no-files-found: error
