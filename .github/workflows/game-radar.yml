name: Parent Game Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow feedparser

      # ============================================================
      # VOICEVOX
      # ============================================================

      - name: Start VOICEVOX
        run: |
          docker run -d \
            --name voicevox \
            -p 50021:50021 \
            voicevox/voicevox_engine:cpu-latest

          echo "Waiting for VOICEVOX..."

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX READY"
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:50021/version

      # ============================================================
      # GENERATOR
      # ============================================================

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import io
          import json
          import math
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # ==========================================================
          # CONFIG
          # ==========================================================

          OUT = Path("output")
          IMG = OUT / "images"
          SCENES = OUT / "scenes"
          AUDIO = OUT / "audio"

          OUT.mkdir(exist_ok=True)
          IMG.mkdir(exist_ok=True)
          SCENES.mkdir(exist_ok=True)
          AUDIO.mkdir(exist_ok=True)

          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/130 Safari/537.36"
          )

          session = requests.Session()
          session.headers.update({"User-Agent": UA})

          W = 1080
          H = 1920

          # TikTok UI回避領域
          SAFE_LEFT = 90
          SAFE_RIGHT = 900
          SAFE_TOP = 170
          SAFE_BOTTOM = 1450

          SPEAKER = 3

          # ==========================================================
          # HELPERS
          # ==========================================================

          def get(url, timeout=15, **kwargs):
              try:
                  r = session.get(
                      url,
                      timeout=timeout,
                      **kwargs
                  )
                  if r.ok:
                      return r
              except Exception as e:
                  print("GET ERROR:", e)
              return None


          def clean_text(text):
              text = BeautifulSoup(
                  text or "",
                  "html.parser"
              ).get_text(" ", strip=True)

              text = re.sub(r"\s+", " ", text)
              return text.strip()


          # ==========================================================
          # 1. NEWS
          # ==========================================================

          QUERIES = [
              "親子 ゲーム 新作",
              "家族 ゲーム 新作",
              "親子で遊べる ゲーム",
              "家族で遊べる ゲーム",
              "2人協力 ゲーム 新作",
              "協力プレイ ゲーム 新作",
              "Switch 親子 ゲーム",
              "Switch 2 親子 ゲーム",
              "ファミリーゲーム 新作",
              "子ども ゲーム 新作",
          ]


          def rss_url(q):
              return (
                  "https://news.google.com/rss/search?q="
                  + quote(q)
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )


          articles = []
          seen_urls = set()

          for q in QUERIES:
              try:
                  feed = feedparser.parse(rss_url(q))

                  for e in feed.entries:
                      link = e.get("link", "")
                      title = clean_text(e.get("title", ""))

                      if not link or not title:
                          continue

                      if link in seen_urls:
                          continue

                      seen_urls.add(link)

                      summary = clean_text(
                          e.get("summary", "")
                      )

                      articles.append({
                          "title": title,
                          "summary": summary,
                          "link": link,
                          "published": e.get(
                              "published",
                              ""
                          )
                      })

              except Exception as e:
                  print("RSS ERROR:", e)


          print("NEWS COUNT:", len(articles))


          # ==========================================================
          # 2. GAME TITLE
          # ==========================================================

          def extract_game_title(text):

              patterns = [
                  r"『([^』]{2,80})』",
                  r"「([^」]{2,80})」",
                  r'"([^"]{2,80})"',
              ]

              for p in patterns:
                  m = re.search(p, text)

                  if m:
                      value = m.group(1).strip()

                      bad_words = [
                          "発売日",
                          "対応機種",
                          "予約受付",
                          "イベント",
                          "キャンペーン",
                          "最新情報"
                      ]

                      if not any(
                          x in value
                          for x in bad_words
                      ):
                          return value

              text = re.sub(
                  r"【[^】]+】",
                  "",
                  text
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              # ニュースタイトルから明らかな媒体名等を除去
              text = re.sub(
                  r"発売決定.*$",
                  "",
                  text
              )

              text = re.sub(
                  r"発売.*$",
                  "",
                  text
              )

              text = re.sub(
                  r"最新情報.*$",
                  "",
                  text
              )

              return text[:55].strip(
                  " -｜|:："
              )


          # ==========================================================
          # 3. RELEASE DATE
          # ==========================================================

          def extract_release(text):

              patterns = [
                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日",
                  r"(20\d{2})[./-](\d{1,2})[./-](\d{1,2})",
                  r"(\d{1,2})月\s*(\d{1,2})日",
              ]

              for p in patterns:

                  m = re.search(p, text)

                  if not m:
                      continue

                  if len(m.groups()) == 3:

                      if len(m.group(1)) == 4:
                          return (
                              f"{m.group(1)}年"
                              f"{int(m.group(2))}月"
                              f"{int(m.group(3))}日"
                          )

                      return (
                          f"{int(m.group(1))}月"
                          f"{int(m.group(2))}日"
                      )

              if re.search(
                  r"本日|発売中|配信中|発売開始|配信開始",
                  text
              ):
                  return "発売・配信中"

              return "発売日未定"


          # ==========================================================
          # 4. PLATFORM
          # ==========================================================

          def extract_platforms(text):

              rules = [
                  ("Switch 2", r"Nintendo Switch 2|Switch\s*2"),
                  (
                      "Switch",
                      r"Nintendo Switch(?!\s*2)|Switch"
                  ),
                  ("PS5", r"PS5|PlayStation\s*5"),
                  ("PS4", r"PS4|PlayStation\s*4"),
                  ("Xbox", r"Xbox"),
                  ("PC", r"Steam|PC版|Windows"),
                  (
                      "スマホ",
                      r"iOS|Android|App Store|Google Play"
                  ),
              ]

              result = []

              for name, pattern in rules:
                  if re.search(
                      pattern,
                      text,
                      re.I
                  ):
                      if name not in result:
                          result.append(name)

              return result[:4]


          # ==========================================================
          # 5. FAMILY EVIDENCE
          # ==========================================================

          POSITIVE = {
              "親子": 10,
              "家族": 8,
              "ファミリー": 8,
              "子ども": 7,
              "こども": 7,
              "キッズ": 7,
              "協力プレイ": 8,
              "協力": 5,
              "ローカルマルチ": 9,
              "ローカル": 5,
              "2人プレイ": 8,
              "2人": 5,
              "3人": 5,
              "4人": 6,
              "マルチプレイ": 5,
              "パーティー": 6,
              "パーティ": 6,
              "知育": 8,
              "教育": 7,
              "学習": 7,
              "簡単操作": 5,
              "初心者": 4,
              "カジュアル": 3,
              "Minecraft": 7,
              "マインクラフト": 7,
              "マリオ": 7,
              "カービィ": 7,
              "ポケモン": 6,
              "どうぶつの森": 8,
              "桃太郎電鉄": 8,
              "桃鉄": 8,
              "レゴ": 5,
              "料理": 3,
              "スポーツ": 4,
              "レース": 4,
          }

          NEGATIVE = {
              "R18": -20,
              "18禁": -20,
              "成人向け": -20,
              "アダルト": -20,
              "性的": -20,
              "エロ": -20,
              "グロ": -20,
              "ゴア": -20,
              "残虐": -15,
              "残酷": -15,
              "サバイバルホラー": -15,
              "ホラー": -10,
          }


          def score_family(text):

              score = 0
              positive_hits = []
              negative_hits = []

              low = text.lower()

              for key, value in POSITIVE.items():
                  if key.lower() in low:
                      score += value
                      positive_hits.append(key)

              for key, value in NEGATIVE.items():
                  if key.lower() in low:
                      score += value
                      negative_hits.append(key)

              return (
                  score,
                  list(dict.fromkeys(positive_hits)),
                  list(dict.fromkeys(negative_hits))
              )


          # ==========================================================
          # 6. STEAM INFORMATION
          # ==========================================================

          def steam_info(game):

              result = {
                  "description": "",
                  "screenshots": [],
                  "platforms": [],
                  "players": ""
              }

              try:
                  r = session.get(
                      "https://store.steampowered.com/api/storesearch/",
                      params={
                          "term": game,
                          "l": "japanese",
                          "cc": "jp"
                      },
                      timeout=12
                  )

                  data = r.json()
                  items = data.get(
                      "items",
                      []
                  )

                  if not items:
                      return result

                  appid = items[0].get("id")

                  if not appid:
                      return result

                  r2 = session.get(
                      "https://store.steampowered.com/api/appdetails",
                      params={
                          "appids": appid,
                          "l": "japanese"
                      },
                      timeout=12
                  )

                  data2 = r2.json()

                  app = data2.get(
                      str(appid),
                      {}
                  ).get(
                      "data",
                      {}
                  )

                  result["description"] = clean_text(
                      app.get("short_description", "")
                  )

                  for s in app.get(
                      "screenshots",
                      []
                  ):
                      u = s.get("path_full")

                      if u:
                          result["screenshots"].append(u)

                  cats = app.get(
                      "categories",
                      []
                  )

                  cat_text = " ".join(
                      str(x)
                      for x in cats
                  )

                  if "Co-op" in cat_text:
                      result["players"] = "協力プレイ"

                  return result

              except Exception as e:
                  print(
                      "STEAM ERROR:",
                      game,
                      e
                  )

              return result


          # ==========================================================
          # 7. BING IMAGE SEARCH
          # ==========================================================

          def bing_images(game):

              queries = [
                  game + " gameplay screenshot",
                  game + " ゲーム画面",
                  game + " gameplay",
              ]

              results = []

              for q in queries:

                  url = (
                      "https://www.bing.com/images/search?q="
                      + quote(q)
                  )

                  r = get(url)

                  if not r:
                      continue

                  soup = BeautifulSoup(
                      r.text,
                      "html.parser"
                  )

                  for a in soup.select(
                      "a.iusc"
                  ):

                      try:
                          data = json.loads(
                              a.get(
                                  "m",
                                  "{}"
                              )
                          )

                          u = data.get(
                              "turl",
                              ""
                          )

                          if u.startswith(
                              "http"
                          ):
                              results.append(u)

                      except Exception:
                          pass

              return list(
                  dict.fromkeys(results)
              )[:50]


          # ==========================================================
          # 8. ARTICLE IMAGES
          # ==========================================================

          def article_images(url):

              r = get(url)

              if not r:
                  return []

              soup = BeautifulSoup(
                  r.text,
                  "html.parser"
              )

              results = []

              for tag in soup.find_all(
                  ["meta", "img"]
              ):

                  u = ""

                  if tag.name == "meta":

                      prop = tag.get(
                          "property",
                          ""
                      )

                      if prop in [
                          "og:image",
                          "twitter:image"
                      ]:
                          u = tag.get(
                              "content",
                              ""
                          )

                  else:
                      u = (
                          tag.get("src")
                          or tag.get("data-src")
                          or ""
                      )

                  if u.startswith("//"):
                      u = "https:" + u

                  if u.startswith("http"):
                      results.append(u)

              return list(
                  dict.fromkeys(results)
              )[:30]


          # ==========================================================
          # 9. IMAGE VALIDATION
          # ==========================================================

          def image_quality(path):

              try:

                  im = Image.open(
                      path
                  ).convert("RGB")

                  w, h = im.size

                  if w < 600 or h < 350:
                      return False

                  ratio = w / h

                  if ratio < 0.45 or ratio > 3.5:
                      return False

                  small = im.resize(
                      (32, 32)
                  )

                  pixels = list(
                      small.getdata()
                  )

                  brightness = (
                      sum(
                          sum(p) / 3
                          for p in pixels
                      )
                      / len(pixels)
                  )

                  if brightness < 8:
                      return False

                  if brightness > 250:
                      return False

                  # ほぼ同一画像の判定用簡易ハッシュ
                  gray = im.resize(
                      (16, 16)
                  ).convert("L")

                  values = list(
                      gray.getdata()
                  )

                  avg = sum(values) / len(values)

                  bits = "".join(
                      "1" if x > avg else "0"
                      for x in values
                  )

                  return bits

              except Exception:
                  return False


          def image_similar(hash1, hash2):

              if not hash1 or not hash2:
                  return False

              same = sum(
                  a == b
                  for a, b in zip(
                      hash1,
                      hash2
                  )
              )

              return same / len(hash1) > 0.93


          def download_image(
              url,
              path,
              known_hashes
          ):

              try:

                  r = session.get(
                      url,
                      timeout=15
                  )

                  if not r.ok:
                      return False

                  if len(r.content) < 15000:
                      return False

                  im = Image.open(
                      io.BytesIO(
                          r.content
                      )
                  ).convert("RGB")

                  path.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  im.save(
                      path,
                      "JPEG",
                      quality=92
                  )

                  h = image_quality(
                      path
                  )

                  if not h:
                      path.unlink(
                          missing_ok=True
                      )
                      return False

                  for old in known_hashes:

                      if image_similar(
                          h,
                          old
                      ):
                          path.unlink(
                              missing_ok=True
                          )
                          return False

                  known_hashes.append(h)

                  return True

              except Exception:
                  path.unlink(
                      missing_ok=True
                  )
                  return False


          # ==========================================================
          # 10. SELECT GAME
          # ==========================================================

          selected = None

          candidates = []

          for article in articles[:120]:

              combined = (
                  article["title"]
                  + " "
                  + article["summary"]
              )

              score, hits, neg_hits = score_family(
                  combined
              )

              if neg_hits:
                  continue

              if score < 8:
                  continue

              game = extract_game_title(
                  article["title"]
              )

              if len(game) < 2:
                  continue

              candidates.append({
                  "score": score,
                  "hits": hits,
                  "game": game,
                  "article": article,
                  "release": extract_release(
                      combined
                  ),
                  "platforms": extract_platforms(
                      combined
                  )
              })


          candidates.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          print(
              "FAMILY CANDIDATES:",
              len(candidates)
          )


          # ==========================================================
          # 11. VERIFY FAMILY GAME + GET IMAGES
          # ==========================================================

          for candidate in candidates[:25]:

              game = candidate["game"]

              print(
                  "CHECKING GAME:",
                  game
              )

              steam = steam_info(
                  game
              )

              evidence_text = (
                  candidate["article"]["title"]
                  + " "
                  + candidate["article"]["summary"]
                  + " "
                  + steam["description"]
                  + " "
                  + steam["players"]
              )

              verify_score, verify_hits, verify_neg = score_family(
                  evidence_text
              )

              if verify_neg:
                  continue

              # 実際のゲームプレイ・協力等の根拠が最低2つ
              evidence_count = len(
                  set(verify_hits)
              )

              if evidence_count < 2:
                  print(
                      "REJECT: weak family evidence",
                      verify_hits
                  )
                  continue

              urls = []

              # Steamスクリーンショットを最優先
              urls += steam["screenshots"]

              # Bing gameplay検索
              urls += bing_images(
                  game
              )

              # 記事画像
              urls += article_images(
                  candidate["article"]["link"]
              )

              urls = list(
                  dict.fromkeys(urls)
              )

              game_dir = IMG / re.sub(
                  r"[^a-zA-Z0-9_-]+",
                  "_",
                  game
              )[:50]

              game_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              usable = []
              hashes = []

              for idx, url in enumerate(
                  urls[:60]
              ):

                  path = (
                      game_dir
                      / f"game_{idx}.jpg"
                  )

                  if download_image(
                      url,
                      path,
                      hashes
                  ):

                      usable.append(path)

                      print(
                          "IMAGE OK:",
                          path
                      )

                  if len(usable) >= 5:
                      break

              if len(usable) < 3:
                  print(
                      "REJECT: less than 3 usable images"
                  )
                  continue

              # 最終採用
              candidate["images"] = usable
              candidate["evidence"] = (
                  verify_hits
              )
              candidate["score"] += verify_score

              # Steamから取れた情報を補完
              if steam["players"]:
                  candidate["players"] = (
                      steam["players"]
                  )
              else:
                  candidate["players"] = ""

              selected = candidate
              break


          if not selected:

              print(
                  "NO VIDEO: "
                  "親子で遊べる根拠と画像が揃うゲームなし"
              )

              raise SystemExit(0)


          # ==========================================================
          # 12. DATA
          # ==========================================================

          game = selected["game"]
          release = selected["release"]
          platforms = selected["platforms"]

          if not platforms:
              platforms = ["対応機種は記事で確認"]


          evidence = selected.get(
              "evidence",
              []
          )


          # ==========================================================
          # 13. DETERMINE FEATURES
          # ==========================================================

          if any(
              x in evidence
              for x in [
                  "協力プレイ",
                  "協力",
                  "ローカルマルチ",
                  "2人プレイ",
                  "2人"
              ]
          ):

              play_text = (
                  "親子で一緒に遊びやすい作品"
              )

              feature_text = (
                  "2人・協力プレイを楽しめる"
              )

          elif any(
              x in evidence
              for x in [
                  "家族",
                  "ファミリー",
                  "パーティー",
                  "パーティ"
              ]
          ):

              play_text = (
                  "家族みんなで遊びやすい作品"
              )

              feature_text = (
                  "家族でワイワイ楽しみやすい"
              )

          elif any(
              x in evidence
              for x in [
                  "知育",
                  "教育",
                  "学習"
              ]
          ):

              play_text = (
                  "親子で遊びながら楽しめる作品"
              )

              feature_text = (
                  "遊びながら考える要素も"
              )

          else:

              play_text = (
                  "子どもと一緒に遊びやすい作品"
              )

              feature_text = (
                  "親子で楽しみやすいゲーム"
              )


          # ==========================================================
          # 14. CLEAN NARRATION
          # ==========================================================

          # 意図的に短くして、重複しにくい文章にする
          scene1 = (
              f"親子で遊ぶゲームを探しているなら、"
              f"{game}をチェック。"
          )

          scene2 = (
              f"{play_text}で、"
              f"{feature_text}のがポイントです。"
          )

          platform_text = "、".join(
              platforms[:3]
          )

          scene3 = (
              f"発売日は{release}。"
              f"対応機種は{platform_text}。"
              f"週末の親子ゲーム候補に保存しておこう。"
          )


          narrations = [
              scene1,
              scene2,
              scene3
          ]


          # ==========================================================
          # 15. TEXT CLEANUP
          # ==========================================================

          def remove_repetition(text):

              # 同一単語の連続
              text = re.sub(
                  r"([^、。！？\s]{2,12})\1+",
                  r"\1",
                  text
              )

              # 「○○、○○」のような完全重複
              parts = re.split(
                  r"([、。！？])",
                  text
              )

              cleaned = []
              previous = ""

              for part in parts:

                  normalized = part.strip()

                  if (
                      normalized
                      and normalized == previous
                  ):
                      continue

                  cleaned.append(part)

                  if normalized:
                      previous = normalized

              text = "".join(
                  cleaned
              )

              # 句読点の重複
              text = re.sub(
                  r"([、。！？])\1+",
                  r"\1",
                  text
              )

              return text.strip()


          narrations = [
              remove_repetition(x)
              for x in narrations
          ]


          # ==========================================================
          # 16. SAVE SCRIPT
          # ==========================================================

          (OUT / "script.txt").write_text(
              "\n".join(
                  [
                      f"[SCENE 1] {narrations[0]}",
                      f"[SCENE 2] {narrations[1]}",
                      f"[SCENE 3] {narrations[2]}",
                  ]
              ),
              encoding="utf-8"
          )


          (OUT / "source.txt").write_text(
              "\n".join(
                  [
                      f"game={game}",
                      f"family_score={selected['score']}",
                      f"evidence={','.join(evidence)}",
                      f"release={release}",
                      f"platforms={','.join(platforms)}",
                      f"source={selected['article']['link']}",
                      f"title={selected['article']['title']}",
                  ]
              ),
              encoding="utf-8"
          )


          # ==========================================================
          # 17. VOICEVOX
          # ==========================================================

          VOICEVOX = (
              "http://127.0.0.1:50021"
          )


          def make_voice(text, out):

              q = session.post(
                  VOICEVOX
                  + "/audio_query",
                  params={
                      "text": text,
                      "speaker": SPEAKER
                  },
                  timeout=40
              )

              q.raise_for_status()

              query = q.json()

              # 少しだけテンポを上げる
              query["speedScale"] = 1.06
              query["intonationScale"] = 1.08

              r = session.post(
                  VOICEVOX
                  + "/synthesis",
                  params={
                      "speaker": SPEAKER
                  },
                  json=query,
                  timeout=80
              )

              r.raise_for_status()

              out.write_bytes(
                  r.content
              )


          voice_files = []

          for i, text in enumerate(
              narrations,
              1
          ):

              path = (
                  AUDIO
                  / f"voice{i}.wav"
              )

              make_voice(
                  text,
                  path
              )

              voice_files.append(
                  path
              )


          # ==========================================================
          # 18. NORMALIZE EACH VOICE TO 4.65 SEC
          # ==========================================================

          TARGET_SPEECH = 4.65


          def make_voice_segment(
              src,
              dst
          ):

              # 音声の実時間を取得
              probe = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:"
                      "nokey=1",
                      str(src)
                  ],
                  capture_output=True,
                  text=True
              )

              try:
                  duration = float(
                      probe.stdout.strip()
                  )
              except Exception:
                  duration = 4.0

              filters = []

              # 長すぎる場合だけ速度調整
              if duration > TARGET_SPEECH:

                  factor = (
                      duration
                      / TARGET_SPEECH
                  )

                  # atempoは0.5〜2.0
                  factor = min(
                      max(
                          factor,
                          0.5
                      ),
                      2.0
                  )

                  filters.append(
                      f"atempo={factor:.5f}"
                  )

              filters.append(
                  "apad"
              )

              filters.append(
                  f"atrim=0:{TARGET_SPEECH}"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(src),
                      "-af",
                      ",".join(filters),
                      "-ar",
                      "44100",
                      "-ac",
                      "2",
                      str(dst)
                  ],
                  check=True
              )


          voice_segments = []

          for i, src in enumerate(
              voice_files,
              1
          ):

              dst = (
                  AUDIO
                  / f"segment{i}.wav"
              )

              make_voice_segment(
                  src,
                  dst
              )

              voice_segments.append(
                  dst
              )


          # ==========================================================
          # 19. BUILD EXACT 15 SEC VOICE TRACK
          # ==========================================================

          # 4.65 x 3 = 13.95秒
          # 残り1.05秒はシーン間の短い間として使用
          #
          # 4.65秒 voice
          # 0.35秒 silence
          # 4.65秒 voice
          # 0.35秒 silence
          # 4.65秒 voice
          # 0.35秒 end
          #
          # 合計15.0秒

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  "anullsrc=r=44100:cl=stereo",
                  "-t",
                  "0.35",
                  str(
                      AUDIO
                      / "silence.wav"
                  )
              ],
              check=True
          )


          silence = (
              AUDIO
              / "silence.wav"
          )


          voice_concat = (
              AUDIO
              / "voice_concat.txt"
          )


          voice_concat.write_text(
              "\n".join(
                  [
                      f"file '{voice_segments[0].resolve()}'",
                      f"file '{silence.resolve()}'",
                      f"file '{voice_segments[1].resolve()}'",
                      f"file '{silence.resolve()}'",
                      f"file '{voice_segments[2].resolve()}'",
                      f"file '{silence.resolve()}'",
                  ]
              ),
              encoding="utf-8"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(voice_concat),
                  "-t",
                  "15",
                  "-ar",
                  "44100",
                  "-ac",
                  "2",
                  str(
                      AUDIO
                      / "voice_all.wav"
                  )
              ],
              check=True
          )


          # ==========================================================
          # 20. ORIGINAL BGM
          # ==========================================================

          bgm = (
              AUDIO
              / "bgm.wav"
          )


          # ゲーム動画向けの簡単なオリジナルBGM
          subprocess.run(
              [
                  "ffmpeg",
                  "-y",

                  "-f",
                  "lavfi",
                  "-i",
                  "sine=frequency=110:"
                  "duration=15:"
                  "sample_rate=44100",

                  "-f",
                  "lavfi",
                  "-i",
                  "sine=frequency=165:"
                  "duration=15:"
                  "sample_rate=44100",

                  "-f",
                  "lavfi",
                  "-i",
                  "sine=frequency=220:"
                  "duration=15:"
                  "sample_rate=44100",

                  "-filter_complex",
                  (
                      "[0:a]volume=0.035[a];"
                      "[1:a]volume=0.025[b];"
                      "[2:a]volume=0.018[c];"
                      "[a][b][c]"
                      "amix=inputs=3:duration=longest,"
                      "afade=t=in:st=0:d=1,"
                      "afade=t=out:st=13.5:d=1.5"
                  ),

                  "-ar",
                  "44100",
                  "-ac",
                  "2",

                  str(bgm)
              ],
              check=True
          )


          # ==========================================================
          # 21. FONTS
          # ==========================================================

          FONT_BOLD = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
          )

          FONT_REG = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Regular.ttc"
          )


          def font(size, bold=True):

              return ImageFont.truetype(
                  FONT_BOLD
                  if bold
                  else FONT_REG,
                  size
              )


          # ==========================================================
          # 22. IMAGE PROCESSING
          # ==========================================================

          def cover(im, target_w, target_h):

              iw, ih = im.size

              scale = max(
                  target_w / iw,
                  target_h / ih
              )

              nw = int(
                  iw * scale
              )

              nh = int(
                  ih * scale
              )

              im = im.resize(
                  (nw, nh),
                  Image.Resampling.LANCZOS
              )

              left = (
                  nw - target_w
              ) // 2

              top = (
                  nh - target_h
              ) // 2

              return im.crop(
                  (
                      left,
                      top,
                      left + target_w,
                      top + target_h
                  )
              )


          # ==========================================================
          # 23. SCENE DESIGN
          # ==========================================================

          scene_titles = [
              "親子で遊ぶなら？",
              "ここがポイント",
              "週末ゲーム候補"
          ]

          scene_badges = [
              "PARENT GAME",
              "CHECK",
              "SAVE"
          ]


          def make_scene(
              image_path,
              index
          ):

              original = Image.open(
                  image_path
              ).convert("RGB")

              # 背景
              background = cover(
                  original,
                  W,
                  H
              )

              background = background.filter(
                  ImageFilter.GaussianBlur(
                      24
                  )
              )

              canvas = background.copy()

              # メイン画像
              main = cover(
                  original,
                  W,
                  1180
              )

              # 少し暗くする
              overlay = Image.new(
                  "RGBA",
                  main.size,
                  (0, 0, 0, 0)
              )

              od = ImageDraw.Draw(
                  overlay
              )

              od.rectangle(
                  (
                      0,
                      0,
                      main.width,
                      main.height
                  ),
                  fill=(0, 0, 0, 25)
              )

              main = Image.alpha_composite(
                  main.convert("RGBA"),
                  overlay
              ).convert("RGB")

              canvas.paste(
                  main,
                  (
                      0,
                      360
                  )
              )

              draw = ImageDraw.Draw(
                  canvas,
                  "RGBA"
              )

              # 上部を暗く
              draw.rectangle(
                  (
                      0,
                      0,
                      W,
                      360
                  ),
                  fill=(0, 0, 0, 145)
              )

              # 下部を暗く
              draw.rectangle(
                  (
                      0,
                      1540,
                      W,
                      H
                  ),
                  fill=(0, 0, 0, 150)
              )

              # バッジ
              draw.rounded_rectangle(
                  (
                      60,
                      65,
                      370,
                      135
                  ),
                  radius=22,
                  fill=(255, 255, 255, 235)
              )

              draw.text(
                  (
                      88,
                      80
                  ),
                  scene_badges[index],
                  font=font(27),
                  fill=(20, 20, 20, 255)
              )

              # ゲームタイトル
              title = game[:22]

              draw.text(
                  (
                      60,
                      180
                  ),
                  title,
                  font=font(58),
                  fill=(255, 255, 255, 255),
                  stroke_width=2,
                  stroke_fill=(0, 0, 0, 180)
              )

              # 見出し
              draw.text(
                  (
                      60,
                      265
                  ),
                  scene_titles[index],
                  font=font(43),
                  fill=(255, 235, 70, 255)
              )

              # シーン別情報
              if index == 0:

                  label = (
                      "👨‍👩‍👧 親子適性"
                  )

                  value = "★★★★★"

              elif index == 1:

                  label = (
                      "🎮 遊び方"
                  )

                  if any(
                      x in evidence
                      for x in [
                          "協力プレイ",
                          "協力",
                          "2人プレイ",
                          "ローカルマルチ"
                      ]
                  ):
                      value = "一緒に遊べる"

                  else:
                      value = "家族向け"

              else:

                  label = (
                      "🎮 対応機種"
                  )

                  value = " / ".join(
                      platforms[:3]
                  )

              # 情報カード
              draw.rounded_rectangle(
                  (
                      55,
                      1420,
                      1025,
                      1510
                  ),
                  radius=25,
                  fill=(0, 0, 0, 185)
              )

              draw.text(
                  (
                      85,
                      1440
                  ),
                  label,
                  font=font(30),
                  fill=(255, 255, 255, 255)
              )

              draw.text(
                  (
                      400,
                      1435
                  ),
                  value,
                  font=font(37),
                  fill=(255, 235, 70, 255)
              )

              # ナレーション字幕
              text = narrations[index]

              # 1行最大約18文字
              lines = []

              current = ""

              for ch in text:

                  current += ch

                  if len(current) >= 18:

                      lines.append(
                          current
                      )
                      current = ""

              if current:
                  lines.append(
                      current
                  )

              # 最大3行
              lines = lines[:3]

              y = 1585

              for line in lines:

                  bbox = draw.textbbox(
                      (
                          0,
                          0
                      ),
                      line,
                      font=font(45)
                  )

                  tw = (
                      bbox[2]
                      - bbox[0]
                  )

                  # TikTokの左下・右下UIを避ける
                  x = max(
                      SAFE_LEFT,
                      min(
                          (W - tw) // 2,
                          SAFE_RIGHT - tw
                      )
                  )

                  # 縁取り
                  draw.text(
                      (
                          x + 4,
                          y + 4
                      ),
                      line,
                      font=font(45),
                      fill=(0, 0, 0, 240)
                  )

                  draw.text(
                      (
                          x,
                          y
                      ),
                      line,
                      font=font(45),
                      fill=(255, 255, 255, 255)
                  )

                  y += 62

              # 上部右側に発売日
              release_text = (
                  f"発売 {release}"
              )

              bbox = draw.textbbox(
                  (
                      0,
                      0
                  ),
                  release_text,
                  font=font(28)
              )

              rw = (
                  bbox[2]
                  - bbox[0]
              )

              draw.rounded_rectangle(
                  (
                      W - rw - 90,
                      65,
                      W - 60,
                      125
                  ),
                  radius=18,
                  fill=(0, 0, 0, 165)
              )

              draw.text(
                  (
                      W - rw - 75,
                      78
                  ),
                  release_text,
                  font=font(28),
                  fill=(255, 255, 255, 255)
              )

              # プログレス
              px0 = 70
              px1 = 1010
              py = 1850

              draw.rounded_rectangle(
                  (
                      px0,
                      py,
                      px1,
                      py + 10
                  ),
                  radius=5,
                  fill=(255, 255, 255, 90)
              )

              segment = (
                  px1 - px0
              ) / 3

              draw.rounded_rectangle(
                  (
                      px0 + index * segment,
                      py,
                      px0 + (index + 1) * segment,
                      py + 10
                  ),
                  radius=5,
                  fill=(255, 235, 70, 255)
              )

              path = (
                  SCENES
                  / f"scene{index + 1}.png"
              )

              canvas.save(
                  path,
                  quality=95
              )

              return path


          scene_paths = []

          for i, image in enumerate(
              selected["images"][:3]
          ):

              scene_paths.append(
                  make_scene(
                      image,
                      i
                  )
              )


          # ==========================================================
          # 24. CREATE VIDEO WITH MOTION
          # ==========================================================

          # 静止画を単純に並べず、
          # ゆっくりズーム + 横移動
          # 3シーン x 5秒 = 15秒

          scene_videos = []

          for i, scene in enumerate(
              scene_paths
          ):

              video_path = (
                  OUT
                  / f"scene_video_{i+1}.mp4"
              )

              if i == 0:
                  zoom = (
                      "zoompan="
                      "z='min(zoom+0.0008,1.08)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=1:"
                      "s=1080x1920:"
                      "fps=30"
                  )

              elif i == 1:
                  zoom = (
                      "zoompan="
                      "z='min(zoom+0.001,1.10)':"
                      "x='iw/2-(iw/zoom/2)+"
                      "(iw/zoom)*0.035':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=1:"
                      "s=1080x1920:"
                      "fps=30"
                  )

              else:
                  zoom = (
                      "zoompan="
                      "z='min(zoom+0.0007,1.07)':"
                      "x='iw/2-(iw/zoom/2)-"
                      "(iw/zoom)*0.03':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=1:"
                      "s=1080x1920:"
                      "fps=30"
                  )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-loop",
                      "1",
                      "-i",
                      str(scene),
                      "-vf",
                      zoom,
                      "-t",
                      "5",
                      "-r",
                      "30",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "20",
                      "-pix_fmt",
                      "yuv420p",
                      str(video_path)
                  ],
                  check=True
              )

              scene_videos.append(
                  video_path
              )


          # ==========================================================
          # 25. CONCAT VIDEO
          # ==========================================================

          video_list = (
              OUT
              / "video_list.txt"
          )

          video_list.write_text(
              "\n".join(
                  f"file '{x.resolve()}'"
                  for x in scene_videos
              ),
              encoding="utf-8"
          )


          visual = (
              OUT
              / "visual.mp4"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(video_list),
                  "-t",
                  "15",
                  "-c",
                  "copy",
                  str(visual)
              ],
              check=True
          )


          # ==========================================================
          # 26. FINAL MIX
          # ==========================================================

          final = (
              OUT
              / "parent_game_radar.mp4"
          )


          subprocess.run(
              [
                  "ffmpeg",
                  "-y",

                  "-i",
                  str(visual),

                  "-i",
                  str(
                      AUDIO
                      / "voice_all.wav"
                  ),

                  "-i",
                  str(bgm),

                  "-filter_complex",
                  (
                      "[1:a]volume=1.0[narr];"
                      "[2:a]volume=0.10[music];"
                      "[narr][music]"
                      "amix=inputs=2:"
                      "duration=longest:"
                      "dropout_transition=0,"
                      "atrim=0:15[a]"
                  ),

                  "-map",
                  "0:v:0",

                  "-map",
                  "[a]",

                  "-t",
                  "15",

                  "-c:v",
                  "libx264",

                  "-preset",
                  "veryfast",

                  "-crf",
                  "20",

                  "-pix_fmt",
                  "yuv420p",

                  "-c:a",
                  "aac",

                  "-b:a",
                  "192k",

                  "-ar",
                  "44100",

                  "-movflags",
                  "+faststart",

                  str(final)
              ],
              check=True
          )


          # ==========================================================
          # 27. VERIFY FINAL VIDEO
          # ==========================================================

          probe = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "default=noprint_wrappers=1:"
                  "nokey=1",
                  str(final)
              ],
              capture_output=True,
              text=True
          )


          duration = float(
              probe.stdout.strip()
          )


          (OUT / "video_check.txt").write_text(
              f"duration={duration:.3f}\n"
              f"target=15.000\n"
              f"game={game}\n"
              f"family_score={selected['score']}\n"
              f"evidence={','.join(evidence)}\n"
              f"release={release}\n"
              f"platforms={','.join(platforms)}\n",
              encoding="utf-8"
          )


          print("")
          print(
              "=========================================="
          )
          print("VIDEO CREATED")
          print(
              f"DURATION: {duration:.3f} sec"
          )
          print(
              f"GAME: {game}"
          )
          print(
              f"FAMILY SCORE: {selected['score']}"
          )
          print(
              f"EVIDENCE: {evidence}"
          )
          print(
              f"RELEASE: {release}"
          )
          print(
              f"PLATFORMS: {platforms}"
          )
          print(
              "=========================================="
          )

          PY

      # ============================================================
      # RUN
      # ============================================================

      - name: Generate video
        run: |
          python make_game_news.py

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-game-radar-${{ github.run_number }}
          path: |
            output/
            make_game_news.py
          if-no-files-found: warn
          retention-days: 7
