name: Parent Game Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow feedparser

      # 完全無料・ローカルVOICEVOX
      - name: Start VOICEVOX
        run: |
          docker run -d \
            --name voicevox \
            -p 50021:50021 \
            voicevox/voicevox_engine:cpu-latest

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX ready"
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:50021/version

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import io
          import json
          import re
          import subprocess
          import hashlib
          from pathlib import Path
          from urllib.parse import quote

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageFilter


          # ============================================================
          # 基本設定
          # ============================================================

          OUT = Path("output")
          IMG = OUT / "images"
          SCENES = OUT / "scenes"

          OUT.mkdir(exist_ok=True)
          IMG.mkdir(exist_ok=True)
          SCENES.mkdir(exist_ok=True)

          W = 1080
          H = 1920

          FPS = 30
          SCENE_SEC = 6
          TOTAL_SEC = 30

          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/130 Safari/537.36"
          )

          session = requests.Session()
          session.headers.update({"User-Agent": UA})


          # ============================================================
          # Google News RSS
          #
          # 発売日は採用条件にしない。
          # 新作である必要もない。
          # ============================================================

          QUERIES = [
              "ゲーム 親子 協力プレイ",
              "ゲーム 家族で遊べる",
              "ゲーム ローカル協力",
              "ゲーム 2人 協力",
              "ゲーム 4人 ローカル",
              "ゲーム ファミリー",
              "Switch 親子 ゲーム",
              "Steam family local co-op game",
              "ゲーム パーティー 家族",
          ]


          def rss_url(q):
              return (
                  "https://news.google.com/rss/search?q="
                  + quote(q)
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )


          articles = []
          seen_urls = set()

          for q in QUERIES:
              try:
                  feed = feedparser.parse(rss_url(q))

                  for e in feed.entries[:20]:
                      link = e.get("link", "")
                      title = e.get("title", "").strip()

                      summary = BeautifulSoup(
                          e.get("summary", ""),
                          "html.parser"
                      ).get_text(" ", strip=True)

                      if not link or not title:
                          continue

                      if link in seen_urls:
                          continue

                      seen_urls.add(link)

                      articles.append({
                          "title": title,
                          "summary": summary,
                          "link": link,
                          "published": e.get("published", ""),
                      })

              except Exception as ex:
                  print("RSS error:", ex)


          print("News candidates:", len(articles))


          # ============================================================
          # ゲームタイトル抽出
          # ============================================================

          def clean_game_title(text):

              text = re.sub(r"【[^】]+】", "", text)
              text = re.sub(r"\[[^\]]+\]", "", text)

              text = re.sub(
                  r"（[^）]*(?:発売|配信|リリース|対応|無料)[^）]*）",
                  "",
                  text
              )

              text = re.sub(
                  r"\([^)]*(?:発売|配信|リリース|対応|無料)[^)]*\)",
                  "",
                  text
              )

              patterns = [
                  r"『([^』]{2,80})』",
                  r"「([^」]{2,80})」",
                  r'"([^"]{2,80})"',
              ]

              for pattern in patterns:
                  m = re.search(pattern, text)

                  if m:
                      title = m.group(1).strip()

                      bad_words = [
                          "発売日",
                          "対応機種",
                          "予約",
                          "キャンペーン",
                      ]

                      if not any(x in title for x in bad_words):
                          return title

              x = re.split(
                  r"(?:が|を|の|に|は).{0,2}"
                  r"(?:発売|配信|発表|公開|決定)",
                  text
              )[0]

              x = re.sub(
                  r"^(?:新作|ゲーム|新作ゲーム)[\s:：-]*",
                  "",
                  x
              )

              return x[:70].strip(" -｜|:：")


          # ============================================================
          # 対応機種
          # ============================================================

          def platforms(text):

              found = []

              rules = [
                  ("Switch 2", r"Switch\s*2|Nintendo Switch 2"),
                  ("Switch", r"Nintendo Switch(?!\s*2)|Switch"),
                  ("PS5", r"PS5|PlayStation\s*5"),
                  ("PS4", r"PS4|PlayStation\s*4"),
                  ("Xbox", r"Xbox"),
                  ("PC", r"Steam|PC版|Windows PC"),
                  (
                      "スマホ",
                      r"iOS|Android|App Store|Google Play|"
                      r"スマートフォン|モバイル"
                  ),
              ]

              for name, pattern in rules:
                  if re.search(pattern, text, re.I):
                      if name not in found:
                          found.append(name)

              return found[:4]


          def platform_label(p):

              return {
                  "Switch 2": "Nintendo Switch 2",
                  "Switch": "Nintendo Switch",
                  "PS5": "PlayStation 5",
                  "PS4": "PlayStation 4",
                  "Xbox": "Xbox",
                  "PC": "PC",
                  "スマホ": "スマートフォン",
              }.get(p, p)


          # ============================================================
          # 親子ゲーム判定
          #
          # 70点 = 親子で遊ぶ価値
          # 30点 = 動画としての魅力
          # ============================================================

          POSITIVE = {

              "親子": 15,
              "家族": 12,
              "子ども": 8,
              "こども": 8,
              "キッズ": 7,
              "ファミリー": 8,

              "協力プレイ": 15,
              "ローカル協力": 18,
              "ローカルマルチ": 16,
              "同じ画面": 10,

              "2人プレイ": 12,
              "2人": 7,
              "4人": 8,

              "マルチプレイ": 8,
              "パーティー": 8,
              "パーティ": 8,

              "対戦": 5,

              "教育": 8,
              "学習": 8,
              "知育": 10,

              "料理": 4,
              "スポーツ": 4,
              "レース": 5,
              "音楽": 4,
              "リズム": 4,

              "クラフト": 5,
              "サンドボックス": 7,
              "探索": 4,
              "冒険": 3,

              "Minecraft": 8,
              "マインクラフト": 8,

              "マリオ": 7,
              "カービィ": 7,
              "ポケモン": 6,
              "どうぶつの森": 8,
          }


          NEGATIVE = {

              "成人向け": -30,
              "R18": -35,
              "18禁": -35,
              "アダルト": -35,
              "エロ": -35,
              "性的": -30,

              "ホラー": -20,
              "恐怖": -15,

              "グロ": -30,
              "ゴア": -30,
              "残酷": -25,
              "殺人": -20,

              "サバイバルホラー": -30,

              "ギャンブル": -30,
          }


          def score_family(text):

              low = text.lower()

              score = 0
              hits = []

              for key, value in POSITIVE.items():

                  if key.lower() in low:
                      score += value
                      hits.append(key)

              for key, value in NEGATIVE.items():

                  if key.lower() in low:
                      score += value

              score = max(0, min(70, score))

              return score, list(dict.fromkeys(hits))


          def video_appeal_score(text):

              low = text.lower()

              score = 0
              hits = []

              rules = [

                  ("協力プレイ", 5),
                  ("ローカル", 4),
                  ("マルチプレイ", 4),
                  ("対戦", 4),
                  ("パーティー", 4),
                  ("レース", 4),

                  ("料理", 3),
                  ("クラフト", 3),
                  ("冒険", 3),
                  ("探索", 3),
                  ("スポーツ", 3),

                  ("リズム", 4),
                  ("アクション", 3),
                  ("サンドボックス", 3),

                  ("カラフル", 2),
                  ("かわいい", 3),
                  ("ユニーク", 2),
              ]

              for key, value in rules:

                  if key.lower() in low:
                      score += value
                      hits.append(key)

              return min(30, score), list(dict.fromkeys(hits))


          def hard_ng(text):

              low = text.lower()

              ng = [
                  "成人向け",
                  "r18",
                  "18禁",
                  "アダルト",
                  "エロ",
                  "性的",
                  "グロ",
                  "ゴア",
                  "サバイバルホラー",
                  "ギャンブル",
              ]

              return [x for x in ng if x in low]


          # ============================================================
          # HTML
          # ============================================================

          def get_html(url, timeout=12):

              try:

                  r = session.get(
                      url,
                      timeout=timeout,
                      allow_redirects=True
                  )

                  if (
                      r.ok
                      and "text" in r.headers.get("content-type", "")
                  ):
                      return r.text, r.url

              except Exception:
                  pass

              return "", url


          # ============================================================
          # ページ画像
          # ============================================================

          def page_images(url):

              html, _ = get_html(url)

              if not html:
                  return []

              soup = BeautifulSoup(html, "html.parser")

              urls = []

              for tag in soup.find_all(["meta", "img"]):

                  u = ""

                  if tag.name == "meta":

                      if tag.get("property") in [
                          "og:image",
                          "twitter:image"
                      ]:
                          u = tag.get("content", "")

                  else:

                      u = (
                          tag.get("src")
                          or tag.get("data-src")
                          or ""
                      )

                  if u.startswith("//"):
                      u = "https:" + u

                  if u.startswith("http"):
                      urls.append(u)

              return urls[:30]


          # ============================================================
          # Steam情報
          # ============================================================

          def steam_info(game):

              try:

                  q = session.get(
                      "https://store.steampowered.com/api/storesearch/",
                      params={
                          "term": game,
                          "l": "japanese",
                          "cc": "jp",
                      },
                      timeout=12,
                  )

                  data = q.json()

                  items = data.get("items", [])

                  if not items:
                      return {}, []

                  appid = items[0].get("id")

                  if not appid:
                      return {}, []

                  d = session.get(
                      "https://store.steampowered.com/api/appdetails",
                      params={
                          "appids": appid,
                          "l": "japanese",
                      },
                      timeout=12,
                  ).json()

                  app = d.get(str(appid), {}).get("data", {})

                  if not app:
                      return {}, []

                  categories = [
                      x.get("description", "")
                      for x in app.get("categories", [])
                  ]

                  genres = [
                      x.get("description", "")
                      for x in app.get("genres", [])
                  ]

                  tags = [
                      x.get("description", "")
                      for x in app.get("tags", [])[:30]
                  ]

                  info_text = " ".join([
                      str(app.get("name", "")),
                      str(app.get("short_description", "")),
                      " ".join(categories),
                      " ".join(genres),
                      " ".join(tags),
                  ])

                  images = []

                  for key in [
                      "header_image",
                      "capsule_image",
                      "library_capsule",
                  ]:

                      if app.get(key):
                          images.append(app[key])

                  for screenshot in app.get(
                      "screenshots", []
                  )[:10]:

                      if screenshot.get("path_full"):
                          images.append(
                              screenshot["path_full"]
                          )

                  info = {

                      "appid": appid,

                      "name": app.get(
                          "name",
                          game
                      ),

                      "description": app.get(
                          "short_description",
                          ""
                      ),

                      "categories": categories,

                      "genres": genres,

                      "tags": tags,

                      "platforms": app.get(
                          "platforms",
                          {}
                      ),

                      "info_text": info_text,
                  }

                  return info, images

              except Exception as ex:

                  print("Steam error:", ex)

                  return {}, []


          # ============================================================
          # Bing画像
          # ============================================================

          def bing_images(game):

              result = []

              queries = [

                  f"{game} ゲームプレイ スクリーンショット",

                  f"{game} gameplay screenshot",

              ]

              for q in queries:

                  try:

                      url = (
                          "https://www.bing.com/images/search?q="
                          + quote(q)
                      )

                      html, _ = get_html(
                          url,
                          15
                      )

                      soup = BeautifulSoup(
                          html,
                          "html.parser"
                      )

                      for a in soup.select("a.iusc"):

                          try:

                              obj = json.loads(
                                  a.get("m", "")
                              )

                              u = obj.get(
                                  "murl",
                                  ""
                              )

                              if u.startswith("http"):
                                  result.append(u)

                          except Exception:
                              pass

                  except Exception:
                      pass

              return list(
                  dict.fromkeys(result)
              )[:40]


          # ============================================================
          # 画像品質
          # ============================================================

          def valid_image(data):

              try:

                  im = Image.open(
                      io.BytesIO(data)
                  ).convert("RGB")

                  width, height = im.size

                  if width < 500:
                      return False

                  if height < 300:
                      return False

                  if width * height < 300000:
                      return False

                  thumb = im.resize(
                      (32, 32)
                  )

                  pixels = list(
                      thumb.getdata()
                  )

                  avg = (
                      sum(sum(p) for p in pixels)
                      / (len(pixels) * 3)
                  )

                  variance = sum(
                      (
                          sum(p) / 3
                          - avg
                      ) ** 2
                      for p in pixels
                  ) / len(pixels)

                  if variance < 80:
                      return False

                  return True

              except Exception:

                  return False


          def download_images(candidates):

              paths = []

              seen_hash = set()

              for url in candidates:

                  if len(paths) >= 8:
                      break

                  try:

                      r = session.get(
                          url,
                          timeout=12
                      )

                      if not r.ok:
                          continue

                      data = r.content

                      if len(data) < 25000:
                          continue

                      if len(data) > 15000000:
                          continue

                      image_hash = hashlib.sha1(
                          data
                      ).hexdigest()

                      if image_hash in seen_hash:
                          continue

                      if not valid_image(data):
                          continue

                      seen_hash.add(
                          image_hash
                      )

                      path = IMG / (
                          f"{len(paths)+1:02d}.jpg"
                      )

                      Image.open(
                          io.BytesIO(data)
                      ).convert("RGB").save(
                          path,
                          "JPEG",
                          quality=92
                      )

                      paths.append(path)

                  except Exception:
                      continue

              return paths


          # ============================================================
          # ゲーム選定
          # ============================================================

          ranked = []

          for article in articles:

              text = (
                  article["title"]
                  + " "
                  + article["summary"]
              )

              family_score, family_hits = (
                  score_family(text)
              )

              appeal_score, appeal_hits = (
                  video_appeal_score(text)
              )

              title = clean_game_title(
                  article["title"]
              )

              if not title:
                  continue

              if len(title) < 2:
                  continue

              if hard_ng(text):
                  continue

              # ニュースだけで採用しない
              if family_score < 12:
                  continue

              ranked.append(
                  (
                      family_score,
                      appeal_score,
                      article,
                      family_hits,
                      appeal_hits,
                      title,
                  )
              )


          ranked.sort(
              key=lambda x: (
                  x[0] + x[1],
                  x[0]
              ),
              reverse=True
          )


          print(
              "Ranked candidates:",
              len(ranked)
          )


          selected = None
          diagnostics = []


          for (
              initial_family,
              initial_appeal,
              article,
              initial_family_hits,
              initial_appeal_hits,
              game,
          ) in ranked[:25]:

              steam, steam_images = (
                  steam_info(game)
              )

              evidence_text = (
                  article["title"]
                  + " "
                  + article["summary"]
                  + " "
                  + steam.get(
                      "description",
                      ""
                  )
                  + " "
                  + " ".join(
                      steam.get(
                          "categories",
                          []
                      )
                  )
                  + " "
                  + " ".join(
                      steam.get(
                          "genres",
                          []
                      )
                  )
                  + " "
                  + " ".join(
                      steam.get(
                          "tags",
                          []
                      )
                  )
              )

              family2, family_hits2 = (
                  score_family(
                      evidence_text
                  )
              )

              appeal2, appeal_hits2 = (
                  video_appeal_score(
                      evidence_text
                  )
              )

              family_score = max(
                  initial_family,
                  family2
              )

              appeal_score = max(
                  initial_appeal,
                  appeal2
              )

              family_hits = list(
                  dict.fromkeys(
                      initial_family_hits
                      + family_hits2
                  )
              )

              appeal_hits = list(
                  dict.fromkeys(
                      initial_appeal_hits
                      + appeal_hits2
                  )
              )

              # 具体的な協力・マルチ根拠
              concrete_terms = [

                  "ローカル協力",
                  "ローカルマルチ",
                  "協力プレイ",
                  "2人プレイ",
                  "同じ画面",
                  "マルチプレイ",
                  "4人",
                  "パーティー",
                  "co-op",
              ]

              concrete = 0

              for term in concrete_terms:

                  if term.lower() in evidence_text.lower():
                      concrete += 1

              plats = platforms(
                  evidence_text
              )

              image_candidates = []

              image_candidates += (
                  steam_images
              )

              image_candidates += (
                  page_images(
                      article["link"]
                  )
              )

              image_candidates += (
                  bing_images(game)
              )

              image_candidates = list(
                  dict.fromkeys(
                      image_candidates
                  )
              )

              paths = download_images(
                  image_candidates
              )

              total = (
                  family_score
                  + appeal_score
              )

              diagnostic = {

                  "game": game,

                  "family_score":
                      family_score,

                  "video_appeal_score":
                      appeal_score,

                  "total_score":
                      total,

                  "family_hits":
                      family_hits,

                  "video_hits":
                      appeal_hits,

                  "concrete_evidence_count":
                      concrete,

                  "platforms":
                      plats,

                  "image_candidates":
                      len(image_candidates),

                  "usable_images":
                      len(paths),

                  "source":
                      article["link"],
              }

              diagnostics.append(
                  diagnostic
              )

              print(diagnostic)

              # ========================================================
              # 最終採用条件
              # ========================================================

              if (

                  family_score >= 60

                  and appeal_score >= 15

                  and total >= 80

                  and concrete >= 2

                  and len(paths) >= 5

                  and plats

              ):

                  selected = {

                      "game":
                          game,

                      "family_score":
                          family_score,

                      "appeal_score":
                          appeal_score,

                      "total_score":
                          total,

                      "hits":
                          family_hits,

                      "appeal_hits":
                          appeal_hits,

                      "concrete":
                          concrete,

                      "platforms":
                          plats,

                      "article":
                          article,

                      "images":
                          paths[:5],

                      "steam":
                          steam,
                  }

                  break


          (OUT / "diagnostic.json").write_text(

              json.dumps(
                  diagnostics,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"
          )


          if not selected:

              print(
                  "NO VIDEO: "
                  "条件を満たすゲームがありません。"
              )

              raise SystemExit(0)


          # ============================================================
          # 選択ゲーム
          # ============================================================

          game = selected["game"]

          images = selected["images"]

          platforms_found = (
              selected["platforms"]
          )

          article = selected["article"]

          hits = selected["hits"]


          # ============================================================
          # 親子向けナレーション
          #
          # 超重要:
          #
          # game はここに一切入れない。
          #
          # ゲームタイトルは「画面表示専用」。
          # VOICEVOXには日本語だけ渡す。
          # ============================================================

          coop = any(
              x in hits
              for x in [
                  "協力プレイ",
                  "ローカル協力",
                  "ローカルマルチ",
                  "2人プレイ",
                  "4人",
                  "マルチプレイ",
                  "co-op",
              ]
          )

          education = any(
              x in hits
              for x in [
                  "教育",
                  "学習",
                  "知育",
              ]
          )

          party = any(
              x in hits
              for x in [
                  "パーティー",
                  "パーティ",
                  "対戦",
              ]
          )

          creative = any(
              x in hits
              for x in [
                  "クラフト",
                  "サンドボックス",
                  "Minecraft",
                  "マインクラフト",
              ]
          )


          if coop:

              hook = (
                  "これ、親子で一緒に遊ぶならかなりアリ。"
              )

              feature = (
                  "一緒に協力して進めるタイプなので、"
                  "親子で声を掛け合いながら遊べます。"
              )

          elif education:

              hook = (
                  "ゲームしながら、親子で頭も使える。"
              )

              feature = (
                  "遊びながら考える場面が多く、"
                  "親子で一緒に楽しみやすいタイプです。"
              )

          elif party:

              hook = (
                  "家族で遊ぶゲーム、こういうのが強い。"
              )

              feature = (
                  "ルールが分かりやすく、"
                  "家族でワイワイ遊びやすいのがポイントです。"
              )

          elif creative:

              hook = (
                  "親子で遊ぶなら、自由度高めのこれ。"
              )

              feature = (
                  "親子で自由に遊び方を決められるので、"
                  "遊び方がどんどん広がります。"
              )

          else:

              hook = (
                  "親子で遊べるゲームを探してるなら、これ。"
              )

              feature = (
                  "大人も子どもも一緒に楽しみやすい"
                  "タイプのゲームです。"
              )


          # ============================================================
          # 5シーン用ナレーション
          #
          # すべて日本語。
          # 英字ゲームタイトルなし。
          # ============================================================

          narrations = [

              hook,

              (
                  "ポイントは、親子で同じ時間を共有しながら"
                  "遊べること。"
              ),

              feature,

              (
                  "子どもに任せるところと、"
                  "大人が助けるところを作りやすいゲームです。"
              ),

              (
                  "週末に一緒に遊ぶゲーム候補として、"
                  "保存しておこう。"
              ),
          ]


          # ============================================================
          # VOICEVOX安全チェック
          # ============================================================

          def assert_tts_safe(text):

              # ASCII英字を完全禁止
              if re.search(
                  r"[A-Za-z]",
                  text
              ):

                  raise ValueError(
                      "VOICEVOXに英字が混入しています: "
                      + text
                  )

              # 1文字英字連続も禁止
              if re.search(
                  r"(?:\b[A-Za-z]\b\s*){3,}",
                  text
              ):

                  raise ValueError(
                      "英字連続読みの疑い: "
                      + text
                  )

              # 長すぎる文を禁止
              if len(text) > 90:

                  raise ValueError(
                      "ナレーションが長すぎます: "
                      + text
                  )


          for narration in narrations:

              assert_tts_safe(
                  narration
              )


          # ============================================================
          # 台本保存
          # ============================================================

          (OUT / "script.txt").write_text(

              "\n".join(
                  f"[{i + 1}] {text}"
                  for i, text in enumerate(
                      narrations
                  )
              ),

              encoding="utf-8"
          )


          (OUT / "source.txt").write_text(

              f"game={game}\n"
              f"family_score="
              f"{selected['family_score']}\n"
              f"video_appeal_score="
              f"{selected['appeal_score']}\n"
              f"total_score="
              f"{selected['total_score']}\n"
              f"family_hits="
              f"{','.join(hits)}\n"
              f"platforms="
              f"{','.join(platforms_found)}\n"
              f"source="
              f"{article['link']}\n"
              f"news_title="
              f"{article['title']}\n",

              encoding="utf-8"
          )


          # ============================================================
          # VOICEVOX
          #
          # 外部の有料APIではない。
          # GitHub Actions内のDockerでローカル実行。
          # ============================================================

          VOICEVOX = (
              "http://127.0.0.1:50021"
          )

          SPEAKER = 3


          def make_voice(
              text,
              output_path
          ):

              # 念のためここでもチェック
              assert_tts_safe(text)

              query_response = session.post(

                  VOICEVOX
                  + "/audio_query",

                  params={
                      "text": text,
                      "speaker": SPEAKER,
                  },

                  timeout=30
              )

              query_response.raise_for_status()

              query = query_response.json()

              query["speedScale"] = 1.10
              query["intonationScale"] = 1.05

              synthesis_response = session.post(

                  VOICEVOX
                  + "/synthesis",

                  params={
                      "speaker": SPEAKER
                  },

                  json=query,

                  timeout=60
              )

              synthesis_response.raise_for_status()

              output_path.write_bytes(
                  synthesis_response.content
              )


          voice_files = []

          for i, narration in enumerate(
              narrations,
              1
          ):

              output_path = (
                  OUT
                  / f"voice{i}.wav"
              )

              make_voice(
                  narration,
                  output_path
              )

              voice_files.append(
                  output_path
              )


          # ============================================================
          # BGM
          # FFmpegのみ
          # ============================================================

          bgm = OUT / "bgm.wav"


          subprocess.run(

              [

                  "ffmpeg",
                  "-y",

                  "-f",
                  "lavfi",

                  "-i",
                  f"sine=frequency=110:"
                  f"duration={TOTAL_SEC}:"
                  f"sample_rate=44100",

                  "-f",
                  "lavfi",

                  "-i",
                  f"sine=frequency=220:"
                  f"duration={TOTAL_SEC}:"
                  f"sample_rate=44100",

                  "-f",
                  "lavfi",

                  "-i",
                  f"sine=frequency=330:"
                  f"duration={TOTAL_SEC}:"
                  f"sample_rate=44100",

                  "-filter_complex",

                  "[0:a]volume=0.045[a];"
                  "[1:a]volume=0.025[b];"
                  "[2:a]volume=0.015[c];"
                  "[a][b][c]"
                  "amix=inputs=3:duration=longest,"
                  "afade=t=in:st=0:d=1,"
                  f"afade=t=out:"
                  f"st={TOTAL_SEC - 1.5}:"
                  "d=1.5",

                  "-ar",
                  "44100",

                  "-ac",
                  "2",

                  str(bgm),
              ],

              check=True
          )


          # ============================================================
          # フォント
          # ============================================================

          FONT_BOLD = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
          )

          FONT_REGULAR = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Regular.ttc"
          )


          def font(
              size,
              bold=True
          ):

              return ImageFont.truetype(

                  FONT_BOLD
                  if bold
                  else FONT_REGULAR,

                  size
              )


          # ============================================================
          # 画像を縦画面用にクロップ
          # ============================================================

          def fit_cover(
              image,
              size
          ):

              target_w, target_h = size

              image_w, image_h = (
                  image.size
              )

              scale = max(
                  target_w / image_w,
                  target_h / image_h
              )

              new_w = int(
                  image_w * scale
              )

              new_h = int(
                  image_h * scale
              )

              image = image.resize(
                  (new_w, new_h),
                  Image.Resampling.LANCZOS
              )

              left = (
                  new_w - target_w
              ) // 2

              top = (
                  new_h - target_h
              ) // 2

              return image.crop(
                  (
                      left,
                      top,
                      left + target_w,
                      top + target_h
                  )
              )


          # ============================================================
          # タイトル折り返し
          # ============================================================

          def wrap_title(
              text,
              max_chars=15
          ):

              lines = []

              current = ""

              for ch in text:

                  current += ch

                  if len(current) >= max_chars:

                      lines.append(
                          current
                      )

                      current = ""

              if current:
                  lines.append(
                      current
                  )

              return lines[:2]


          # ============================================================
          # 5シーン
          # ============================================================

          scene_headers = [

              "親子ゲーム候補",

              "ここが面白い",

              "親子で遊ぶポイント",

              "一緒に遊ぶなら",

              "週末の候補に保存",

          ]


          bottom_messages = [

              "親子で一緒に遊べる？",

              "一緒に声を掛け合える？",

              "子どもだけに任せなくてOK",

              "協力するともっと楽しい",

              "次の週末にチェック",

          ]


          # ============================================================
          # シーン画像生成
          # ============================================================

          for i, (
              image_path,
              narration
          ) in enumerate(
              zip(
                  images,
                  narrations
              ),
              1
          ):

              image = Image.open(
                  image_path
              ).convert("RGB")


              # 背景
              background = fit_cover(
                  image,
                  (W, H)
              ).filter(
                  ImageFilter.GaussianBlur(
                      22
                  )
              )

              canvas = background.copy()


              # ゲーム画像本体
              foreground = fit_cover(
                  image,
                  (W, 1260)
              )

              canvas.paste(
                  foreground,
                  (0, 330)
              )


              draw = ImageDraw.Draw(
                  canvas,
                  "RGBA"
              )


              # 上部
              draw.rectangle(
                  (0, 0, W, 330),
                  fill=(
                      0,
                      0,
                      0,
                      145
                  )
              )


              # 下部
              #
              # TikTok UIに被りにくいよう、
              # 一番下には重要情報を置かない。
              draw.rectangle(
                  (0, 1590, W, 1785),
                  fill=(
                      0,
                      0,
                      0,
                      155
                  )
              )


              # シーン見出し
              draw.rounded_rectangle(

                  (55, 65, 365, 135),

                  radius=25,

                  fill=(
                      255,
                      255,
                      255,
                      225
                  )
              )


              draw.text(

                  (80, 82),

                  scene_headers[i - 1],

                  font=font(28),

                  fill=(
                      15,
                      15,
                      15,
                      255
                  )
              )


              # ========================================================
              # ゲームタイトル
              #
              # 画面表示のみ。
              # VOICEVOXには渡していない。
              # ========================================================

              title_lines = wrap_title(
                  game
              )

              y = 175

              for line in title_lines:

                  draw.text(

                      (55, y),

                      line,

                      font=font(58),

                      fill=(
                          255,
                          255,
                          255,
                          255
                      ),

                      stroke_width=2,

                      stroke_fill=(
                          0,
                          0,
                          0,
                          220
                      )
                  )

                  y += 72


              # 下部メッセージ
              draw.text(

                  (55, 1630),

                  bottom_messages[i - 1],

                  font=font(44),

                  fill=(
                      255,
                      255,
                      255,
                      255
                  ),

                  stroke_width=2,

                  stroke_fill=(
                      0,
                      0,
                      0,
                      220
                  )
              )


              # 最終シーンだけ対応機種
              if i == 5:

                  platform_text = " / ".join(

                      platform_label(x)
                      for x in platforms_found[:3]

                  )

                  draw.text(

                      (55, 1700),

                      platform_text,

                      font=font(
                          32,
                          bold=False
                      ),

                      fill=(
                          255,
                          255,
                          255,
                          230
                      )
                  )


              # 進捗バー
              x0 = 55
              y0 = 1815
              x1 = 1025
              y1 = 1827

              draw.rounded_rectangle(

                  (
                      x0,
                      y0,
                      x1,
                      y1
                  ),

                  radius=6,

                  fill=(
                      255,
                      255,
                      255,
                      80
                  )
              )

              segment = (
                  x1 - x0
              ) / 5

              draw.rounded_rectangle(

                  (
                      x0
                      + (i - 1)
                      * segment,

                      y0,

                      x0
                      + i
                      * segment,

                      y1
                  ),

                  radius=6,

                  fill=(
                      255,
                      255,
                      255,
                      235
                  )
              )


              canvas.save(

                  SCENES
                  / f"scene{i}.png",

                  quality=95
              )


          # ============================================================
          # 5シーンを30秒動画化
          # ============================================================

          concat = (
              OUT
              / "scenes.txt"
          )

          concat_lines = []

          for i in range(1, 6):

              concat_lines.append(

                  "file '"
                  + str(
                      (
                          SCENES
                          / f"scene{i}.png"
                      ).resolve()
                  )
                  + "'"
              )

              concat_lines.append(
                  f"duration {SCENE_SEC}"
              )


          # concat demuxer対策
          concat_lines.append(

              "file '"
              + str(
                  (
                      SCENES
                      / "scene5.png"
                  ).resolve()
              )
              + "'"
          )


          concat.write_text(

              "\n".join(
                  concat_lines
              ),

              encoding="utf-8"
          )


          subprocess.run(

              [

                  "ffmpeg",
                  "-y",

                  "-f",
                  "concat",

                  "-safe",
                  "0",

                  "-i",
                  str(concat),

                  "-vf",
                  (
                      f"scale={W}:{H}:"
                      "force_original_aspect_ratio=decrease,"
                      f"pad={W}:{H}:(ow-iw)/2:(oh-ih)/2"
                  ),

                  "-t",
                  str(TOTAL_SEC),

                  "-r",
                  str(FPS),

                  "-c:v",
                  "libx264",

                  "-pix_fmt",
                  "yuv420p",

                  "-an",

                  str(
                      OUT
                      / "visual.mp4"
                  ),
              ],

              check=True
          )


          # ============================================================
          # ナレーション結合
          # ============================================================

          voice_list = (
              OUT
              / "voice_list.txt"
          )

          voice_list.write_text(

              "\n".join(

                  "file '"
                  + str(
                      p.resolve()
                  )
                  + "'"

                  for p in voice_files
              ),

              encoding="utf-8"
          )


          subprocess.run(

              [

                  "ffmpeg",
                  "-y",

                  "-f",
                  "concat",

                  "-safe",
                  "0",

                  "-i",
                  str(voice_list),

                  "-af",
                  (
                      f"apad,"
                      f"atrim=0:{TOTAL_SEC}"
                  ),

                  "-ar",
                  "44100",

                  "-ac",
                  "2",

                  str(
                      OUT
                      / "voice_all.wav"
                  ),
              ],

              check=True
          )


          # ============================================================
          # 最終動画
          # ============================================================

          final = (
              OUT
              / "parent_game_radar.mp4"
          )


          subprocess.run(

              [

                  "ffmpeg",
                  "-y",

                  "-i",
                  str(
                      OUT
                      / "visual.mp4"
                  ),

                  "-i",
                  str(
                      OUT
                      / "voice_all.wav"
                  ),

                  "-i",
                  str(bgm),

                  "-filter_complex",

                  "[1:a]volume=1.0[n];"
                  "[2:a]volume=0.12[b];"
                  "[n][b]"
                  "amix=inputs=2:"
                  "duration=longest:"
                  "dropout_transition=0,"
                  "alimiter=limit=0.95[mix]",

                  "-map",
                  "0:v:0",

                  "-map",
                  "[mix]",

                  "-t",
                  str(TOTAL_SEC),

                  "-c:v",
                  "libx264",

                  "-preset",
                  "veryfast",

                  "-crf",
                  "20",

                  "-c:a",
                  "aac",

                  "-b:a",
                  "192k",

                  "-movflags",
                  "+faststart",

                  str(final),
              ],

              check=True
          )


          # ============================================================
          # 最終チェック
          #
          # 30秒
          # 1080x1920
          # ============================================================

          probe = subprocess.run(

              [

                  "ffprobe",

                  "-v",
                  "error",

                  "-show_entries",

                  "format=duration:"
                  "stream=width,height,"
                  "r_frame_rate,codec_type",

                  "-of",
                  "json",

                  str(final),
              ],

              capture_output=True,

              text=True,

              check=True
          )


          probe_json = json.loads(
              probe.stdout
          )


          (
              OUT
              / "video_check.json"
          ).write_text(

              json.dumps(
                  probe_json,
                  ensure_ascii=False,
                  indent=2
              ),

              encoding="utf-8"
          )


          duration = float(
              probe_json[
                  "format"
              ][
                  "duration"
              ]
          )


          video_stream = next(

              stream

              for stream
              in probe_json[
                  "streams"
              ]

              if stream.get(
                  "codec_type"
              ) == "video"
          )


          width = int(
              video_stream["width"]
          )

          height = int(
              video_stream["height"]
          )


          if abs(
              duration
              - TOTAL_SEC
          ) > 0.25:

              raise RuntimeError(

                  "動画長チェック失敗: "
                  + str(duration)
                  + "秒"
              )


          if width != W or height != H:

              raise RuntimeError(

                  "解像度チェック失敗: "
                  + f"{width}x{height}"
              )


          print(
              "================================"
          )

          print(
              "VIDEO CREATED:"
              ,
              final
          )

          print(
              "Duration:",
              duration
          )

          print(
              "Resolution:",
              f"{width}x{height}"
          )

          print(
              "Scenes:",
              5
          )

          print(
              "TTS:",
              "Japanese only"
          )

          print(
              "Game title:",
              "NEVER SENT TO VOICEVOX"
          )

          print(
              "================================"
          )

          PY

      - name: Generate video
        run: |
          python make_game_news.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-game-radar-${{ github.run_number }}
          path: |
            output/
            make_game_news.py
          if-no-files-found: warn
          retention-days: 7
