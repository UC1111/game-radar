name: Auto Game News TikTok

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3 python3-pip
          python3 -m pip install requests beautifulsoup4 pillow

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import os
          import re
          import sys
          import html
          import subprocess
          import requests
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from datetime import datetime
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          W = 1080
          H = 1920
          FPS = 30
          OUT = "output"
          os.makedirs(OUT, exist_ok=True)

          FONT_BOLD = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
          FONT_REG = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"

          if not os.path.exists(FONT_BOLD):
              FONT_BOLD = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.otf"

          if not os.path.exists(FONT_REG):
              FONT_REG = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.otf"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 GameNewsRadar/1.0"
          })

          def font(size, bold=False):
              path = FONT_BOLD if bold else FONT_REG
              return ImageFont.truetype(path, size)

          def get(url, timeout=15):
              try:
                  r = session.get(url, timeout=timeout, allow_redirects=True)
                  r.raise_for_status()
                  return r
              except Exception:
                  return None

          def wrap_text(text, max_chars=16):
              text = re.sub(r"\s+", " ", text).strip()
              result = []
              while len(text) > max_chars:
                  cut = max_chars
                  for i in range(max_chars, max(0, max_chars - 6), -1):
                      if text[i-1] in " 、。,.！？!?":
                          cut = i
                          break
                  result.append(text[:cut])
                  text = text[cut:]
              if text:
                  result.append(text)
              return "\n".join(result)

          def extract_og_image(soup):
              for attrs in [
                  {"property": "og:image"},
                  {"name": "twitter:image"},
                  {"property": "og:image:url"}
              ]:
                  tag = soup.find("meta", attrs=attrs)
                  if tag and tag.get("content"):
                      return html.unescape(tag["content"])
              return None

          def extract_release_date(text):
              patterns = [
                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日",
                  r"(20\d{2})[/-](\d{1,2})[/-](\d{1,2})",
                  r"(20\d{2})\.(\d{1,2})\.(\d{1,2})"
              ]

              for p in patterns:
                  m = re.search(p, text)
                  if m:
                      y, mo, d = map(int, m.groups())
                      try:
                          dt = datetime(y, mo, d)
                          return dt.strftime("%Y/%m/%d")
                      except:
                          pass

              return None

          def extract_platforms(text):
              found = []

              platform_patterns = [
                  ("PS5", r"PS5|PlayStation\s*5|プレイステーション5"),
                  ("PS4", r"PS4|PlayStation\s*4|プレイステーション4"),
                  ("Switch 2", r"Switch\s*2|Nintendo\s*Switch\s*2"),
                  ("Switch", r"Nintendo\s*Switch(?!\s*2)|Switch(?!\s*2)"),
                  ("Xbox Series X|S", r"Xbox\s*Series"),
                  ("Xbox One", r"Xbox\s*One"),
                  ("PC", r"PC|Steam|Windows"),
              ]

              for name, pattern in platform_patterns:
                  if re.search(pattern, text, re.I):
                      if name not in found:
                          found.append(name)

              return found

          def clean_game_name(title):
              title = re.sub(r"\s*[-｜|]\s*[^-｜|]+$", "", title)
              title = re.sub(r"【[^】]+】", "", title)
              title = re.sub(r"\[[^\]]+\]", "", title)
              title = title.strip()

              bad = [
                  "発売決定",
                  "発売日",
                  "最新情報",
                  "最新ニュース",
                  "新情報",
                  "発表",
                  "正式発表"
              ]

              for x in bad:
                  title = title.replace(x, "")

              title = re.sub(r"\s+", " ", title).strip()

              if len(title) > 40:
                  title = title[:40]

              return title

          def get_google_news():
              queries = [
                  "ゲーム 新作 発売日 2026",
                  "ゲーム 発売決定 PS5 Switch2 PC",
                  "ゲーム 新作 PS5 Switch Steam",
                  "ゲーム 発売日 Switch2 PS5"
              ]

              items = []

              for q in queries:
                  url = "https://news.google.com/rss/search?q=" + requests.utils.quote(
                      q + " when:1d"
                  ) + "&hl=ja&gl=JP&ceid=JP:ja"

                  r = get(url)

                  if not r:
                      continue

                  try:
                      root = ET.fromstring(r.content)
                  except:
                      continue

                  for item in root.findall(".//item"):
                      title = item.findtext("title") or ""
                      link = item.findtext("link") or ""
                      desc = item.findtext("description") or ""

                      items.append({
                          "title": html.unescape(title),
                          "link": link,
                          "desc": html.unescape(desc)
                      })

              unique = []
              seen = set()

              for x in items:
                  key = x["title"]

                  if key not in seen:
                      seen.add(key)
                      unique.append(x)

              return unique

          def fetch_article(item):
              r = get(item["link"])

              if not r:
                  return None

              try:
                  soup = BeautifulSoup(r.text, "html.parser")
              except:
                  return None

              title = soup.title.get_text(" ", strip=True) if soup.title else item["title"]

              description = ""
              meta = soup.find("meta", attrs={"name": "description"})

              if meta:
                  description = meta.get("content", "")

              paragraphs = []

              for p in soup.find_all("p")[:80]:
                  t = p.get_text(" ", strip=True)
                  if t:
                      paragraphs.append(t)

              body = " ".join(paragraphs)

              image_url = extract_og_image(soup)

              return {
                  "title": title,
                  "description": description,
                  "body": body,
                  "image_url": image_url,
                  "url": item["link"]
              }

          def download_image(url):
              if not url:
                  return None

              r = get(url, timeout=20)

              if not r:
                  return None

              try:
                  img = Image.open(BytesIO(r.content)).convert("RGB")
                  return img
              except:
                  return None

          def make_background(img):
              if img is None:
                  return Image.new("RGB", (W, H), (12, 12, 18))

              iw, ih = img.size
              scale = max(W / iw, H / ih)

              nw = int(iw * scale)
              nh = int(ih * scale)

              img = img.resize((nw, nh), Image.Resampling.LANCZOS)

              left = max(0, (nw - W) // 2)
              top = max(0, (nh - H) // 2)

              img = img.crop((left, top, left + W, top + H))

              overlay = Image.new("RGBA", (W, H), (0, 0, 0, 75))
              img = img.convert("RGBA")
              img.alpha_composite(overlay)

              return img.convert("RGB")

          def draw_center(draw, text, y, f, fill=(255,255,255), stroke=0):
              box = draw.multiline_textbbox(
                  (0, 0),
                  text,
                  font=f,
                  align="center",
                  spacing=12,
                  stroke_width=stroke
              )

              tw = box[2] - box[0]

              draw.multiline_text(
                  ((W - tw) / 2, y),
                  text,
                  font=f,
                  fill=fill,
                  align="center",
                  spacing=12,
                  stroke_width=stroke,
                  stroke_fill=(0,0,0)
              )

          def make_scene(index, game, headline, platforms, release_date, image):
              bg = make_background(image)
              draw = ImageDraw.Draw(bg)

              if index == 0:
                  draw.rectangle((40, 90, W-40, 270), fill=(0,0,0,170))

                  draw_center(
                      draw,
                      "GAME NEWS",
                      105,
                      font(76, True),
                      fill=(255,220,40),
                      stroke=3
                  )

                  draw_center(
                      draw,
                      "これ、ちょっと気になる。",
                      340,
                      font(72, True),
                      fill=(255,255,255),
                      stroke=4
                  )

                  draw_center(
                      draw,
                      wrap_text(game, 15),
                      560,
                      font(88, True),
                      fill=(255,255,255),
                      stroke=5
                  )

              elif index == 1:
                  draw.rectangle((45, 90, W-45, 430), fill=(0,0,0,185))

                  draw_center(
                      draw,
                      "新作ニュース",
                      115,
                      font(70, True),
                      fill=(255,220,40),
                      stroke=3
                  )

                  draw_center(
                      draw,
                      wrap_text(headline, 16),
                      240,
                      font(68, True),
                      fill=(255,255,255),
                      stroke=4
                  )

              elif index == 2:
                  draw.rectangle((45, 100, W-45, 720), fill=(0,0,0,185))

                  draw_center(
                      draw,
                      "対応機種",
                      145,
                      font(65, True),
                      fill=(255,220,40),
                      stroke=3
                  )

                  platform_text = "  /  ".join(platforms)

                  draw_center(
                      draw,
                      wrap_text(platform_text, 18),
                      280,
                      font(72, True),
                      fill=(255,255,255),
                      stroke=4
                  )

                  draw_center(
                      draw,
                      "発売日",
                      500,
                      font(60, True),
                      fill=(255,220,40),
                      stroke=3
                  )

                  draw_center(
                      draw,
                      release_date,
                      610,
                      font(82, True),
                      fill=(255,255,255),
                      stroke=4
                  )

              elif index == 3:
                  draw.rectangle((45, 100, W-45, 900), fill=(0,0,0,190))

                  draw_center(
                      draw,
                      "15秒でここだけ確認",
                      145,
                      font(68, True),
                      fill=(255,220,40),
                      stroke=3
                  )

                  checks = [
                      "✓ 新作ゲーム",
                      "✓ 発売日確定",
                      "✓ 対応機種確定"
                  ]

                  y = 350

                  for c in checks:
                      draw_center(
                          draw,
                          c,
                          y,
                          font(66, True),
                          fill=(255,255,255),
                          stroke=4
                      )
                      y += 160

              else:
                  draw.rectangle((35, 120, W-35, 760), fill=(0,0,0,195))

                  draw_center(
                      draw,
                      "発売日",
                      170,
                      font(60, True),
                      fill=(255,220,40),
                      stroke=3
                  )

                  draw_center(
                      draw,
                      release_date,
                      270,
                      font(92, True),
                      fill=(255,255,255),
                      stroke=5
                  )

                  draw_center(
                      draw,
                      wrap_text(" / ".join(platforms), 18),
                      450,
                      font(60, True),
                      fill=(255,255,255),
                      stroke=4
                  )

                  draw_center(
                      draw,
                      "気になるなら保存",
                      780,
                      font(72, True),
                      fill=(255,255,255),
                      stroke=4
                  )

              path = f"{OUT}/scene_{index}.png"
              bg.save(path, quality=95)
              return path

          def create_video(scene_paths):
              list_file = f"{OUT}/concat.txt"

              with open(list_file, "w", encoding="utf-8") as f:
                  for p in scene_paths:
                      f.write(f"file '{os.path.abspath(p)}'\n")
                      f.write("duration 3\n")

                  f.write(f"file '{os.path.abspath(scene_paths[-1])}'\n")

              output = f"{OUT}/game_news_tiktok.mp4"

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f", "concat",
                  "-safe", "0",
                  "-i", list_file,
                  "-vf",
                  "scale=1080:1920:force_original_aspect_ratio=decrease,"
                  "pad=1080:1920:(ow-iw)/2:(oh-ih)/2,"
                  "fps=30",
                  "-c:v", "libx264",
                  "-preset", "veryfast",
                  "-crf", "21",
                  "-pix_fmt", "yuv420p",
                  "-movflags", "+faststart",
                  output
              ]

              result = subprocess.run(
                  cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              if result.returncode != 0:
                  print(result.stdout)
                  sys.exit(1)

              return output

          def main():
              from bs4 import BeautifulSoup

              candidates = get_google_news()

              if not candidates:
                  print("ニュースが見つかりません。動画は作りません。")
                  return

              selected = None

              for item in candidates:
                  bad_words = [
                      "攻略",
                      "最強",
                      "コード",
                      "中古",
                      "セール",
                      "プレゼント",
                      "配布",
                      "レビュー",
                      "評価"
                  ]

                  if any(x in item["title"] for x in bad_words):
                      continue

                  article = fetch_article(item)

                  if not article:
                      continue

                  full_text = " ".join([
                      item["title"],
                      item["desc"],
                      article["title"],
                      article["description"],
                      article["body"]
                  ])

                  release_date = extract_release_date(full_text)

                  if not release_date:
                      continue

                  platforms = extract_platforms(full_text)

                  if len(platforms) == 0:
                      continue

                  image = download_image(article["image_url"])

                  if image is None:
                      continue

                  game = clean_game_name(item["title"])

                  if len(game) < 2:
                      continue

                  selected = {
                      "game": game,
                      "headline": item["title"],
                      "release_date": release_date,
                      "platforms": platforms[:4],
                      "image": image,
                      "url": article["url"]
                  }

                  break

              if selected is None:
                  print("条件を満たすニュースがありません。")
                  print("動画は生成しません。")
                  return

              print("採用ニュース:")
              print(selected["game"])
              print(selected["release_date"])
              print(selected["platforms"])
              print(selected["url"])

              scenes = []

              for i in range(5):
                  scenes.append(
                      make_scene(
                          i,
                          selected["game"],
                          selected["headline"],
                          selected["platforms"],
                          selected["release_date"],
                          selected["image"]
                      )
                  )

              video = create_video(scenes)

              with open(
                  f"{OUT}/source.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("Game News Radar\n")
                  f.write("====================\n")
                  f.write(f"ゲーム: {selected['game']}\n")
                  f.write(f"発売日: {selected['release_date']}\n")
                  f.write(
                      f"対応機種: {', '.join(selected['platforms'])}\n"
                  )
                  f.write(f"ニュース: {selected['headline']}\n")
                  f.write(f"URL: {selected['url']}\n")

              print("")
              print("完成:")
              print(video)

          if __name__ == "__main__":
              main()
          PY

          python3 make_game_news.py

      - name: Upload completed video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game-news-tiktok-${{ github.run_number }}
          path: |
            output/game_news_tiktok.mp4
            output/source.txt
          retention-days: 7
          if-no-files-found: ignore
