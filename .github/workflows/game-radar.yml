name: Auto Game News TikTok

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "10 7 * * *"
      timezone: "Asia/Tokyo"

jobs:
  make-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install requests feedparser beautifulsoup4 pillow

      - name: Create video
        run: |
          cat > make_video.py <<'PY'
          import os
          import re
          import html
          import json
          import time
          import shutil
          import subprocess
          from datetime import datetime, date
          from urllib.parse import quote

          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont

          TODAY = date.today()

          OUT_DIR = "output"
          os.makedirs(OUT_DIR, exist_ok=True)

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/128 Safari/537.36"
              )
          }

          QUERIES = [
              "ゲーム 新作 発売日",
              "ゲーム 発売決定",
              "ゲーム 正式リリース",
              "ゲーム アーリーアクセス",
              "ゲーム PS5 Switch PC 発売",
              "ゲーム Switch2 発売",
              "ゲーム Steam 発売",
              "新作ゲーム 2026",
              "新作ゲーム 2027",
          ]

          session = requests.Session()
          session.headers.update(HEADERS)


          # --------------------------------------------------
          # Google News RSS
          # --------------------------------------------------

          def google_news(query):
              url = (
                  "https://news.google.com/rss/search?"
                  f"q={quote(query)}&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  r = session.get(url, timeout=15)
                  r.raise_for_status()
                  return feedparser.parse(r.text).entries
              except Exception as e:
                  print("RSS error:", e)
                  return []


          # --------------------------------------------------
          # HTML article
          # --------------------------------------------------

          def fetch_article(url):
              try:
                  r = session.get(
                      url,
                      timeout=15,
                      allow_redirects=True
                  )

                  if r.status_code != 200:
                      return "", "", ""

                  soup = BeautifulSoup(r.text, "html.parser")

                  title = ""

                  og_title = soup.find(
                      "meta",
                      attrs={"property": "og:title"}
                  )

                  if og_title:
                      title = og_title.get("content", "")

                  if not title and soup.title:
                      title = soup.title.get_text(" ", strip=True)

                  desc = ""

                  for attrs in [
                      {"name": "description"},
                      {"property": "og:description"},
                  ]:
                      tag = soup.find("meta", attrs=attrs)

                      if tag:
                          desc = tag.get("content", "")
                          if desc:
                              break

                  image = ""

                  for attrs in [
                      {"property": "og:image"},
                      {"name": "twitter:image"},
                  ]:
                      tag = soup.find("meta", attrs=attrs)

                      if tag:
                          image = tag.get("content", "")
                          if image:
                              break

                  for tag in soup(["script", "style", "noscript"]):
                      tag.decompose()

                  body = soup.get_text(" ", strip=True)

                  return title, desc + " " + body, image

              except Exception as e:
                  print("Article error:", e)
                  return "", "", ""


          # --------------------------------------------------
          # Game title
          # --------------------------------------------------

          def extract_game_title(title, text):

              # 『タイトル』
              m = re.search(r"『([^』]{2,80})』", title)

              if m:
                  candidate = m.group(1).strip()

                  # 一般ニュースの表現を除外
                  if not any(
                      x in candidate
                      for x in [
                          "ゲームニュース",
                          "インタビュー",
                          "イベント",
                          "最新情報"
                      ]
                  ):
                      return candidate

              # 「タイトル」
              m = re.search(r"「([^」]{2,80})」", title)

              if m:
                  return m.group(1).strip()

              # タイトル内のゲーム表現
              patterns = [
                  r"ゲーム『([^』]+)』",
                  r"新作『([^』]+)』",
                  r"アプリ『([^』]+)』",
              ]

              for p in patterns:
                  m = re.search(p, title)

                  if m:
                      return m.group(1).strip()

              # fallback
              cleaned = re.sub(
                  r"\s*[｜|].*$",
                  "",
                  title
              )

              cleaned = re.sub(
                  r"【[^】]+】",
                  "",
                  cleaned
              )

              return cleaned[:80].strip()


          # --------------------------------------------------
          # Release date extraction
          # --------------------------------------------------

          def normalize_date(year, month, day):

              try:
                  d = date(
                      int(year),
                      int(month),
                      int(day)
                  )

                  return d.strftime("%Y/%m/%d")

              except:
                  return None


          def extract_release_date(text):

              # --------------------------------------------
              # YYYY年MM月DD日
              # --------------------------------------------

              patterns = [
                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日",
                  r"(20\d{2})[./-](\d{1,2})[./-](\d{1,2})",
              ]

              for p in patterns:
                  m = re.search(p, text)

                  if m:
                      result = normalize_date(
                          m.group(1),
                          m.group(2),
                          m.group(3)
                      )

                      if result:
                          return result


              # --------------------------------------------
              # 本日（9/14）
              # --------------------------------------------

              m = re.search(
                  r"(?:本日|本日より|本日から)[^0-9]{0,10}"
                  r"[（(](\d{1,2})[/-](\d{1,2})[）)]",
                  text
              )

              if m:
                  result = normalize_date(
                      TODAY.year,
                      m.group(1),
                      m.group(2)
                  )

                  if result:
                      return result


              # --------------------------------------------
              # M月D日
              # --------------------------------------------

              m = re.search(
                  r"(?<!\d)(\d{1,2})月(\d{1,2})日",
                  text
              )

              if m:

                  month = int(m.group(1))
                  day = int(m.group(2))

                  # 明らかな日付表現だけ採用
                  nearby = text[
                      max(0, m.start()-40):
                      min(len(text), m.end()+60)
                  ]

                  keywords = [
                      "発売",
                      "リリース",
                      "配信",
                      "開始",
                      "発売日",
                      "正式",
                      "アーリーアクセス",
                      "サービス開始"
                  ]

                  if any(k in nearby for k in keywords):

                      result = normalize_date(
                          TODAY.year,
                          month,
                          day
                      )

                      if result:
                          return result


              # --------------------------------------------
              # M/D
              # --------------------------------------------

              m = re.search(
                  r"(?<!\d)(\d{1,2})/(\d{1,2})(?!\d)",
                  text
              )

              if m:

                  month = int(m.group(1))
                  day = int(m.group(2))

                  nearby = text[
                      max(0, m.start()-40):
                      min(len(text), m.end()+60)
                  ]

                  keywords = [
                      "発売",
                      "リリース",
                      "配信",
                      "開始",
                      "発売日",
                      "正式",
                      "アーリーアクセス"
                  ]

                  if any(k in nearby for k in keywords):

                      result = normalize_date(
                          TODAY.year,
                          month,
                          day
                      )

                      if result:
                          return result


              return None


          # --------------------------------------------------
          # Platform extraction
          # --------------------------------------------------

          def extract_platforms(text):

              found = []

              platform_patterns = [
                  ("PS5", [
                      r"\bPS5\b",
                      r"PlayStation\s*5",
                      r"プレイステーション5",
                      r"プレイステーション５"
                  ]),

                  ("PS4", [
                      r"\bPS4\b",
                      r"PlayStation\s*4",
                      r"プレイステーション4",
                      r"プレイステーション４"
                  ]),

                  ("Switch 2", [
                      r"Switch\s*2",
                      r"Nintendo\s*Switch\s*2",
                      r"ニンテンドースイッチ2",
                      r"ニンテンドースイッチ２"
                  ]),

                  ("Switch", [
                      r"Nintendo\s*Switch",
                      r"\bSwitch\b",
                      r"ニンテンドースイッチ"
                  ]),

                  ("Xbox Series X|S", [
                      r"Xbox\s*Series\s*X",
                      r"Xbox\s*Series\s*S",
                      r"Xbox\s*Series\s*X\|S"
                  ]),

                  ("Xbox One", [
                      r"Xbox\s*One"
                  ]),

                  ("PC", [
                      r"\bPC\b",
                      r"Windows",
                      r"PC版"
                  ]),

                  ("Steam", [
                      r"\bSteam\b"
                  ]),

                  ("Epic Games Store", [
                      r"Epic\s*Games\s*Store"
                  ]),

                  ("iOS", [
                      r"\biOS\b",
                      r"App\s*Store",
                      r"iPhone"
                  ]),

                  ("Android", [
                      r"\bAndroid\b",
                      r"Google\s*Play"
                  ]),
              ]

              for label, patterns in platform_patterns:

                  for p in patterns:

                      if re.search(
                          p,
                          text,
                          flags=re.IGNORECASE
                      ):
                          if label not in found:
                              found.append(label)

                          break

              # SteamはPC扱いにする
              if "Steam" in found and "PC" not in found:
                  found.insert(0, "PC")

              return found


          # --------------------------------------------------
          # Download image
          # --------------------------------------------------

          def download_image(url, path):

              if not url:
                  return False

              try:

                  r = session.get(
                      url,
                      timeout=20,
                      stream=True
                  )

                  if r.status_code != 200:
                      return False

                  content_type = r.headers.get(
                      "content-type",
                      ""
                  )

                  if "image" not in content_type:
                      return False

                  with open(path, "wb") as f:

                      for chunk in r.iter_content(8192):
                          f.write(chunk)

                  im = Image.open(path)
                  im.verify()

                  return True

              except Exception as e:
                  print("Image error:", e)
                  return False


          # --------------------------------------------------
          # Search another article to supplement information
          # --------------------------------------------------

          def enrich_game(game_title):

              print("補完検索:", game_title)

              queries = [
                  f'"{game_title}" 発売日 対応機種',
                  f'"{game_title}" PS5 Switch PC',
                  f'"{game_title}" Steam Switch PS5',
              ]

              combined_text = ""
              extra_image = ""

              for query in queries:

                  entries = google_news(query)

                  for entry in entries[:5]:

                      rss_title = html.unescape(
                          entry.get("title", "")
                      )

                      rss_desc = html.unescape(
                          entry.get("summary", "")
                      )

                      combined_text += (
                          " " +
                          rss_title +
                          " " +
                          rss_desc
                      )

                      link = entry.get("link", "")

                      if link and not extra_image:

                          _, body, image = fetch_article(
                              link
                          )

                          combined_text += " " + body

                          if image:
                              extra_image = image

                      if (
                          extract_release_date(combined_text)
                          and
                          extract_platforms(combined_text)
                      ):
                          break

                  if (
                      extract_release_date(combined_text)
                      and
                      extract_platforms(combined_text)
                  ):
                      break

              return combined_text, extra_image


          # --------------------------------------------------
          # Create text
          # --------------------------------------------------

          def font(size):

              candidates = [
                  "/usr/share/fonts/opentype/noto/"
                  "NotoSansCJK-Regular.ttc",
                  "/usr/share/fonts/opentype/noto/"
                  "NotoSansCJK-Bold.ttc",
              ]

              for p in candidates:

                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)

              return ImageFont.load_default()


          FONT_BIG = font(92)
          FONT_MED = font(62)
          FONT_SMALL = font(48)


          def wrap_text(draw, text, font_obj, max_width):

              chars = list(text)

              lines = []
              current = ""

              for ch in chars:

                  test = current + ch

                  bbox = draw.textbbox(
                      (0, 0),
                      test,
                      font=font_obj
                  )

                  if bbox[2] - bbox[0] > max_width:

                      if current:
                          lines.append(current)

                      current = ch

                  else:
                      current = test

              if current:
                  lines.append(current)

              return lines


          def make_scene(
              path,
              image_path,
              headline,
              subtitle,
              footer
          ):

              W = 1080
              H = 1920

              canvas = Image.new(
                  "RGB",
                  (W, H),
                  "black"
              )

              # --------------------------------------------
              # image
              # --------------------------------------------

              if image_path:

                  try:

                      img = Image.open(
                          image_path
                      ).convert("RGB")

                      iw, ih = img.size

                      scale = max(
                          W / iw,
                          1050 / ih
                      )

                      nw = int(iw * scale)
                      nh = int(ih * scale)

                      img = img.resize(
                          (nw, nh),
                          Image.LANCZOS
                      )

                      left = (nw - W) // 2
                      top = (nh - 1050) // 2

                      img = img.crop(
                          (
                              left,
                              top,
                              left + W,
                              top + 1050
                          )
                      )

                      canvas.paste(
                          img,
                          (0, 0)
                      )

                  except:
                      pass


              draw = ImageDraw.Draw(canvas)

              # --------------------------------------------
              # dark lower area
              # --------------------------------------------

              draw.rectangle(
                  (0, 980, W, H),
                  fill=(0, 0, 0)
              )

              # --------------------------------------------
              # headline
              # --------------------------------------------

              y = 1080

              lines = wrap_text(
                  draw,
                  headline,
                  FONT_BIG,
                  960
              )

              for line in lines[:3]:

                  draw.text(
                      (60, y),
                      line,
                      font=FONT_BIG,
                      fill="white",
                      stroke_width=4,
                      stroke_fill="black"
                  )

                  y += 110


              # --------------------------------------------
              # subtitle
              # --------------------------------------------

              lines = wrap_text(
                  draw,
                  subtitle,
                  FONT_MED,
                  960
              )

              for line in lines[:3]:

                  draw.text(
                      (60, y + 20),
                      line,
                      font=FONT_MED,
                      fill="white",
                      stroke_width=3,
                      stroke_fill="black"
                  )

                  y += 75


              # --------------------------------------------
              # footer
              # --------------------------------------------

              draw.text(
                  (60, 1810),
                  footer,
                  font=FONT_SMALL,
                  fill="white",
                  stroke_width=2,
                  stroke_fill="black"
              )

              canvas.save(path)


          # --------------------------------------------------
          # Create MP4
          # --------------------------------------------------

          def make_video(data):

              image_path = data["image"]

              scene_paths = []

              scenes = [
                  (
                      data["game"],
                      "新作ゲームニュース",
                      "GAME RADAR"
                  ),
                  (
                      data["game"],
                      "発売日：" + data["release"],
                      "発売日をチェック"
                  ),
                  (
                      data["game"],
                      "注目ニュースをチェック",
                      "ゲームニュース"
                  ),
                  (
                      data["game"],
                      "対応機種：" +
                      " / ".join(data["platforms"]),
                      "PS5 / Switch / PC など"
                  ),
                  (
                      data["game"],
                      "発売日：" + data["release"],
                      "フォローして最新ゲーム情報をチェック！"
                  ),
              ]

              for i, scene in enumerate(scenes):

                  p = os.path.join(
                      OUT_DIR,
                      f"scene_{i}.png"
                  )

                  make_scene(
                      p,
                      image_path,
                      scene[0],
                      scene[1],
                      scene[2]
                  )

                  scene_paths.append(p)


              concat = os.path.join(
                  OUT_DIR,
                  "concat.txt"
              )

              with open(
                  concat,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for p in scene_paths:
                      f.write(
                          f"file '{os.path.abspath(p)}'\n"
                      )
                      f.write("duration 3\n")

                  # concat demuxerの最後のフレーム用
                  f.write(
                      f"file '{os.path.abspath(scene_paths[-1])}'\n"
                  )


              output = os.path.join(
                  OUT_DIR,
                  "game_radar.mp4"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  concat,
                  "-vf",
                  "scale=1080:1920:force_original_aspect_ratio=decrease,"
                  "pad=1080:1920:(ow-iw)/2:(oh-ih)/2",
                  "-r",
                  "30",
                  "-c:v",
                  "libx264",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  output
              ]

              subprocess.run(
                  cmd,
                  check=True
              )

              return output


          # --------------------------------------------------
          # Main
          # --------------------------------------------------

          print("====================================")
          print("GAME RADAR START")
          print("====================================")

          candidates = []
          seen = set()

          for query in QUERIES:

              print("RSS:", query)

              entries = google_news(query)

              print(
                  "取得:",
                  len(entries)
              )

              for entry in entries:

                  link = entry.get("link", "")

                  if not link:
                      continue

                  if link in seen:
                      continue

                  seen.add(link)

                  title = html.unescape(
                      entry.get("title", "")
                  )

                  summary = html.unescape(
                      entry.get("summary", "")
                  )

                  candidates.append({
                      "title": title,
                      "summary": summary,
                      "link": link
                  })


          print(
              "候補総数:",
              len(candidates)
          )


          # --------------------------------------------------
          # Evaluate candidates
          # --------------------------------------------------

          selected = None

          for index, candidate in enumerate(
              candidates[:50],
              1
          ):

              print("")
              print(
                  "------------------------------------"
              )

              print(
                  f"候補 {index}:",
                  candidate["title"]
              )

              article_title, body, image = fetch_article(
                  candidate["link"]
              )

              base_text = (
                  candidate["title"] +
                  " " +
                  candidate["summary"] +
                  " " +
                  article_title +
                  " " +
                  body
              )

              game = extract_game_title(
                  candidate["title"],
                  base_text
              )

              release = extract_release_date(
                  base_text
              )

              platforms = extract_platforms(
                  base_text
              )

              print("ゲーム:", game)
              print("発売日:", release)
              print("対応機種:", platforms)

              # --------------------------------------------
              # 足りない情報を別ニュースで補完
              # --------------------------------------------

              if not release or not platforms:

                  extra_text, extra_image = enrich_game(
                      game
                  )

                  base_text += " " + extra_text

                  if not image:
                      image = extra_image

                  release = (
                      release or
                      extract_release_date(base_text)
                  )

                  platforms = extract_platforms(
                      base_text
                  )

                  print("補完後発売日:", release)
                  print("補完後対応機種:", platforms)


              # --------------------------------------------
              # image
              # --------------------------------------------

              image_path = os.path.join(
                  OUT_DIR,
                  "game.jpg"
              )

              image_ok = download_image(
                  image,
                  image_path
              )

              print(
                  "画像:",
                  "OK" if image_ok else "NG"
              )


              # --------------------------------------------
              # Final condition
              # --------------------------------------------

              if not release:
                  print("除外：発売日なし")
                  continue

              if not platforms:
                  print("除外：対応機種なし")
                  continue

              if not image_ok:
                  print("除外：画像なし")
                  continue

              # ゲームらしい記事だけ
              game_words = [
                  "ゲーム",
                  "発売",
                  "リリース",
                  "配信",
                  "Steam",
                  "PS5",
                  "Switch",
                  "Xbox",
                  "アプリ",
                  "PlayStation"
              ]

              if not any(
                  w in base_text
                  for w in game_words
              ):
                  print("除外：ゲーム記事として弱い")
                  continue


              selected = {
                  "game": game,
                  "release": release,
                  "platforms": platforms[:5],
                  "image": image_path,
                  "source": candidate["link"],
                  "title": candidate["title"]
              }

              print("")
              print("====================================")
              print("採用ニュース")
              print("ゲーム:", game)
              print("発売日:", release)
              print(
                  "対応機種:",
                  ", ".join(platforms)
              )
              print("====================================")

              break


          # --------------------------------------------------
          # No candidate
          # --------------------------------------------------

          if not selected:

              print("")
              print("====================================")
              print("条件を満たすニュースがありません")
              print("動画は生成しません")
              print("====================================")

              raise SystemExit(0)


          # --------------------------------------------------
          # Create video
          # --------------------------------------------------

          video = make_video(
              selected
          )

          print("")
          print("動画生成完了:", video)


          # --------------------------------------------------
          # Source information
          # --------------------------------------------------

          with open(
              os.path.join(
                  OUT_DIR,
                  "source.txt"
              ),
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "GAME RADAR\n\n"
              )

              f.write(
                  "ゲーム: " +
                  selected["game"] +
                  "\n"
              )

              f.write(
                  "発売日: " +
                  selected["release"] +
                  "\n"
              )

              f.write(
                  "対応機種: " +
                  ", ".join(
                      selected["platforms"]
                  ) +
                  "\n"
              )

              f.write(
                  "記事タイトル: " +
                  selected["title"] +
                  "\n"
              )

              f.write(
                  "Source: " +
                  selected["source"] +
                  "\n"
              )

          print("source.txt 作成完了")

          PY

          python make_video.py

      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: game-radar-video
          path: output/
          if-no-files-found: ignore
