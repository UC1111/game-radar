name: Auto Game News TikTok

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow feedparser

      # ---------------------------------------------
      # VOICEVOX
      # ---------------------------------------------
      - name: Start VOICEVOX
        run: |
          docker run -d \
            --name voicevox \
            -p 50021:50021 \
            voicevox/voicevox_engine:cpu-latest

          echo "Waiting for VOICEVOX..."

          for i in {1..60}; do
            if curl -sf http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX READY"
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:50021/version || exit 1

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import os
          import re
          import io
          import hashlib
          import subprocess
          from datetime import datetime
          from urllib.parse import quote, urljoin

          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageOps


          # =========================================================
          # SETTINGS
          # =========================================================

          OUT = "output"
          DEBUG_DIR = os.path.join(OUT, "debug")
          AUDIO_DIR = os.path.join(OUT, "audio")

          os.makedirs(OUT, exist_ok=True)
          os.makedirs(DEBUG_DIR, exist_ok=True)
          os.makedirs(AUDIO_DIR, exist_ok=True)

          MIN_IMAGES = 3
          MAX_CANDIDATES = 25

          VOICEVOX = "http://127.0.0.1:50021"

          # VOICEVOX speaker
          # 3 = ずんだもん ノーマル
          SPEAKER = 3

          LOG = []


          def log(x=""):
              print(x)
              LOG.append(str(x))


          def save_diagnostic():
              with open(
                  os.path.join(OUT, "diagnostic.txt"),
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write("\n".join(LOG))


          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "Chrome/139 Safari/537.36"
          })


          print("=" * 50)
          print("GAME NEWS RADAR START")
          print("=" * 50)


          # =========================================================
          # FONT
          # =========================================================

          FONT_PATHS = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
          ]


          def get_font(size):
              for path in FONT_PATHS:
                  if os.path.exists(path):
                      try:
                          return ImageFont.truetype(path, size)
                      except:
                          pass

              return ImageFont.load_default()


          # =========================================================
          # HTTP
          # =========================================================

          def get_url(url, timeout=15):
              try:
                  r = session.get(url, timeout=timeout)

                  if r.status_code == 200:
                      return r

              except Exception as e:
                  log(f"HTTP ERROR: {url} / {e}")

              return None


          # =========================================================
          # GOOGLE NEWS
          # =========================================================

          NEWS_QUERIES = [
              "新作ゲーム 発売日",
              "新作ゲーム 発売決定",
              "ゲーム 正式リリース",
              "ゲーム アーリーアクセス",
              "ゲーム PS5 Switch PC",
              "ゲーム Switch2",
              "ゲーム Steam",
              "新作ゲーム 2026",
              "新作ゲーム 2027",
          ]


          def google_news(query):

              url = (
                  "https://news.google.com/rss/search?"
                  + "q=" + quote(query)
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

              try:
                  r = get_url(url)

                  if not r:
                      return []

                  feed = feedparser.parse(r.content)

                  result = []

                  for item in feed.entries:

                      result.append({
                          "title": item.get("title", ""),
                          "link": item.get("link", ""),
                          "summary": BeautifulSoup(
                              item.get("summary", ""),
                              "html.parser"
                          ).get_text(" ", strip=True),
                          "published": item.get("published", "")
                      })

                  return result

              except Exception as e:
                  log(f"NEWS ERROR: {e}")
                  return []


          # =========================================================
          # GAME NAME
          # =========================================================

          def clean_game_name(name):

              name = re.sub(r"\s+", " ", name).strip()

              name = re.sub(
                  r"が\d{1,2}月\d{1,2}日.*$",
                  "",
                  name
              )

              name = re.sub(
                  r"は\d{1,2}月\d{1,2}日.*$",
                  "",
                  name
              )

              name = re.sub(
                  r"。.*$",
                  "",
                  name
              )

              return name.strip(
                  "『』「」【】 "
              )[:100]


          def extract_game(title):

              m = re.search(
                  r"『([^』]{2,80})』",
                  title
              )

              if m:
                  return clean_game_name(m.group(1))

              m = re.search(
                  r"「([^」]{2,80})」",
                  title
              )

              if m:
                  return clean_game_name(m.group(1))

              m = re.search(
                  r"\b([A-Z][A-Za-z0-9]+"
                  r"(?:\s+[A-Z][A-Za-z0-9]+){0,5})\b",
                  title
              )

              if m:
                  return clean_game_name(m.group(1))

              s = re.split(
                  r"[。|｜]",
                  title
              )[0]

              s = re.sub(
                  r"^(ゲーム|新作ゲーム|【[^】]+】)",
                  "",
                  s
              )

              return clean_game_name(s)


          # =========================================================
          # RELEASE DATE
          # =========================================================

          def normalize_date(y, m, d):

              try:
                  return (
                      f"{int(y):04d}/"
                      f"{int(m):02d}/"
                      f"{int(d):02d}"
                  )
              except:
                  return None


          def extract_release(
              text,
              published=""
          ):

              text = text.replace(
                  "（", "("
              ).replace(
                  "）", ")"
              )

              patterns = [
                  r"(20\d{2})[/-](\d{1,2})[/-](\d{1,2})",
                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日?"
              ]

              for pattern in patterns:

                  m = re.search(
                      pattern,
                      text
                  )

                  if m:
                      return normalize_date(
                          *m.groups()
                      )

              m = re.search(
                  r"(?<!\d)(\d{1,2})月\s*(\d{1,2})日",
                  text
              )

              if m:

                  year = datetime.now().year

                  month = int(m.group(1))
                  day = int(m.group(2))

                  if month < datetime.now().month - 2:
                      year += 1

                  return normalize_date(
                      year,
                      month,
                      day
                  )

              m = re.search(
                  r"(?<!\d)(\d{1,2})/(\d{1,2})(?!\d)",
                  text
              )

              if m:

                  return normalize_date(
                      datetime.now().year,
                      m.group(1),
                      m.group(2)
                  )

              if re.search(
                  r"(本日|今日).*(発売|配信|開始|リリース)",
                  text
              ):
                  return datetime.now().strftime(
                      "%Y/%m/%d"
                  )

              if published:

                  try:

                      dt = feedparser._parse_date(
                          published
                      )

                      if dt:
                          return (
                              f"{dt.tm_year:04d}/"
                              f"{dt.tm_mon:02d}/"
                              f"{dt.tm_mday:02d}"
                          )

                  except:
                      pass

              return None


          # =========================================================
          # PLATFORM
          # =========================================================

          PLATFORM_PATTERNS = [

              (r"PS5|PlayStation\s*5", "PS5"),

              (r"PS4|PlayStation\s*4", "PS4"),

              (
                  r"Switch\s*2|Nintendo\s*Switch\s*2",
                  "Switch 2"
              ),

              (
                  r"Nintendo\s*Switch|"
                  r"(?<![A-Za-z])Switch(?![A-Za-z])",
                  "Switch"
              ),

              (
                  r"Xbox\s*Series\s*X\|S",
                  "Xbox Series X|S"
              ),

              (r"Xbox", "Xbox"),

              (
                  r"Steam|"
                  r"(?<![A-Za-z])PC(?![A-Za-z])|"
                  r"Windows",
                  "PC"
              ),

              (r"iOS", "iOS"),

              (r"Android", "Android"),
          ]


          def extract_platforms(text):

              result = []

              for pattern, name in PLATFORM_PATTERNS:

                  if re.search(
                      pattern,
                      text,
                      re.I
                  ):

                      if name not in result:
                          result.append(name)

              return result


          # =========================================================
          # ARTICLE
          # =========================================================

          def parse_article(url):

              r = get_url(url)

              if not r:
                  return {
                      "text": "",
                      "images": [],
                      "title": ""
                  }

              try:

                  soup = BeautifulSoup(
                      r.text,
                      "html.parser"
                  )

                  for tag in soup(
                      ["script", "style",
                       "noscript", "svg"]
                  ):
                      tag.decompose()

                  text = soup.get_text(
                      " ",
                      strip=True
                  )

                  title = ""

                  if soup.title:
                      title = soup.title.get_text(
                          " ",
                          strip=True
                      )

                  images = []

                  # OG images
                  for meta in soup.find_all("meta"):

                      prop = (
                          meta.get("property")
                          or meta.get("name")
                          or ""
                      ).lower()

                      if prop in [
                          "og:image",
                          "twitter:image",
                          "twitter:image:src"
                      ]:

                          content = meta.get(
                              "content"
                          )

                          if content:
                              images.append(
                                  urljoin(
                                      url,
                                      content
                                  )
                              )

                  # img
                  for img in soup.find_all("img"):

                      for attr in [
                          "src",
                          "data-src",
                          "data-original"
                      ]:

                          src = img.get(attr)

                          if src:
                              images.append(
                                  urljoin(
                                      url,
                                      src
                                  )
                              )

                      srcset = img.get(
                          "srcset"
                      )

                      if srcset:

                          for part in srcset.split(","):

                              src = (
                                  part.strip()
                                  .split(" ")[0]
                              )

                              if src:
                                  images.append(
                                      urljoin(
                                          url,
                                          src
                                      )
                                  )

                  unique = []
                  seen = set()

                  for image in images:

                      if image and image not in seen:

                          seen.add(image)
                          unique.append(image)

                  return {
                      "text": text,
                      "images": unique[:40],
                      "title": title
                  }

              except Exception as e:

                  log(
                      f"ARTICLE ERROR: {e}"
                  )

                  return {
                      "text": "",
                      "images": [],
                      "title": ""
                  }


          # =========================================================
          # STEAM
          # =========================================================

          def steam_images(game):

              log(
                  f"STEAM SEARCH: {game}"
              )

              result = []

              try:

                  url = (
                      "https://store.steampowered.com/"
                      "api/storesearch/?term="
                      + quote(game)
                      + "&l=japanese&cc=jp"
                  )

                  r = get_url(url)

                  if not r:
                      return []

                  items = r.json().get(
                      "items",
                      []
                  )

                  for item in items[:3]:

                      appid = item.get(
                          "id"
                      )

                      if not appid:
                          continue

                      detail_url = (
                          "https://store.steampowered.com/"
                          "api/appdetails?"
                          f"appids={appid}&l=japanese&cc=jp"
                      )

                      rr = get_url(
                          detail_url
                      )

                      if not rr:
                          continue

                      detail = rr.json().get(
                          str(appid),
                          {}
                      )

                      if not detail.get(
                          "success"
                      ):
                          continue

                      data = detail.get(
                          "data",
                          {}
                      )

                      name = data.get(
                          "name",
                          ""
                      )

                      if (
                          game.lower()
                          not in name.lower()
                          and
                          name.lower()
                          not in game.lower()
                      ):
                          continue

                      if data.get(
                          "header_image"
                      ):
                          result.append(
                              data["header_image"]
                          )

                      for shot in data.get(
                          "screenshots",
                          []
                      ):

                          path = shot.get(
                              "path_full"
                          )

                          if path:
                              result.append(
                                  path
                              )

                      if result:
                          break

              except Exception as e:

                  log(
                      f"STEAM ERROR: {e}"
                  )

              return result


          # =========================================================
          # BING IMAGES
          # =========================================================

          def bing_images(game):

              log(
                  f"BING IMAGE SEARCH: {game}"
              )

              result = []

              try:

                  url = (
                      "https://www.bing.com/images/search?q="
                      + quote(
                          game
                          + " game screenshot"
                      )
                  )

                  r = get_url(url)

                  if not r:
                      return []

                  matches = re.findall(
                      r'"murl":"(https?://[^"]+)"',
                      r.text
                  )

                  for x in matches:

                      x = x.replace(
                          "\\/",
                          "/"
                      )

                      if x not in result:
                          result.append(x)

                      if len(result) >= 20:
                          break

              except Exception as e:

                  log(
                      f"BING ERROR: {e}"
                  )

              return result


          # =========================================================
          # RELATED NEWS
          # =========================================================

          def related_article_images(game):

              result = []

              items = google_news(
                  f'"{game}"'
              )

              for item in items[:8]:

                  article = parse_article(
                      item.get(
                          "link",
                          ""
                      )
                  )

                  for image in article[
                      "images"
                  ]:

                      if image not in result:
                          result.append(image)

                      if len(result) >= 20:
                          return result

              return result


          # =========================================================
          # IMAGE DOWNLOAD / CHECK
          # =========================================================

          def download_image(
              url,
              index
          ):

              try:

                  r = session.get(
                      url,
                      timeout=15
                  )

                  if r.status_code != 200:
                      return None

                  if (
                      "image"
                      not in
                      r.headers.get(
                          "Content-Type",
                          ""
                      ).lower()
                  ):
                      return None

                  if len(r.content) < 10000:
                      return None

                  im = Image.open(
                      io.BytesIO(
                          r.content
                      )
                  )

                  im.load()

                  w, h = im.size

                  if w < 500 or h < 300:
                      return None

                  ratio = w / h

                  if (
                      ratio > 4.5
                      or
                      ratio < 0.45
                  ):
                      return None

                  # 単色画像除外
                  thumb = (
                      im.convert("RGB")
                      .resize((32, 32))
                  )

                  pixels = list(
                      thumb.getdata()
                  )

                  avg = [
                      sum(
                          p[c]
                          for p in pixels
                      ) / len(pixels)
                      for c in range(3)
                  ]

                  variance = 0

                  for p in pixels:

                      variance += sum(
                          (
                              p[c] - avg[c]
                          ) ** 2
                          for c in range(3)
                      )

                  variance /= len(pixels)

                  if variance < 150:
                      return None

                  path = os.path.join(
                      DEBUG_DIR,
                      f"candidate_{index:02d}.jpg"
                  )

                  im = ImageOps.exif_transpose(
                      im
                  )

                  im.convert(
                      "RGB"
                  ).save(
                      path,
                      "JPEG",
                      quality=92
                  )

                  return path

              except:
                  return None


          def collect_images(
              game,
              article_images
          ):

              log("")
              log(
                  "========== IMAGE TEST =========="
              )

              urls = []

              sources = [
                  ("ARTICLE", article_images),
                  ("STEAM", steam_images(game)),
                  (
                      "RELATED",
                      related_article_images(game)
                  ),
                  ("BING", bing_images(game))
              ]

              for source, arr in sources:

                  log(
                      f"IMAGE SOURCE: "
                      f"{source} / {len(arr)}"
                  )

                  for url in arr:

                      if (
                          url
                          and
                          url not in urls
                      ):
                          urls.append(url)

              selected = []
              hashes = set()

              for i, url in enumerate(
                  urls[:80],
                  1
              ):

                  path = download_image(
                      url,
                      i
                  )

                  if not path:
                      continue

                  try:

                      with open(
                          path,
                          "rb"
                      ) as f:
                          h = hashlib.md5(
                              f.read()
                          ).hexdigest()

                      if h in hashes:

                          os.remove(path)

                          continue

                      hashes.add(h)

                  except:
                      pass

                  selected.append(path)

                  log(
                      f"IMAGE {i}: OK"
                  )

                  if len(selected) >= MIN_IMAGES:
                      break

              log(
                  f"SELECTED IMAGES: "
                  f"{len(selected)}"
              )

              return selected


          # =========================================================
          # NEWS SCRIPT
          # =========================================================

          def make_script(
              game,
              release,
              platforms,
              title,
              summary
          ):

              if release:

                  try:
                      y, m, d = release.split("/")

                      release_text = (
                          f"{int(m)}月"
                          f"{int(d)}日"
                      )

                  except:

                      release_text = (
                          "発売日未定"
                      )

              else:

                  release_text = (
                      "発売日未定"
                  )

              game = game[:30]

              platform_text = (
                  "・".join(
                      platforms[:3]
                  )
                  if platforms
                  else
                  "対応機種は今後発表"
              )

              # タイトルからニュースの特徴を作る
              raw = (
                  title
                  + " "
                  + summary
              )

              raw = re.sub(
                  r"https?://\S+",
                  "",
                  raw
              )

              # 長すぎるニュース本文を適度に圧縮
              raw = raw.strip()

              if len(raw) > 65:
                  raw = raw[:65]

              scripts = [

                  f"注目の新作、{game}。",

                  f"{release_text}に発売・配信予定です。",

                  raw if raw else
                  "新たな情報が公開されました。",

                  f"対応機種は{platform_text}。",

                  "気になる新作は保存しておいて！"

              ]

              return scripts


          # =========================================================
          # VOICEVOX
          # =========================================================

          def make_voice(
              text,
              index
          ):

              try:

                  q = requests.post(
                      VOICEVOX
                      + "/audio_query",
                      params={
                          "text": text,
                          "speaker": SPEAKER
                      },
                      timeout=30
                  )

                  if q.status_code != 200:

                      log(
                          "VOICE QUERY ERROR "
                          + str(q.status_code)
                      )

                      return None

                  query = q.json()

                  # 少しテンポを上げる
                  query[
                      "speedScale"
                  ] = 1.10

                  query[
                      "intonationScale"
                  ] = 1.05

                  a = requests.post(
                      VOICEVOX
                      + "/synthesis",
                      params={
                          "speaker": SPEAKER
                      },
                      json=query,
                      timeout=60
                  )

                  if a.status_code != 200:

                      log(
                          "VOICE SYNTH ERROR "
                          + str(a.status_code)
                      )

                      return None

                  path = os.path.join(
                      AUDIO_DIR,
                      f"voice_{index}.wav"
                  )

                  with open(
                      path,
                      "wb"
                  ) as f:
                      f.write(a.content)

                  return path

              except Exception as e:

                  log(
                      f"VOICE ERROR: {e}"
                  )

                  return None


          # =========================================================
          # BGM
          # =========================================================

          def make_bgm():

              output = os.path.join(
                  AUDIO_DIR,
                  "bgm.wav"
              )

              # 外部素材ではなくFFmpegで簡易BGMを生成
              # 低音量なのでナレーションを邪魔しない
              filter_complex = (
                  "aevalsrc="
                  "0.055*sin(2*PI*220*t)"
                  "+0.035*sin(2*PI*329.63*t)"
                  "+0.025*sin(2*PI*440*t)"
                  "+0.018*sin(2*PI*554.37*t)"
                  ":s=44100:d=15,"
                  "tremolo=f=2:d=0.25,"
                  "lowpass=f=1800,"
                  "volume=0.55"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  filter_complex,
                  "-t",
                  "15",
                  "-ar",
                  "44100",
                  "-ac",
                  "2",
                  output
              ]

              p = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True
              )

              if p.returncode != 0:

                  log(
                      "BGM ERROR"
                  )

                  log(
                      p.stderr[-2000:]
                  )

                  return None

              return output


          # =========================================================
          # VIDEO DESIGN
          # =========================================================

          def fit_vertical(im):

              return ImageOps.fit(
                  im,
                  (1080, 1920),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5)
              )


          def draw_center(
              draw,
              text,
              y,
              font,
              max_width=980
          ):

              lines = []
              current = ""

              for ch in text:

                  test = current + ch

                  box = draw.textbbox(
                      (0, 0),
                      test,
                      font=font
                  )

                  if (
                      box[2] > max_width
                      and current
                  ):

                      lines.append(
                          current
                      )

                      current = ch

                  else:

                      current = test

              if current:
                  lines.append(
                      current
                  )

              line_height = (
                  font.size + 12
              )

              for line in lines[:3]:

                  box = draw.textbbox(
                      (0, 0),
                      line,
                      font=font,
                      stroke_width=3
                  )

                  width = (
                      box[2] - box[0]
                  )

                  x = (
                      1080 - width
                  ) // 2

                  # 黒フチ
                  draw.text(
                      (x, y),
                      line,
                      font=font,
                      fill="white",
                      stroke_width=7,
                      stroke_fill="black"
                  )

                  y += line_height

              return y


          def make_frame(
              image_path,
              game,
              release,
              platforms,
              script,
              index
          ):

              im = Image.open(
                  image_path
              ).convert("RGB")

              im = fit_vertical(im)

              # シーンごとに微妙にズーム
              zoom = (
                  1.02
                  + index * 0.012
              )

              im = im.resize(
                  (
                      int(1080 * zoom),
                      int(1920 * zoom)
                  ),
                  Image.Resampling.LANCZOS
              )

              left = (
                  im.width - 1080
              ) // 2

              top = (
                  im.height - 1920
              ) // 2

              im = im.crop(
                  (
                      left,
                      top,
                      left + 1080,
                      top + 1920
                  )
              )

              draw = ImageDraw.Draw(im)

              font_title = get_font(72)
              font_big = get_font(88)
              font_mid = get_font(60)
              font_sub = get_font(48)

              # 上部の黒帯
              draw.rectangle(
                  (0, 0, 1080, 230),
                  fill=(0, 0, 0)
              )

              # 下部字幕帯
              draw.rectangle(
                  (0, 1500, 1080, 1920),
                  fill=(0, 0, 0)
              )

              if index == 0:

                  draw_center(
                      draw,
                      "🎮 新作ゲームNEWS",
                      35,
                      font_title
                  )

                  draw_center(
                      draw,
                      game,
                      105,
                      font_big
                  )

                  draw_center(
                      draw,
                      script[index],
                      1560,
                      font_sub
                  )

              elif index == 1:

                  draw_center(
                      draw,
                      "🔥 発売・配信日",
                      40,
                      font_title
                  )

                  draw_center(
                      draw,
                      (
                          f"{release}"
                          if release
                          else
                          "発売日未定"
                      ),
                      105,
                      font_big
                  )

                  draw_center(
                      draw,
                      script[index],
                      1570,
                      font_sub
                  )

              elif index == 2:

                  draw_center(
                      draw,
                      "👀 注目ポイント",
                      45,
                      font_title
                  )

                  draw_center(
                      draw,
                      script[index],
                      1540,
                      font_sub
                  )

              elif index == 3:

                  draw_center(
                      draw,
                      "🎮 対応機種",
                      45,
                      font_title
                  )

                  draw_center(
                      draw,
                      (
                          " / ".join(
                              platforms[:4]
                          )
                          if platforms
                          else
                          "情報確認中"
                      ),
                      110,
                      font_mid
                  )

                  draw_center(
                      draw,
                      script[index],
                      1570,
                      font_sub
                  )

              else:

                  draw_center(
                      draw,
                      "保存して後でチェック！",
                      55,
                      font_title
                  )

                  draw_center(
                      draw,
                      script[index],
                      1570,
                      font_sub
                  )

              return im


          # =========================================================
          # VIDEO + AUDIO
          # =========================================================

          def make_video(
              game,
              release,
              platforms,
              images,
              script
          ):

              if len(images) < MIN_IMAGES:
                  return None

              log("")
              log(
                  "========== VIDEO =========="
              )

              # 5シーン
              frames = []

              for i in range(5):

                  frame = make_frame(
                      images[
                          i % len(images)
                      ],
                      game,
                      release,
                      platforms,
                      script,
                      i
                  )

                  path = os.path.join(
                      OUT,
                      f"scene_{i}.png"
                  )

                  frame.save(
                      path,
                      "PNG"
                  )

                  frames.append(
                      path
                  )

              # -----------------------------------------
              # VOICE
              # -----------------------------------------

              voices = []

              for i, text in enumerate(
                  script
              ):

                  log(
                      f"VOICE {i+1}: {text}"
                  )

                  wav = make_voice(
                      text,
                      i
                  )

                  if not wav:

                      log(
                          "VIDEO SKIP: "
                          "voice generation failed"
                      )

                      return None

                  voices.append(
                      wav
                  )

              # WAV連結
              voice_list = os.path.join(
                  AUDIO_DIR,
                  "voice_list.txt"
              )

              with open(
                  voice_list,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for wav in voices:

                      f.write(
                          f"file '{os.path.abspath(wav)}'\n"
                      )

              voice_all = os.path.join(
                  AUDIO_DIR,
                  "voice_all.wav"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  voice_list,
                  "-c:a",
                  "pcm_s16le",
                  voice_all
              ]

              p = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True
              )

              if p.returncode != 0:

                  log(
                      "VOICE CONCAT ERROR"
                  )

                  log(
                      p.stderr[-3000:]
                  )

                  return None

              # -----------------------------------------
              # BGM
              # -----------------------------------------

              bgm = make_bgm()

              if not bgm:
                  return None

              # -----------------------------------------
              # VIDEO
              # -----------------------------------------

              concat = os.path.join(
                  OUT,
                  "concat.txt"
              )

              with open(
                  concat,
                  "w",
                  encoding="utf-8"
              ) as f:

                  for frame in frames:

                      f.write(
                          f"file '{os.path.abspath(frame)}'\n"
                      )

                      f.write(
                          "duration 3\n"
                      )

                  f.write(
                      f"file '{os.path.abspath(frames[-1])}'\n"
                  )

              silent = os.path.join(
                  OUT,
                  "silent.mp4"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  concat,
                  "-vf",
                  "format=yuv420p",
                  "-r",
                  "30",
                  "-t",
                  "15",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "19",
                  "-movflags",
                  "+faststart",
                  silent
              ]

              p = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True
              )

              if p.returncode != 0:

                  log(
                      "VIDEO ERROR"
                  )

                  log(
                      p.stderr[-4000:]
                  )

                  return None

              # -----------------------------------------
              # MIX
              # -----------------------------------------

              output = os.path.join(
                  OUT,
                  "game_news_tiktok.mp4"
              )

              cmd = [
                  "ffmpeg",
                  "-y",

                  "-i",
                  silent,

                  "-i",
                  voice_all,

                  "-i",
                  bgm,

                  "-filter_complex",

                  # ナレーションを大きく
                  "[1:a]"
                  "volume=1.35,"
                  "apad,"
                  "atrim=0:15"
                  "[voice];"

                  # BGMはかなり小さく
                  "[2:a]"
                  "volume=0.075,"
                  "atrim=0:15"
                  "[bgm];"

                  # ミックス
                  "[voice][bgm]"
                  "amix=inputs=2:"
                  "duration=longest:"
                  "dropout_transition=0,"
                  "loudnorm="
                  "I=-14:"
                  "TP=-1.5:"
                  "LRA=11"
                  "[audio]",

                  "-map",
                  "0:v",

                  "-map",
                  "[audio]",

                  "-t",
                  "15",

                  "-c:v",
                  "copy",

                  "-c:a",
                  "aac",

                  "-b:a",
                  "192k",

                  "-movflags",
                  "+faststart",

                  output
              ]

              p = subprocess.run(
                  cmd,
                  capture_output=True,
                  text=True
              )

              if p.returncode != 0:

                  log(
                      "AUDIO MIX ERROR"
                  )

                  log(
                      p.stderr[-5000:]
                  )

                  return None

              if not os.path.exists(
                  output
              ):
                  return None

              size = (
                  os.path.getsize(output)
                  / 1024
                  / 1024
              )

              log(
                  f"VIDEO GENERATED: "
                  f"{output} "
                  f"({size:.2f} MB)"
              )

              return output


          # =========================================================
          # COLLECT NEWS
          # =========================================================

          all_news = []
          seen_titles = set()

          for query in NEWS_QUERIES:

              log(
                  f"NEWS: {query}"
              )

              for item in google_news(
                  query
              ):

                  title = item.get(
                      "title",
                      ""
                  ).strip()

                  if (
                      title
                      and
                      title not in seen_titles
                  ):

                      seen_titles.add(
                          title
                      )

                      all_news.append(
                          item
                      )

          log("")
          log(
              f"ニュース候補: "
              f"{len(all_news)}"
          )


          # =========================================================
          # FILTER
          # =========================================================

          EXCLUDE_WORDS = [
              "攻略",
              "レビュー",
              "中古",
              "セール",
              "予約受付終了",
              "イベントレポート",
              "大会",
              "配信終了",
              "グッズ",
              "アケコン",
              "周辺機器",
              "フィギュア",
          ]


          def looks_like_game_news(
              title
          ):

              for word in EXCLUDE_WORDS:

                  if word in title:
                      return False

              keywords = [
                  "発売",
                  "配信",
                  "リリース",
                  "アーリーアクセス",
                  "制作決定",
                  "発表",
                  "新作",
                  "ゲーム",
              ]

              return any(
                  x in title
                  for x in keywords
              )


          # =========================================================
          # GENERATE
          # =========================================================

          generated = False

          for idx, item in enumerate(
              all_news[:MAX_CANDIDATES],
              1
          ):

              title = item.get(
                  "title",
                  ""
              )

              link = item.get(
                  "link",
                  ""
              )

              summary = item.get(
                  "summary",
                  ""
              )

              published = item.get(
                  "published",
                  ""
              )

              log("")
              log(
                  "-" * 50
              )

              log(
                  f"候補: {idx}"
              )

              log(
                  title
              )

              if not looks_like_game_news(
                  title
              ):

                  log(
                      "SKIP: not game news"
                  )

                  continue

              game = extract_game(
                  title
              )

              log(
                  f"GAME: {game}"
              )

              article = parse_article(
                  link
              )

              combined = (
                  title
                  + " "
                  + summary
                  + " "
                  + article["text"][:20000]
              )

              release = extract_release(
                  combined,
                  published
              )

              platforms = extract_platforms(
                  combined
              )

              # -----------------------------------------
              # RELEASE RETRY
              # -----------------------------------------

              if not release:

                  log(
                      "RELEASE RETRY"
                  )

                  related = google_news(
                      f'"{game}" 発売 配信'
                  )

                  for r in related[:8]:

                      text = (
                          r.get(
                              "title",
                              ""
                          )
                          + " "
                          + r.get(
                              "summary",
                              ""
                          )
                      )

                      date = extract_release(
                          text
                      )

                      if date:

                          release = date

                          log(
                              "RELEASE FOUND: "
                              + date
                          )

                          break

              # -----------------------------------------
              # PLATFORM RETRY
              # -----------------------------------------

              if not platforms:

                  log(
                      "PLATFORM RETRY"
                  )

                  related = google_news(
                      f'"{game}" '
                      f'PS5 Switch PC Steam Xbox'
                  )

                  for r in related[:8]:

                      text = (
                          r.get(
                              "title",
                              ""
                          )
                          + " "
                          + r.get(
                              "summary",
                              ""
                          )
                      )

                      for platform in extract_platforms(
                          text
                      ):

                          if (
                              platform
                              not in platforms
                          ):

                              platforms.append(
                                  platform
                              )

              log(
                  f"RELEASE: {release}"
              )

              log(
                  f"PLATFORM: {platforms}"
              )

              # -----------------------------------------
              # IMAGE
              # -----------------------------------------

              images = collect_images(
                  game,
                  article["images"]
              )

              if len(images) < MIN_IMAGES:

                  log(
                      "SKIP: insufficient images"
                  )

                  continue

              if not release:

                  release = (
                      "発売日未定"
                  )

              # -----------------------------------------
              # SCRIPT
              # -----------------------------------------

              script = make_script(
                  game,
                  release,
                  platforms,
                  title,
                  summary
              )

              log("")
              log(
                  "========== SCRIPT =========="
              )

              for i, text in enumerate(
                  script,
                  1
              ):

                  log(
                      f"{i}: {text}"
                  )

              # -----------------------------------------
              # VIDEO
              # -----------------------------------------

              video = make_video(
                  game,
                  release,
                  platforms,
                  images,
                  script
              )

              if video:

                  source = os.path.join(
                      OUT,
                      "source.txt"
                  )

                  with open(
                      source,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          "GAME NEWS RADAR\n\n"
                      )

                      f.write(
                          f"GAME: {game}\n"
                      )

                      f.write(
                          f"RELEASE: {release}\n"
                      )

                      f.write(
                          f"PLATFORM: {platforms}\n"
                      )

                      f.write(
                          f"NEWS: {title}\n"
                      )

                      f.write(
                          f"URL: {link}\n\n"
                      )

                      f.write(
                          "SCRIPT:\n"
                      )

                      for text in script:

                          f.write(
                              text + "\n"
                          )

                  log("")
                  log(
                      "=" * 50
                  )

                  log(
                      "SUCCESS"
                  )

                  log(
                      f"GAME: {game}"
                  )

                  log(
                      f"VIDEO: {video}"
                  )

                  log(
                      "=" * 50
                  )

                  generated = True

                  break


          if not generated:

              log("")
              log(
                  "=" * 50
              )

              log(
                  "動画生成なし"
              )

              log(
                  "条件を満たすニュース、"
                  "画像、音声が見つかりませんでした。"
              )

              log(
                  "=" * 50
              )


          save_diagnostic()

          PY

      - name: Run generator
        run: |
          python make_game_news.py

      - name: Show output
        if: always()
        run: |
          echo "================ OUTPUT ================"
          find output -maxdepth 3 -type f \
            -printf '%p %k KB\n' 2>/dev/null || true
          echo "========================================"

      - name: Upload diagnostic and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-news-result-${{ github.run_number }}
          path: |
            output/
            make_game_news.py
          if-no-files-found: warn
          retention-days: 7
