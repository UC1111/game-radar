name: Parent Game Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow feedparser

      - name: Start VOICEVOX
        run: |
          docker run -d \
            --name voicevox \
            -p 50021:50021 \
            voicevox/voicevox_engine:cpu-latest

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX ready"
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:50021/version

      - name: Create generator
        run: |
          cat > make_game_news.py <<'PY'
          import os
          import re
          import io
          import json
          import random
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          import requests
          import feedparser
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          OUT = Path("output")
          IMG = OUT / "images"
          SCENES = OUT / "scenes"

          OUT.mkdir(exist_ok=True)
          IMG.mkdir(exist_ok=True)
          SCENES.mkdir(exist_ok=True)

          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 Chrome/130 Safari/537.36"
          )

          session = requests.Session()
          session.headers.update({"User-Agent": UA})

          # ============================================================
          # 1. Google News
          # ============================================================

          QUERIES = [
              "ゲーム 親子 遊べる 新作",
              "ゲーム 家族 遊べる 新作",
              "ゲーム 親子 2人",
              "ゲーム 協力プレイ 新作",
              "Nintendo Switch 家族 ゲーム",
              "Switch 2 家族 ゲーム",
              "子ども ゲーム 新作",
              "ファミリーゲーム 新作",
          ]

          def rss_url(q):
              return (
                  "https://news.google.com/rss/search?q="
                  + quote(q)
                  + "&hl=ja&gl=JP&ceid=JP:ja"
              )

          articles = []
          seen = set()

          for q in QUERIES:
              try:
                  feed = feedparser.parse(rss_url(q))

                  for e in feed.entries:
                      link = e.get("link", "")
                      title = e.get("title", "").strip()

                      if not link or not title or link in seen:
                          continue

                      seen.add(link)

                      summary = BeautifulSoup(
                          e.get("summary", ""),
                          "html.parser"
                      ).get_text(" ", strip=True)

                      articles.append({
                          "title": title,
                          "summary": summary,
                          "link": link,
                          "published": e.get("published", "")
                      })

              except Exception as ex:
                  print("RSS ERROR:", ex)

          print("NEWS:", len(articles))

          # ============================================================
          # 2. Game title
          # ============================================================

          def game_title(text):
              patterns = [
                  r"『([^』]{2,80})』",
                  r"「([^」]{2,80})」",
                  r'"([^"]{2,80})"',
              ]

              for p in patterns:
                  m = re.search(p, text)

                  if m:
                      value = m.group(1).strip()

                      bad = [
                          "発売日",
                          "対応機種",
                          "予約",
                          "キャンペーン",
                          "イベント"
                      ]

                      if not any(x in value for x in bad):
                          return value

              text = re.sub(r"【[^】]+】", "", text)
              text = re.sub(r"\s+", " ", text)

              return text[:60].strip(" -｜|:：")

          # ============================================================
          # 3. Release date
          # ============================================================

          def release_date(text):

              patterns = [
                  r"(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日",
                  r"(20\d{2})[./-](\d{1,2})[./-](\d{1,2})",
                  r"(\d{1,2})月\s*(\d{1,2})日",
              ]

              for p in patterns:
                  m = re.search(p, text)

                  if not m:
                      continue

                  if len(m.groups()) == 3:
                      if len(m.group(1)) == 4:
                          return (
                              f"{m.group(1)}年"
                              f"{int(m.group(2))}月"
                              f"{int(m.group(3))}日"
                          )

                      return f"{int(m.group(1))}月{int(m.group(2))}日"

              if re.search(
                  r"本日|配信中|発売中|発売開始|配信開始",
                  text
              ):
                  return "発売・配信中"

              if "2026年" in text:
                  return "2026年予定"

              if "2027年" in text:
                  return "2027年予定"

              return "発売日未定"

          # ============================================================
          # 4. Platforms
          # ============================================================

          def platforms(text):

              rules = [
                  ("Switch 2", r"Switch\s*2|Nintendo Switch 2"),
                  ("Switch", r"Nintendo Switch(?!\s*2)|Switch"),
                  ("PS5", r"PS5|PlayStation\s*5"),
                  ("PS4", r"PS4|PlayStation\s*4"),
                  ("Xbox", r"Xbox"),
                  ("PC", r"Steam|PC版|Windows"),
                  ("スマホ", r"iOS|Android|App Store|Google Play"),
              ]

              result = []

              for name, pattern in rules:
                  if re.search(pattern, text, re.I):
                      if name not in result:
                          result.append(name)

              return result[:4]

          # ============================================================
          # 5. Family score
          # ============================================================

          POSITIVE = {
              "親子": 8,
              "家族": 7,
              "子ども": 6,
              "こども": 6,
              "キッズ": 6,
              "ファミリー": 6,
              "協力プレイ": 6,
              "協力": 4,
              "co-op": 6,
              "ローカルマルチ": 7,
              "マルチプレイ": 4,
              "2人": 4,
              "2人プレイ": 6,
              "4人": 5,
              "パーティー": 5,
              "パーティ": 5,
              "教育": 6,
              "学習": 6,
              "知育": 7,
              "料理": 3,
              "スポーツ": 3,
              "レース": 4,
              "音楽": 3,
              "リズム": 3,
              "クラフト": 3,
              "サンドボックス": 4,
              "冒険": 2,
              "探索": 2,
              "ポケモン": 5,
              "マリオ": 6,
              "カービィ": 6,
              "どうぶつの森": 7,
              "Minecraft": 6,
              "マインクラフト": 6,
          }

          NEGATIVE = {
              "成人向け": -15,
              "R18": -15,
              "18禁": -15,
              "アダルト": -15,
              "エロ": -15,
              "性的": -15,
              "ホラー": -8,
              "恐怖": -6,
              "グロ": -15,
              "ゴア": -15,
              "残酷": -12,
              "殺人": -10,
              "サバイバルホラー": -15,
          }

          def family_score(text):

              low = text.lower()
              score = 0
              hits = []

              for key, value in POSITIVE.items():
                  if key.lower() in low:
                      score += value
                      hits.append(key)

              for key, value in NEGATIVE.items():
                  if key.lower() in low:
                      score += value

              return score, list(dict.fromkeys(hits))

          # ============================================================
          # 6. Images
          # ============================================================

          def get_html(url):

              try:
                  r = session.get(
                      url,
                      timeout=12,
                      allow_redirects=True
                  )

                  if r.ok:
                      return r.text

              except Exception:
                  pass

              return ""

          def page_images(url):

              html = get_html(url)

              if not html:
                  return []

              soup = BeautifulSoup(html, "html.parser")
              result = []

              for tag in soup.find_all(["meta", "img"]):

                  u = ""

                  if tag.name == "meta":
                      if tag.get("property") in [
                          "og:image",
                          "twitter:image"
                      ]:
                          u = tag.get("content", "")

                  else:
                      u = (
                          tag.get("src")
                          or tag.get("data-src")
                          or ""
                      )

                  if u.startswith("//"):
                      u = "https:" + u

                  if u.startswith("http"):
                      result.append(u)

              return result[:30]

          def bing_images(game):

              url = (
                  "https://www.bing.com/images/search?q="
                  + quote(game + " game screenshot")
              )

              html = get_html(url)

              if not html:
                  return []

              soup = BeautifulSoup(html, "html.parser")
              result = []

              for a in soup.select("a.iusc"):

                  try:
                      data = json.loads(
                          a.get("m", "{}")
                      )

                      u = data.get("turl", "")

                      if u.startswith("http"):
                          result.append(u)

                  except Exception:
                      pass

              return result[:30]

          def steam_images(game):

              result = []

              try:
                  r = session.get(
                      "https://store.steampowered.com/api/storesearch/",
                      params={
                          "term": game,
                          "l": "japanese",
                          "cc": "jp"
                      },
                      timeout=10
                  )

                  data = r.json()
                  items = data.get("items", [])

                  if not items:
                      return result

                  appid = items[0].get("id")

                  if not appid:
                      return result

                  r2 = session.get(
                      f"https://store.steampowered.com/api/appdetails"
                      f"?appids={appid}&l=japanese",
                      timeout=10
                  )

                  data2 = r2.json()
                  app = data2.get(
                      str(appid),
                      {}
                  ).get("data", {})

                  for key in [
                      "header_image",
                      "capsule_image",
                      "library_capsule",
                  ]:
                      u = app.get(key)

                      if u:
                          result.append(u)

                  for s in app.get("screenshots", []):
                      u = s.get("path_full")

                      if u:
                          result.append(u)

              except Exception as ex:
                  print("STEAM ERROR:", ex)

              return result

          def download_image(url, path):

              try:
                  r = session.get(
                      url,
                      timeout=15,
                      stream=True
                  )

                  if not r.ok:
                      return False

                  data = r.content

                  if len(data) < 15000:
                      return False

                  im = Image.open(io.BytesIO(data))
                  im.verify()

                  path.write_bytes(data)

                  im2 = Image.open(path).convert("RGB")

                  w, h = im2.size

                  if w < 500 or h < 300:
                      path.unlink(missing_ok=True)
                      return False

                  # Reject extremely narrow images.
                  ratio = w / h

                  if ratio < 0.45 or ratio > 3.5:
                      path.unlink(missing_ok=True)
                      return False

                  # Reject almost blank images.
                  thumb = im2.resize((32, 32))
                  pixels = list(thumb.getdata())

                  brightness = sum(
                      sum(p) / 3
                      for p in pixels
                  ) / len(pixels)

                  if brightness < 8 or brightness > 250:
                      path.unlink(missing_ok=True)
                      return False

                  return True

              except Exception:
                  path.unlink(missing_ok=True)
                  return False

          # ============================================================
          # 7. Select candidate
          # ============================================================

          selected = None

          candidates = []

          for article in articles[:100]:

              text = (
                  article["title"]
                  + " "
                  + article["summary"]
              )

              score, hits = family_score(text)

              if score < 6:
                  continue

              title = game_title(article["title"])

              if len(title) < 2:
                  continue

              rel = release_date(text)
              plats = platforms(text)

              candidates.append({
                  "score": score,
                  "hits": hits,
                  "game": title,
                  "release": rel,
                  "platforms": plats,
                  "article": article
              })

          candidates.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          print("FAMILY CANDIDATES:", len(candidates))

          # ============================================================
          # 8. Find actual game images
          # ============================================================

          for candidate in candidates[:20]:

              game = candidate["game"]

              print(
                  "CHECK:",
                  game,
                  "score=",
                  candidate["score"]
              )

              urls = []

              urls += steam_images(game)
              urls += bing_images(game)
              urls += page_images(
                  candidate["article"]["link"]
              )

              # Deduplicate
              unique = []

              for u in urls:
                  if u and u not in unique:
                      unique.append(u)

              game_dir = IMG / re.sub(
                  r"[^a-zA-Z0-9_-]+",
                  "_",
                  game
              )[:40]

              game_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              usable = []

              for idx, url in enumerate(unique[:40]):

                  path = game_dir / f"image_{idx}.jpg"

                  if download_image(url, path):

                      usable.append(path)

                      print(
                          "IMAGE OK:",
                          path
                      )

                  if len(usable) >= 5:
                      break

              if len(usable) >= 3:

                  candidate["images"] = usable

                  selected = candidate

                  break

          if not selected:

              print(
                  "NO VIDEO: "
                  "親子向け候補またはゲーム画像が不足"
              )

              raise SystemExit(0)

          # ============================================================
          # 9. Script
          # ============================================================

          game = selected["game"]
          rel = selected["release"]
          plats = selected["platforms"]

          if not plats:
              plats = ["対応機種は記事で確認"]

          hits = selected["hits"]

          if any(
              x in hits
              for x in [
                  "協力プレイ",
                  "協力",
                  "ローカルマルチ",
                  "2人プレイ",
                  "4人",
                  "co-op"
              ]
          ):
              feature = (
                  "親子で一緒に協力プレイを楽しめるのがポイント。"
              )

          elif any(
              x in hits
              for x in [
                  "教育",
                  "学習",
                  "知育"
              ]
          ):
              feature = (
                  "遊びながら考えたり学んだりできるのがポイント。"
              )

          elif any(
              x in hits
              for x in [
                  "パーティー",
                  "パーティ"
              ]
          ):
              feature = (
                  "家族みんなでワイワイ遊びやすい作品。"
              )

          elif any(
              x in hits
              for x in [
                  "クラフト",
                  "サンドボックス",
                  "Minecraft",
                  "マインクラフト"
              ]
          ):
              feature = (
                  "親子で自由に遊び方を作れるタイプ。"
              )

          elif any(
              x in hits
              for x in [
                  "マリオ",
                  "カービィ",
                  "ポケモン",
                  "どうぶつの森"
              ]
          ):
              feature = (
                  "子どもだけでなく大人も一緒に楽しみやすい作品。"
              )

          else:
              feature = (
                  "親子で遊ぶゲーム候補としてチェックしたい作品。"
              )

          hooks = [
              f"これ、親子で遊ぶゲーム候補にあり。",
              f"今度の週末、親子でこれどう？",
              f"子どもと一緒に遊ぶなら、これ。",
              f"親子ゲームを探してるなら、これチェック。",
          ]

          hook = hooks[
              selected["score"] % len(hooks)
          ]

          platform_text = "、".join(plats[:3])

          n1 = (
              f"{hook}"
              f"{game}の最新情報です。"
          )

          n2 = (
              f"{rel}。"
              f"{feature}"
          )

          n3 = (
              f"対応機種は{platform_text}。"
              f"親子ゲーム候補として保存しておこう。"
          )

          narrations = [
              n1[:80],
              n2[:90],
              n3[:90]
          ]

          (OUT / "script.txt").write_text(
              "\n".join(
                  f"[{i+1}] {x}"
                  for i, x in enumerate(narrations)
              ),
              encoding="utf-8"
          )

          (OUT / "source.txt").write_text(
              f"game={game}\n"
              f"score={selected['score']}\n"
              f"family_hits={','.join(hits)}\n"
              f"release={rel}\n"
              f"platforms={','.join(plats)}\n"
              f"source={selected['article']['link']}\n"
              f"news_title={selected['article']['title']}\n",
              encoding="utf-8"
          )

          # ============================================================
          # 10. Voice
          # ============================================================

          VOICEVOX = "http://127.0.0.1:50021"

          # ずんだもん
          SPEAKER = 3

          def make_voice(text, out):

              q = session.post(
                  VOICEVOX + "/audio_query",
                  params={
                      "text": text,
                      "speaker": SPEAKER
                  },
                  timeout=30
              )

              q.raise_for_status()

              query = q.json()

              query["speedScale"] = 1.08
              query["intonationScale"] = 1.05

              r = session.post(
                  VOICEVOX + "/synthesis",
                  params={
                      "speaker": SPEAKER
                  },
                  json=query,
                  timeout=60
              )

              r.raise_for_status()

              out.write_bytes(r.content)

          voice_files = []

          for i, text in enumerate(
              narrations,
              1
          ):

              path = OUT / f"voice{i}.wav"

              make_voice(
                  text,
                  path
              )

              voice_files.append(path)

          # ============================================================
          # 11. Original BGM
          # ============================================================

          bgm = OUT / "bgm.wav"

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  "sine=frequency=110:duration=15:sample_rate=44100",
                  "-f",
                  "lavfi",
                  "-i",
                  "sine=frequency=220:duration=15:sample_rate=44100",
                  "-f",
                  "lavfi",
                  "-i",
                  "sine=frequency=330:duration=15:sample_rate=44100",
                  "-filter_complex",
                  (
                      "[0:a]volume=0.08[a];"
                      "[1:a]volume=0.045[b];"
                      "[2:a]volume=0.025[c];"
                      "[a][b][c]amix=inputs=3:"
                      "duration=longest,"
                      "afade=t=in:st=0:d=1,"
                      "afade=t=out:st=13.5:d=1.5"
                  ),
                  "-ar",
                  "44100",
                  "-ac",
                  "2",
                  str(bgm)
              ],
              check=True
          )

          # ============================================================
          # 12. Visual design
          # ============================================================

          W = 1080
          H = 1920

          FONT_BOLD = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Bold.ttc"
          )

          FONT_REG = (
              "/usr/share/fonts/opentype/noto/"
              "NotoSansCJK-Regular.ttc"
          )

          def font(size, bold=True):
              return ImageFont.truetype(
                  FONT_BOLD if bold else FONT_REG,
                  size
              )

          def fit_cover(im, size):

              tw, th = size
              iw, ih = im.size

              scale = max(
                  tw / iw,
                  th / ih
              )

              nw = int(iw * scale)
              nh = int(ih * scale)

              im = im.resize(
                  (nw, nh),
                  Image.Resampling.LANCZOS
              )

              left = (nw - tw) // 2
              top = (nh - th) // 2

              return im.crop(
                  (
                      left,
                      top,
                      left + tw,
                      top + th
                  )
              )

          def wrap_japanese(text, max_chars):

              lines = []
              current = ""

              for char in text:

                  current += char

                  if len(current) >= max_chars:

                      lines.append(current)
                      current = ""

              if current:
                  lines.append(current)

              return lines

          scene_info = [
              (
                  narrations[0],
                  "親子で遊ぶなら",
                  "PARENT GAME"
              ),
              (
                  narrations[1],
                  "ここがポイント",
                  "CHECK"
              ),
              (
                  narrations[2],
                  "週末ゲーム候補",
                  "SAVE"
              ),
          ]

          images = selected["images"][:3]

          for i, image_path in enumerate(
              images,
              1
          ):

              im = Image.open(
                  image_path
              ).convert("RGB")

              background = fit_cover(
                  im,
                  (W, H)
              ).filter(
                  ImageFilter.GaussianBlur(20)
              )

              canvas = background.copy()

              main = fit_cover(
                  im,
                  (W, 1300)
              )

              canvas.paste(
                  main,
                  (0, 300)
              )

              draw = ImageDraw.Draw(
                  canvas,
                  "RGBA"
              )

              # Top gradient area
              draw.rectangle(
                  (0, 0, W, 390),
                  fill=(0, 0, 0, 150)
              )

              # Bottom caption area
              draw.rectangle(
                  (0, 1570, W, H),
                  fill=(0, 0, 0, 175)
              )

              # Small badge
              draw.rounded_rectangle(
                  (55, 60, 350, 130),
                  radius=25,
                  fill=(255, 255, 255, 235)
              )

              draw.text(
                  (82, 77),
                  scene_info[i-1][2],
                  font=font(27),
                  fill=(15, 15, 15, 255)
              )

              # Game title
              draw.text(
                  (55, 175),
                  game[:24],
                  font=font(57),
                  fill=(255, 255, 255, 255)
              )

              # Scene heading
              draw.text(
                  (55, 250),
                  scene_info[i-1][1],
                  font=font(43),
                  fill=(255, 235, 80, 255)
              )

              # Subtitle
              lines = wrap_japanese(
                  scene_info[i-1][0],
                  20
              )

              y = 1640

              for line in lines[:3]:

                  bbox = draw.textbbox(
                      (0, 0),
                      line,
                      font=font(46)
                  )

                  tw = bbox[2] - bbox[0]

                  x = (W - tw) // 2

                  draw.text(
                      (x + 3, y + 3),
                      line,
                      font=font(46),
                      fill=(0, 0, 0, 240)
                  )

                  draw.text(
                      (x, y),
                      line,
                      font=font(46),
                      fill=(255, 255, 255, 255)
                  )

                  y += 66

              # Progress bar
              x0 = 55
              x1 = 1025
              y0 = 1835
              y1 = 1847

              draw.rounded_rectangle(
                  (x0, y0, x1, y1),
                  radius=6,
                  fill=(255, 255, 255, 90)
              )

              seg = (x1 - x0) / 3

              draw.rounded_rectangle(
                  (
                      x0 + (i - 1) * seg,
                      y0,
                      x0 + i * seg,
                      y1
                  ),
                  radius=6,
                  fill=(255, 255, 255, 235)
              )

              canvas.save(
                  SCENES / f"scene{i}.png"
              )

          # ============================================================
          # 13. Visual MP4
          # ============================================================

          concat = OUT / "scenes.txt"

          concat.write_text(
              "\n".join(
                  [
                      f"file '{(SCENES/'scene1.png').resolve()}'",
                      "duration 5",
                      f"file '{(SCENES/'scene2.png').resolve()}'",
                      "duration 5",
                      f"file '{(SCENES/'scene3.png').resolve()}'",
                      "duration 5",
                      f"file '{(SCENES/'scene3.png').resolve()}'",
                  ]
              ),
              encoding="utf-8"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat),
                  "-vf",
                  (
                      "scale=1080:1920:"
                      "force_original_aspect_ratio=decrease,"
                      "pad=1080:1920:"
                      "(ow-iw)/2:(oh-ih)/2"
                  ),
                  "-t",
                  "15",
                  "-r",
                  "30",
                  "-c:v",
                  "libx264",
                  "-pix_fmt",
                  "yuv420p",
                  "-an",
                  str(OUT / "visual.mp4")
              ],
              check=True
          )

          # ============================================================
          # 14. Narration concat
          # ============================================================

          voice_list = OUT / "voice_list.txt"

          voice_list.write_text(
              "\n".join(
                  f"file '{p.resolve()}'"
                  for p in voice_files
              ),
              encoding="utf-8"
          )

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(voice_list),
                  "-af",
                  "apad,atrim=0:15",
                  "-ar",
                  "44100",
                  "-ac",
                  "2",
                  str(OUT / "voice_all.wav")
              ],
              check=True
          )

          # ============================================================
          # 15. Final MP4
          # ============================================================

          final = OUT / "parent_game_radar.mp4"

          subprocess.run(
              [
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(OUT / "visual.mp4"),
                  "-i",
                  str(OUT / "voice_all.wav"),
                  "-i",
                  str(bgm),
                  "-filter_complex",
                  (
                      "[1:a]volume=1.0[n];"
                      "[2:a]volume=0.12[b];"
                      "[n][b]amix=inputs=2:"
                      "duration=longest:"
                      "dropout_transition=0[mix]"
                  ),
                  "-map",
                  "0:v:0",
                  "-map",
                  "[mix]",
                  "-t",
                  "15",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-movflags",
                  "+faststart",
                  str(final)
              ],
              check=True
          )

          print("")
          print("======================================")
          print("VIDEO CREATED")
          print(final)
          print("GAME:", game)
          print("SCORE:", selected["score"])
          print("RELEASE:", rel)
          print("PLATFORMS:", plats)
          print("======================================")

          PY

      - name: Generate video
        run: |
          python make_game_news.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-game-radar-${{ github.run_number }}
          path: |
            output/
            make_game_news.py
          if-no-files-found: warn
